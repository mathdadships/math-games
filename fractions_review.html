<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fractions Review</title>
    <script src="tracker.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F7F4;
            --card: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7094;
            --accent: #4A6CF7;
            --accent-light: #EEF1FE;
            --border: #E8E8EE;
            --progress-track: #E8E8EE;
            --progress-fill: #4A6CF7;
            --correct-soft: #E8F5E9;
            --wrong-soft: #FFF3E0;
            --amber: #E8A838;
            --green: #43A047;
            --radius: 16px;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ── PROGRESS BAR ── */
        .progress-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 4px; background: var(--progress-track); z-index: 100;
        }
        .progress-fill {
            height: 100%; background: var(--progress-fill);
            width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 2px 2px 0;
        }

        /* ── MAIN CONTAINER ── */
        .container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px;
            position: relative;
            overflow-y: auto;
        }

        /* ── QUESTION CARD ── */
        .question-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(24px, 4vw, 40px);
            max-width: 560px; width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .question-card.slide-out {
            opacity: 0; transform: translateX(-40px);
        }
        .question-card.slide-in {
            opacity: 0; transform: translateX(40px);
        }

        .question-label {
            font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-secondary); margin-bottom: 12px;
        }

        .question-text {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(20px, 3.5vw, 28px);
            line-height: 1.4; margin-bottom: 24px;
            color: var(--text);
        }

        /* ── FRACTION DISPLAY ── */
        .fraction {
            display: inline-flex; flex-direction: column;
            align-items: center; vertical-align: middle;
            margin: 0 4px; position: relative; top: -2px;
        }
        .fraction-num, .fraction-den {
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(20px, 3vw, 26px); font-weight: 700;
            line-height: 1.2; text-align: center; min-width: 20px;
        }
        .fraction-bar {
            width: 100%; height: 2px; background: var(--text);
            margin: 2px 0; min-width: 24px;
        }
        .fraction-lg .fraction-num, .fraction-lg .fraction-den {
            font-size: clamp(28px, 4vw, 36px);
        }
        .fraction-lg .fraction-bar { height: 3px; min-width: 32px; }

        /* ── VISUAL MODELS ── */
        .visual-container {
            margin: 20px 0; display: flex;
            justify-content: center; align-items: center; gap: 24px;
            flex-wrap: wrap;
        }

        /* Fraction Bar Model */
        .fraction-bar-model {
            display: flex; border-radius: 8px;
            overflow: hidden; border: 2px solid var(--text);
            height: 48px; width: min(100%, 360px);
        }
        .bar-segment {
            flex: 1; border-right: 1.5px solid var(--text);
            transition: background 0.3s ease;
        }
        .bar-segment:last-child { border-right: none; }
        .bar-segment.shaded { background: var(--accent); }
        .bar-segment.unshaded { background: var(--card); }

        /* Number Line Model */
        .number-line-container {
            width: min(100%, 400px); position: relative;
            padding: 32px 16px 24px;
        }
        .number-line {
            width: 100%; height: 3px; background: var(--text);
            position: relative; border-radius: 2px;
        }
        .nl-tick {
            position: absolute; top: -8px;
            width: 2px; height: 19px; background: var(--text);
            transform: translateX(-50%);
        }
        .nl-label {
            position: absolute; top: 16px;
            font-size: 14px; font-weight: 600;
            transform: translateX(-50%); color: var(--text-secondary);
            white-space: nowrap;
        }
        .nl-point {
            position: absolute; top: -14px;
            width: 16px; height: 16px; background: var(--accent);
            border-radius: 50%; border: 3px solid var(--text);
            transform: translateX(-50%); z-index: 2;
        }
        .nl-point-label {
            position: absolute; top: -36px;
            font-size: 16px; font-weight: 700;
            transform: translateX(-50%); color: var(--accent);
            white-space: nowrap;
        }
        .nl-place-label {
            position: absolute; top: -48px;
            font-size: 10px; font-weight: 600;
            transform: translateX(-50%) rotate(-25deg);
            transform-origin: bottom center;
            color: var(--text); white-space: nowrap;
        }

        /* Comparison Visual */
        .comparison-visual {
            display: flex; flex-direction: column; gap: 12px;
            width: min(100%, 360px);
        }
        .comp-row {
            display: flex; align-items: center; gap: 12px;
        }
        .comp-label {
            font-size: 14px; font-weight: 600;
            color: var(--text-secondary); min-width: 40px; text-align: right;
        }
        .comp-bar-wrap {
            flex: 1; height: 32px; border-radius: 6px;
            border: 2px solid var(--border); overflow: hidden;
            background: var(--card);
        }
        .comp-bar-fill {
            height: 100%; background: var(--accent);
            border-radius: 4px 0 0 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Fraction Comparison Display */
        .comparison-equation {
            display: flex; align-items: center;
            justify-content: center; gap: 20px;
            margin: 16px 0;
        }
        .comparison-blank {
            width: 48px; height: 48px;
            border: 2px dashed var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700; color: var(--accent);
        }

        /* Mini number line in choices */
        .mini-nl-wrap {
            width: 100%; position: relative; padding: 6px 6px 18px;
        }
        .mini-nl {
            width: 100%; height: 2px; background: var(--text); position: relative;
        }
        .mini-nl-tick {
            position: absolute; top: -5px;
            width: 1.5px; height: 12px; background: var(--text);
            transform: translateX(-50%);
        }
        .mini-nl-point {
            position: absolute; top: -8px;
            width: 10px; height: 10px; background: var(--accent);
            border-radius: 50%; border: 2px solid var(--text);
            transform: translateX(-50%); z-index: 2;
        }
        .mini-nl-endlabel {
            position: absolute; top: 8px; font-size: 9px; font-weight: 600;
            transform: translateX(-50%); color: var(--text-secondary);
        }

        /* Mini fraction strip in choices */
        .mini-strip {
            display: flex; border-radius: 4px; overflow: hidden;
            border: 1.5px solid var(--text); height: 22px; width: 100%;
        }
        .mini-strip-seg {
            flex: 1; border-right: 1px solid var(--text);
        }
        .mini-strip-seg:last-child { border-right: none; }
        .mini-strip-seg.shaded { background: var(--accent); opacity: 0.6; }
        .mini-strip-seg.unshaded { background: var(--card); }

        /* ── ANSWER OPTIONS ── */

        /* Multiple Choice */
        .mc-options {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-top: 8px;
        }
        .mc-options.single-col { grid-template-columns: 1fr; }
        .mc-option {
            background: var(--bg); border: 2px solid var(--border);
            border-radius: 12px; padding: 16px;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            cursor: pointer; transition: all 0.2s ease;
            min-height: 64px;
        }
        .mc-option:hover { border-color: var(--accent); background: var(--accent-light); }
        .mc-option:active { transform: scale(0.97); }

        /* Comparison Symbol Select */
        .symbol-options {
            display: flex; justify-content: center;
            gap: 16px; margin-top: 8px;
        }
        .symbol-btn {
            width: 72px; height: 72px;
            background: var(--bg); border: 2px solid var(--border);
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
            color: var(--text);
        }
        .symbol-btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
        .symbol-btn:active { transform: scale(0.93); }

        /* Type-in Fraction Input */
        .fraction-input-area {
            display: flex; align-items: center;
            justify-content: center; gap: 16px; margin-top: 16px;
        }
        .fraction-input {
            display: inline-flex; flex-direction: column;
            align-items: center; gap: 4px;
        }
        .fraction-input input {
            width: 64px; height: 52px;
            border: 2px solid var(--border); border-radius: 10px;
            text-align: center; font-size: 24px; font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            color: var(--text); background: var(--bg);
            outline: none; transition: border-color 0.2s;
            -moz-appearance: textfield;
        }
        .fraction-input input::-webkit-inner-spin-button,
        .fraction-input input::-webkit-outer-spin-button { -webkit-appearance: none; }
        .fraction-input input:focus { border-color: var(--accent); background: white; }
        .fraction-input-bar {
            width: 64px; height: 3px; background: var(--text); border-radius: 2px;
        }
        .submit-btn {
            background: var(--accent); color: white;
            border: none; border-radius: 12px;
            padding: 14px 32px; font-size: 16px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.2s;
            margin-top: 16px;
        }
        .submit-btn:hover { background: #3B5DE7; transform: translateY(-1px); }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ── START SCREEN ── */
        .start-screen {
            text-align: center; max-width: 480px;
        }
        .start-title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(28px, 5vw, 40px);
            margin-bottom: 12px;
        }
        .start-subtitle {
            font-size: 16px; color: var(--text-secondary);
            line-height: 1.6; margin-bottom: 32px;
        }
        .start-btn {
            background: var(--accent); color: white;
            border: none; border-radius: 14px;
            padding: 18px 48px; font-size: 18px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(74, 108, 247, 0.3);
        }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(74, 108, 247, 0.4); }
        .start-btn:active { transform: scale(0.97); }

        /* ── END SCREEN ── */
        .end-screen {
            text-align: center; max-width: 520px; width: 100%;
        }
        .end-title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(24px, 4vw, 34px);
            margin-bottom: 8px;
        }
        .end-subtitle {
            font-size: 15px; color: var(--text-secondary);
            margin-bottom: 28px;
        }
        .results-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-bottom: 28px; text-align: left;
        }
        .result-card {
            background: var(--card); border-radius: 12px;
            padding: 16px; box-shadow: var(--shadow);
        }
        .result-card-label {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-secondary);
            margin-bottom: 6px; font-weight: 600;
        }
        .result-card-value {
            font-size: 22px; font-weight: 700;
        }
        .result-mastered { color: var(--green); }
        .result-working { color: var(--amber); }

        .ai-feedback-card {
            background: var(--card); border-radius: var(--radius);
            padding: 24px; box-shadow: var(--shadow);
            text-align: left; margin-bottom: 24px;
            border-left: 4px solid var(--accent);
        }
        .ai-feedback-label {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent);
            margin-bottom: 10px; font-weight: 700;
        }
        .ai-feedback-text {
            font-size: 16px; line-height: 1.7; color: var(--text);
        }
        .ai-loading {
            display: flex; align-items: center;
            justify-content: center; gap: 8px;
            padding: 20px; color: var(--text-secondary);
        }
        .ai-loading .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); animation: pulse 1.4s ease-in-out infinite;
        }
        .ai-loading .dot:nth-child(2) { animation-delay: 0.2s; }
        .ai-loading .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .restart-btn {
            background: var(--bg); color: var(--text);
            border: 2px solid var(--border); border-radius: 12px;
            padding: 14px 32px; font-size: 16px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.2s;
        }
        .restart-btn:hover { border-color: var(--accent); background: var(--accent-light); }

        /* ── UTILITIES ── */
        .hidden { display: none !important; }

        /* ── TUTOR MODE ── */
        .tutor-badge {
            display: inline-block; background: var(--accent-light);
            color: var(--accent); font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            padding: 4px 10px; border-radius: 20px; margin-bottom: 12px;
        }
        .hint-box {
            margin-top: 20px; padding: 16px 20px;
            background: #FFFBF0; border: 2px solid var(--amber);
            border-radius: 12px; font-size: 15px; line-height: 1.6;
            color: var(--text); animation: hintAppear 0.3s ease;
        }
        .hint-box .hint-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--amber); margin-bottom: 6px;
        }
        .hint-box .hint-text { color: var(--text); }
        .hint-box.ai-hint {
            background: var(--accent-light); border-color: var(--accent);
        }
        .hint-box.ai-hint .hint-label { color: var(--accent); }
        .hint-loading {
            display: flex; align-items: center; gap: 8px;
            color: var(--text-secondary); font-size: 14px;
        }
        .hint-loading .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent); animation: pulse 1.4s ease-in-out infinite;
        }
        .hint-loading .dot:nth-child(2) { animation-delay: 0.2s; }
        .hint-loading .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes hintAppear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tutor-progress {
            font-size: 13px; color: var(--text-secondary);
            text-align: center; margin-bottom: 16px;
        }
        .tutor-btn {
            background: var(--amber); color: white;
            border: none; border-radius: 12px;
            padding: 14px 32px; font-size: 16px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.2s;
            margin-top: 8px;
        }
        .tutor-btn:hover { background: #D49530; transform: translateY(-1px); }
        .tutor-btn:active { transform: scale(0.97); }
        .start-tutor-section {
            margin-top: 24px; padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .start-tutor-info {
            font-size: 14px; color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .btn-row {
            display: flex; gap: 12px; justify-content: center;
            flex-wrap: wrap; margin-top: 12px;
        }

        @media (max-width: 500px) {
            .mc-options:not(.force-2col) { grid-template-columns: 1fr; }
            .results-grid { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            .question-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="container" id="mainContainer">
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-title">Fractions Practice</div>
        <div class="start-subtitle">
            Answer questions about fractions at your own pace.<br>
            Take your time — there's no timer.
        </div>
        <button class="start-btn" onclick="startSession()">Begin</button>
        <div class="start-tutor-section hidden" id="startTutorSection">
            <div class="start-tutor-info" id="startTutorInfo"></div>
            <button class="tutor-btn" onclick="startTutorFromSaved()">Review Missed Questions</button>
        </div>
    </div>

    <!-- Question Card -->
    <div class="question-card hidden" id="questionCard">
        <div class="tutor-badge hidden" id="tutorBadge">Tutor Mode</div>
        <div class="tutor-progress hidden" id="tutorProgress"></div>
        <div class="question-label" id="questionLabel"></div>
        <div class="question-text" id="questionText"></div>
        <div class="visual-container" id="visualContainer"></div>
        <div id="answerArea"></div>
        <div id="hintArea"></div>
    </div>

    <!-- End Screen -->
    <div class="end-screen hidden" id="endScreen">
        <div class="end-title">Practice Complete</div>
        <div class="end-subtitle" id="endSubtitle"></div>
        <div class="results-grid" id="resultsGrid"></div>
        <div class="ai-feedback-card" id="aiFeedbackCard">
            <div class="ai-feedback-label">Your Practice Summary</div>
            <div id="aiFeedbackContent">
                <div class="ai-loading">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <span style="margin-left:4px">Preparing your feedback...</span>
                </div>
            </div>
        </div>
        <div class="btn-row">
            <button class="restart-btn" onclick="restartSession()">Practice Again</button>
            <button class="tutor-btn hidden" id="endTutorBtn" onclick="startTutorFromSession()">Review Missed Questions</button>
        </div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════
// ███ ADAPTIVE ENGINE (UNCHANGED FROM ORIGINAL) ███
// ═══════════════════════════════════════════

const CATEGORIES = ['identify', 'numberline', 'comparing', 'equivalent'];
const MASTERY_THRESHOLD = 3;
const MAX_PROBLEMS = 25;
const REQUEUE_DELAY = 2;

let sessionData = {
    answers: [],
    categoryCorrect: { identify: 0, numberline: 0, comparing: 0, equivalent: 0 },
    categoryTotal: { identify: 0, numberline: 0, comparing: 0, equivalent: 0 },
    totalAnswered: 0,
    startTime: null
};

let queue = [];
let currentProblem = null;
let requeueBuffer = [];
let problemsSinceRequeue = 0;

// Globals for GameTracker.checkAutoSave()
var questionsAnswered = 0;
var score = 0;
var bestStreak = 0;
var _currentStreak = 0;

function buildInitialQueue() {
    queue = [];
    CATEGORIES.forEach(cat => { for (let i = 0; i < 3; i++) queue.push(cat); });
    shuffleArray(queue);
}

function getNextCategory() {
    for (let i = requeueBuffer.length - 1; i >= 0; i--) {
        if (problemsSinceRequeue >= requeueBuffer[i].insertAfter) {
            const cat = requeueBuffer[i].category;
            requeueBuffer.splice(i, 1);
            if (sessionData.categoryCorrect[cat] < MASTERY_THRESHOLD) return cat;
        }
    }
    while (queue.length > 0) {
        const cat = queue.shift();
        if (sessionData.categoryCorrect[cat] < MASTERY_THRESHOLD) return cat;
    }
    const unmastered = CATEGORIES.filter(c => sessionData.categoryCorrect[c] < MASTERY_THRESHOLD);
    if (unmastered.length > 0) return unmastered[Math.floor(Math.random() * unmastered.length)];
    return null;
}

function recordAnswer(category, correct, problem, response) {
    sessionData.answers.push({ category, correct, problem, response, timestamp: Date.now() });
    sessionData.categoryTotal[category]++;
    sessionData.totalAnswered++;
    problemsSinceRequeue++;

    // Update globals for GameTracker auto-save
    questionsAnswered = sessionData.totalAnswered;
    if (correct) {
        sessionData.categoryCorrect[category]++;
        score++;
        _currentStreak++;
        if (_currentStreak > bestStreak) bestStreak = _currentStreak;
    } else {
        _currentStreak = 0;
        requeueBuffer.push({ category, insertAfter: REQUEUE_DELAY });
        problemsSinceRequeue = 0;
    }
}

function isSessionComplete() {
    if (CATEGORIES.every(c => sessionData.categoryCorrect[c] >= MASTERY_THRESHOLD)) return true;
    if (sessionData.totalAnswered >= MAX_PROBLEMS) return true;
    return false;
}

function getProgress() {
    let total = 0;
    CATEGORIES.forEach(c => { total += Math.min(sessionData.categoryCorrect[c], MASTERY_THRESHOLD); });
    return total / (CATEGORIES.length * MASTERY_THRESHOLD);
}

// ═══════════════════════════════════════════
// ███ HELPERS ███
// ═══════════════════════════════════════════

function makeFractionHTML(n, d, large) {
    return `<span class="fraction ${large ? 'fraction-lg' : ''}"><span class="fraction-num">${n}</span><span class="fraction-bar"></span><span class="fraction-den">${d}</span></span>`;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function pickFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickTwo(arr) { const s = [...arr]; shuffleArray(s); return [s[0], s[1]]; }
function range(start, end) { const a = []; for (let i = start; i <= end; i++) a.push(i); return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b) { [a,b] = [b, a%b]; } return a; }
function fracEq(n1,d1,n2,d2) { return n1*d2 === n2*d1; }

function addUnique(arr, val) {
    if (!arr.includes(val) && val.split('/').every(n => parseInt(n) > 0)) arr.push(val);
}

function finalizeChoices(choices, correct) {
    const unique = [...new Set(choices)].filter(c => c.split('/').every(n => parseInt(n) > 0 && !isNaN(parseInt(n))));
    const distractors = unique.filter(c => c !== correct);
    shuffleArray(distractors);
    const final4 = [correct, ...distractors.slice(0, 3)];
    let safety = 0;
    while (final4.length < 4 && safety < 20) {
        const r = `${randInt(1,7)}/${randInt(2,8)}`;
        if (!final4.includes(r)) final4.push(r);
        safety++;
    }
    shuffleArray(final4);
    return final4;
}

// Sub-type rotation to avoid repeats
let recentSubTypes = [];
function pickSubType(types) {
    const avail = types.filter(t => !recentSubTypes.includes(t));
    const pool = avail.length > 0 ? avail : types;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    recentSubTypes.push(pick);
    if (recentSubTypes.length > 5) recentSubTypes.shift();
    return pick;
}

function generateProblem(category) {
    switch (category) {
        case 'identify': return generateIdentifyProblem();
        case 'numberline': return generateNumberLineProblem();
        case 'comparing': return generateComparingProblem();
        case 'equivalent': return generateEquivalentProblem();
    }
}

// ── IDENTIFY: shaded bar OR word problem ──
function generateIdentifyProblem() {
    const sub = pickSubType(['shaded_bar', 'word_problem', 'greater_than_one']);
    if (sub === 'word_problem') return genWordProblem();
    if (sub === 'greater_than_one') return genFractionGreaterThanOne();
    return genShadedBar();
}

function genShadedBar() {
    const denoms = [2, 3, 4, 6, 8];
    const denom = pickFrom(denoms);
    const numer = randInt(1, denom - 1);
    const correct = `${numer}/${denom}`;
    const choices = [correct];
    if (denom !== numer) addUnique(choices, `${denom}/${numer}`);
    if (numer > 1) addUnique(choices, `${numer - 1}/${denom}`);
    if (numer < denom) addUnique(choices, `${numer + 1}/${denom}`);
    addUnique(choices, `${denom - numer}/${denom}`);
    const altDenom = pickFrom(denoms.filter(d => d !== denom));
    addUnique(choices, `${numer}/${altDenom}`);

    return {
        category: 'identify', type: 'mc',
        question: 'What fraction of the shape is shaded?',
        visual: { type: 'bar', numer, denom },
        choices: finalizeChoices(choices, correct),
        answer: correct, numer, denom
    };
}

function genWordProblem() {
    const templates = [
        { text: (nm, data) => `${nm} and ${data.denom - 1} friend${data.denom-1>1?'s':''} share a pizza equally. What fraction does EACH person get?`,
          gen: () => { const d = randInt(2, 8); return { numer: 1, denom: d }; } },
        { text: (nm, data) => `${nm} divided a garden into ${data.denom} equal parts and planted seeds in ${data.numer} ${data.numer === 1 ? 'part' : 'parts'}. What fraction of the garden has seeds?`,
          gen: () => { const d = randInt(3, 8); return { numer: randInt(1, d-1), denom: d }; } },
        { text: (nm, data) => `${nm} has ${data.denom} marbles. ${data.numer} of them ${data.numer === 1 ? 'is' : 'are'} blue. What fraction of the marbles are blue?`,
          gen: () => { const d = randInt(3, 8); return { numer: randInt(1, d-1), denom: d }; } },
        { text: (nm, data) => `A rectangle is cut into ${data.denom} equal pieces. ${data.numer} ${data.numer === 1 ? 'piece is' : 'pieces are'} colored. What fraction is colored?`,
          gen: () => { const d = randInt(2, 8); return { numer: randInt(1, d-1), denom: d }; } }
    ];
    const names = ['Emma','Liam','Sophia','Noah','Olivia','Theo','Lily','James','Mia','Wendy'];
    const nm = pickFrom(names);
    const tmpl = pickFrom(templates);
    const data = tmpl.gen();
    const correct = `${data.numer}/${data.denom}`;
    const choices = [correct];
    addUnique(choices, `${data.denom}/${data.numer}`);
    addUnique(choices, `${data.denom - data.numer}/${data.denom}`);
    if (data.numer === 1) {
        addUnique(choices, `1/${data.denom + 1}`);
        addUnique(choices, `${data.denom}/${data.denom}`);
    } else {
        addUnique(choices, `${data.numer}/${data.denom + 1}`);
        addUnique(choices, `1/${data.denom}`);
    }
    return {
        category: 'identify', type: 'mc',
        question: tmpl.text(nm, data),
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct, numer: data.numer, denom: data.denom
    };
}

function genFractionGreaterThanOne() {
    // Shows multiple bar models (wholes), some fully shaded + last partially shaded
    // Matches assessment Q4: "Which fraction greater than one is represented by the shaded parts?"
    const denoms = [2, 3, 4];
    const denom = pickFrom(denoms);
    const numWholes = pickFrom([2, 3]); // 2 or 3 whole bars
    const partialShaded = randInt(1, denom - 1); // shaded parts in the last bar
    const totalShaded = (numWholes - 1) * denom + partialShaded; // all previous bars fully shaded + partial
    const correct = `${totalShaded}/${denom}`;

    const choices = [correct];
    // Distractor: only count the partial bar
    addUnique(choices, `${partialShaded}/${denom}`);
    // Distractor: count unshaded parts
    const unshaded = numWholes * denom - totalShaded;
    if (unshaded > 0) addUnique(choices, `${unshaded}/${denom}`);
    // Distractor: numerator = numWholes (confuse whole count with fraction)
    addUnique(choices, `${numWholes}/${denom}`);
    // Distractor: fraction less than one
    addUnique(choices, `${partialShaded}/${denom * numWholes}`);
    // Distractor: swapped
    addUnique(choices, `${denom}/${totalShaded}`);

    return {
        category: 'identify', type: 'mc',
        question: 'Which fraction greater than one is shown by the shaded parts?',
        visual: { type: 'multi_bar', denom, numWholes, totalShaded },
        choices: finalizeChoices(choices, correct),
        answer: correct, numer: totalShaded, denom
    };
}

// ── NUMBER LINE: 5 sub-types ──
function generateNumberLineProblem() {
    const sub = pickSubType(['point_to_fraction', 'labeled_places', 'fraction_to_point', 'pick_number_line', 'distance_between']);
    switch (sub) {
        case 'point_to_fraction': return genPointToFraction();
        case 'labeled_places': return genLabeledPlaces();
        case 'fraction_to_point': return genFractionToPoint();
        case 'pick_number_line': return genPickNumberLine();
        case 'distance_between': return genDistanceBetween();
    }
}

function genPointToFraction() {
    const denoms = [3, 4, 6, 8];
    const denom = pickFrom(denoms);
    const numer = randInt(1, denom - 1);
    const correct = `${numer}/${denom}`;
    const choices = [correct];
    addUnique(choices, `${numer}/${denom + 1}`);
    if (numer > 1) addUnique(choices, `${numer - 1}/${denom}`);
    addUnique(choices, `${numer + 1}/${denom}`);
    addUnique(choices, `${denom - numer}/${denom}`);
    const altD = pickFrom(denoms.filter(d => d !== denom));
    addUnique(choices, `${numer}/${altD}`);
    return {
        category: 'numberline', type: 'mc',
        question: 'What fraction does point P represent?',
        visual: { type: 'numberline', numer, denom },
        choices: finalizeChoices(choices, correct),
        answer: correct, numer, denom
    };
}

function genLabeledPlaces() {
    const scenarios = [
        { denom: 8, start: "Erin's House", places: [{name:"Fire Station",pos:1},{name:"Park",pos:3},{name:"School",pos:4},{name:"Market",pos:5},{name:"Library",pos:8}] },
        { denom: 8, start: "Home", places: [{name:"Bakery",pos:2},{name:"Playground",pos:3},{name:"Store",pos:5},{name:"Pool",pos:6},{name:"School",pos:8}] },
        { denom: 6, start: "Start", places: [{name:"Café",pos:1},{name:"Park",pos:2},{name:"Shop",pos:3},{name:"Library",pos:4},{name:"Finish",pos:6}] },
        { denom: 4, start: "Jordan's House", places: [{name:"Park",pos:1},{name:"Soccer Field",pos:2},{name:"School",pos:3},{name:"Library",pos:4}] }
    ];
    const scene = pickFrom(scenarios);
    const interior = scene.places.filter(p => p.pos > 0 && p.pos < scene.denom);
    const target = pickFrom(interior);
    const wrong = scene.places.filter(p => p.name !== target.name);
    shuffleArray(wrong);
    const choices = shuffleArray([target.name, ...wrong.slice(0, 3).map(p => p.name)]);
    return {
        category: 'numberline', type: 'mc_text',
        question: `Which place is ${makeFractionHTML(target.pos, scene.denom, false)} mile from ${scene.start}?`,
        visual: { type: 'labeled_numberline', denom: scene.denom, start: scene.start, places: scene.places },
        choices, answer: target.name
    };
}

function genFractionToPoint() {
    const denom = pickFrom([6, 8]); // need ≥5 interior positions for 4 unique points
    const allPos = range(1, denom - 1);
    shuffleArray(allPos);
    const positions = allPos.slice(0, 4).sort((a, b) => a - b);
    const labels = ['A','B','C','D'];
    const targetIdx = randInt(0, 3);
    return {
        category: 'numberline', type: 'mc_text',
        question: `Which point on the number line represents ${makeFractionHTML(positions[targetIdx], denom, false)}?`,
        visual: { type: 'multi_point', denom, points: positions.map((p,i) => ({pos:p, label:labels[i]})) },
        choices: shuffleArray([...labels]),
        answer: labels[targetIdx]
    };
}

function genPickNumberLine() {
    const targetDenom = pickFrom([3, 4, 6, 8]);
    const targetNumer = randInt(1, targetDenom - 1);
    const labels = ['A','B','C','D'];
    const correctIdx = randInt(0, 3);
    const lines = [];
    const used = new Set();
    used.add(`${targetNumer}-${targetDenom}`);
    for (let i = 0; i < 4; i++) {
        if (i === correctIdx) {
            lines.push({ denom: targetDenom, pointPos: targetNumer, label: labels[i] });
        } else {
            let d, p, safety = 0;
            do { d = pickFrom([2,3,4,5,6,8]); p = randInt(1, d-1); safety++; }
            while ((used.has(`${p}-${d}`) || fracEq(p,d,targetNumer,targetDenom)) && safety < 30);
            used.add(`${p}-${d}`);
            lines.push({ denom: d, pointPos: p, label: labels[i] });
        }
    }
    return {
        category: 'numberline', type: 'mc_visual_nl',
        question: `Which number line shows a point at ${makeFractionHTML(targetNumer, targetDenom, false)}?`,
        visual: null, lines,
        answer: labels[correctIdx]
    };
}

function genDistanceBetween() {
    // Matches assessment Q8: "Which two points have a fractional distance of 5/8 between them?"
    // Shows 5 labeled points on a number line, asks which pair has a specific distance
    const denom = pickFrom([6, 8]);
    const pointLabels = ['J','K','L','M','N','P','Q','R'];
    // Place 5 points at distinct positions on 0..denom
    const allPos = range(0, denom);
    shuffleArray(allPos);
    const positions = allPos.slice(0, 5).sort((a, b) => a - b);
    const labels5 = pointLabels.slice(0, 5);

    // Find all pairwise distances
    const pairs = [];
    for (let i = 0; i < 5; i++) {
        for (let j = i + 1; j < 5; j++) {
            const dist = positions[j] - positions[i];
            if (dist > 0 && dist < denom) {
                pairs.push({ a: i, b: j, dist });
            }
        }
    }
    if (pairs.length < 4) return genDistanceBetween(); // retry if not enough pairs

    // Pick a target pair — prefer distances ≥ 2 to make it non-trivial
    const goodPairs = pairs.filter(p => p.dist >= 2);
    const targetPair = goodPairs.length > 0 ? pickFrom(goodPairs) : pickFrom(pairs);
    const targetDist = targetPair.dist;

    // Build answer and distractors from actual pairs (wrong distances)
    const correctStr = `${labels5[targetPair.a]} and ${labels5[targetPair.b]}`;
    const wrongPairs = pairs.filter(p => p.dist !== targetDist);
    shuffleArray(wrongPairs);
    const distractors = wrongPairs.slice(0, 3).map(p => `${labels5[p.a]} and ${labels5[p.b]}`);

    // If not enough wrong pairs from actual points, generate more
    let safety = 0;
    while (distractors.length < 3 && safety < 20) {
        const i = randInt(0, 4), j = randInt(0, 4);
        if (i !== j) {
            const a = Math.min(i, j), b = Math.max(i, j);
            const str = `${labels5[a]} and ${labels5[b]}`;
            if (str !== correctStr && !distractors.includes(str)) distractors.push(str);
        }
        safety++;
    }

    const choices = shuffleArray([correctStr, ...distractors.slice(0, 3)]);

    return {
        category: 'numberline', type: 'mc_text',
        question: `Which two points have a distance of ${makeFractionHTML(targetDist, denom, false)} between them?`,
        visual: { type: 'multi_point', denom, points: positions.map((p, i) => ({ pos: p, label: labels5[i] })) },
        choices,
        answer: correctStr
    };
}

// ── COMPARING: 5 sub-types ──
function generateComparingProblem() {
    const sub = pickSubType(['compare_symbols', 'fill_blank', 'not_correct', 'two_greater', 'which_is_true']);
    switch (sub) {
        case 'compare_symbols': return genCompareSymbols();
        case 'fill_blank': return genFillBlank();
        case 'not_correct': return genNotCorrect();
        case 'two_greater': return genTwoGreater();
        case 'which_is_true': return genWhichIsTrue();
    }
}

function genCompareSymbols() {
    const denoms = [2,3,4,5,6,8];
    const sameNumer = Math.random() < 0.5;
    let n1,d1,n2,d2;
    if (sameNumer) {
        const num = randInt(1, 4);
        const pool = denoms.filter(d => d > num);
        [d1, d2] = pool.length >= 2 ? pickTwo(pool) : [3, 4];
        n1 = num; n2 = num;
    } else {
        const den = pickFrom(denoms.filter(d => d >= 3));
        [n1, n2] = pickTwo(range(1, den - 1));
        d1 = den; d2 = den;
    }
    const v1 = n1/d1, v2 = n2/d2;
    const answer = v1 < v2 ? '<' : v1 > v2 ? '>' : '=';
    return {
        category: 'comparing', type: 'symbol',
        question: 'Compare these fractions.',
        visual: { type: 'comparison', n1, d1, n2, d2 },
        answer, n1, d1, n2, d2
    };
}

function genFillBlank() {
    const denoms = [3,4,5,6,8];
    const denom = pickFrom(denoms);
    const numer = randInt(2, denom - 1);
    const op = pickFrom(['>','<']);
    let correctN;
    if (op === '>') {
        correctN = randInt(1, numer - 1);
    } else {
        if (numer + 1 >= denom) return genFillBlank(); // can't go higher, retry
        correctN = randInt(numer + 1, denom - 1);
    }
    const correct = `${correctN}/${denom}`;
    const choices = [correct];
    for (let i = 1; i < denom; i++) {
        if (i !== correctN && i !== numer) addUnique(choices, `${i}/${denom}`);
    }
    addUnique(choices, `${denom}/${denom}`);
    return {
        category: 'comparing', type: 'mc',
        question: `Which fraction goes in the blank?  ${makeFractionHTML(numer, denom, true)} ${op} ___`,
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct
    };
}

function genNotCorrect() {
    const denoms = [3,4,5,6,8];
    const comps = [];
    // 3 correct comparisons
    for (let i = 0; i < 3; i++) {
        let n1,d1,n2,d2;
        if (Math.random() < 0.5) {
            const d = pickFrom(denoms); n1 = randInt(1,d-1); n2 = randInt(1,d-1);
            while (n2 === n1) n2 = randInt(1,d-1);
            d1 = d; d2 = d;
        } else {
            const n = randInt(1,3);
            const pool = denoms.filter(dd => dd > n);
            [d1,d2] = pool.length >= 2 ? pickTwo(pool) : [4,6];
            n1 = n; n2 = n;
        }
        const sym = n1/d1 < n2/d2 ? '<' : n1/d1 > n2/d2 ? '>' : '=';
        comps.push({n1,d1,sym,n2,d2,isCorrectComparison:true});
    }
    // 1 WRONG comparison
    const wd = pickFrom(denoms);
    let wn1 = randInt(1,wd-1), wn2 = randInt(1,wd-1);
    while (wn2 === wn1) wn2 = randInt(1,wd-1);
    const realSym = wn1/wd < wn2/wd ? '<' : '>';
    const wrongSym = realSym === '<' ? '>' : '<';
    comps.push({n1:wn1,d1:wd,sym:wrongSym,n2:wn2,d2:wd,isCorrectComparison:false});

    shuffleArray(comps);
    const labels = ['A','B','C','D'];
    const wrongIdx = comps.findIndex(c => !c.isCorrectComparison);
    return {
        category: 'comparing', type: 'mc_comparison',
        question: 'Which fraction comparison is <strong>NOT</strong> correct?',
        visual: null, comparisons: comps, labels,
        answer: labels[wrongIdx]
    };
}

function genWhichIsTrue() {
    // Matches assessment Q11/Q13: "Which number sentence below is true?"
    // Pattern from PDFs: same numerator across all fractions, mix of symbols
    const denoms = [3,4,5,6,8];
    const num = randInt(1, 3);
    const pool = denoms.filter(d => d > num);
    const d1 = pickFrom(pool);
    
    // Pick a second denominator for the main pair
    const d2Pool = pool.filter(d => d !== d1);
    const d2 = d2Pool.length > 0 ? pickFrom(d2Pool) : (d1 === 3 ? 4 : 3);
    
    // Determine the correct relationship
    const realSym = num/d1 < num/d2 ? '<' : num/d1 > num/d2 ? '>' : '=';
    
    const comps = [];
    
    // The CORRECT comparison
    comps.push({n1:num, d1:d1, sym:realSym, n2:num, d2:d2, isCorrectComparison:true});
    
    // Wrong: same fractions, wrong symbol
    const wrongSyms = ['<','=','>'].filter(s => s !== realSym);
    comps.push({n1:num, d1:d1, sym:wrongSyms[0], n2:num, d2:d2, isCorrectComparison:false});
    
    // Wrong: same left fraction, different right fraction, wrong symbol
    const d3Pool = pool.filter(d => d !== d1 && d !== d2);
    const d3 = d3Pool.length > 0 ? pickFrom(d3Pool) : d2;
    const realSym3 = num/d1 < num/d3 ? '<' : num/d1 > num/d3 ? '>' : '=';
    const wrongSym3 = realSym3 === '<' ? '>' : '<';
    comps.push({n1:num, d1:d1, sym:wrongSym3, n2:num, d2:d3, isCorrectComparison:false});
    
    // Wrong: equal sign with non-equal fractions
    const d4Pool = pool.filter(d => d !== d1);
    const d4 = d4Pool.length > 0 ? pickFrom(d4Pool) : d2;
    if (d4 !== d1) {
        comps.push({n1:num, d1:d1, sym:'=', n2:num, d2:d4, isCorrectComparison:false});
    } else {
        comps.push({n1:num, d1:d1, sym:wrongSyms[1] || wrongSyms[0], n2:num, d2:d2, isCorrectComparison:false});
    }
    
    shuffleArray(comps);
    const labels = ['A','B','C','D'];
    const correctIdx = comps.findIndex(c => c.isCorrectComparison);
    return {
        category: 'comparing', type: 'mc_comparison',
        question: 'Which number sentence below is true?',
        visual: null, comparisons: comps, labels,
        answer: labels[correctIdx]
    };
}

function genTwoGreater() {
    const target = pickFrom([{n:2,d:4},{n:1,d:2},{n:2,d:6},{n:1,d:3},{n:3,d:8}]);
    const tv = target.n / target.d;
    function genFrac(greater) {
        const ds = [2,3,4,5,6,8]; let n,d,s=0;
        do { d = pickFrom(ds); n = randInt(1,d-1); s++; }
        while (((greater && n/d <= tv) || (!greater && n/d > tv)) && s < 30);
        return {n,d};
    }
    const cA = genFrac(true), cB = genFrac(true);
    const correctStr = `${cA.n}/${cA.d} and ${cB.n}/${cB.d}`;
    const allChoices = new Set([correctStr]);
    let safety = 0;
    while (allChoices.size < 4 && safety < 40) {
        const a = genFrac(safety%2===0), b = genFrac(safety%2!==0);
        const str = `${a.n}/${a.d} and ${b.n}/${b.d}`;
        allChoices.add(str);
        safety++;
    }
    const choices = shuffleArray([...allChoices]);
    return {
        category: 'comparing', type: 'mc_pair',
        question: `Which two fractions BOTH have a value greater than ${makeFractionHTML(target.n, target.d, false)}?`,
        visual: null, choices, answer: correctStr
    };
}

// ── EQUIVALENT: 3 sub-types ──
function generateEquivalentProblem() {
    const sub = pickSubType(['find_equivalent', 'fraction_strips', 'whole_number', 'equiv_pairs', 'measurement', 'equiv_numberline', 'nn_equals_one']);
    switch (sub) {
        case 'find_equivalent': return genFindEquivalent();
        case 'fraction_strips': return genFractionStrips();
        case 'whole_number': return genWholeNumber();
        case 'equiv_pairs': return genEquivPairs();
        case 'measurement': return genMeasurementWordProblem();
        case 'equiv_numberline': return genEquivFromNumberLine();
        case 'nn_equals_one': return genNNEqualsOne();
    }
}

function genFindEquivalent() {
    const bases = [{n:1,d:2},{n:1,d:3},{n:1,d:4},{n:2,d:3},{n:2,d:4},{n:3,d:4},{n:2,d:6},{n:3,d:6},{n:2,d:8},{n:3,d:8},{n:4,d:6}];
    const base = pickFrom(bases);
    const mults = [2,3,4].filter(m => base.d * m <= 12);
    const mult = mults.length > 0 ? pickFrom(mults) : 2;
    const shown = { n: base.n * mult, d: base.d * mult };
    const g = gcd(shown.n, shown.d);
    const simp = { n: shown.n/g, d: shown.d/g };
    const correct = `${simp.n}/${simp.d}`;
    const choices = [correct];
    addUnique(choices, `${simp.n+1}/${simp.d}`);
    addUnique(choices, `${simp.n}/${simp.d+1}`);
    addUnique(choices, `${shown.d}/${shown.n}`);
    addUnique(choices, `${simp.d}/${simp.n}`);
    return {
        category: 'equivalent', type: 'mc',
        question: `What fraction is equivalent to ${makeFractionHTML(shown.n, shown.d, true)}?`,
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct, shownNumer: shown.n, shownDenom: shown.d
    };
}

function genFractionStrips() {
    const sets = [
        {base:{n:1,d:2}, equivs:[{n:2,d:4},{n:3,d:6},{n:4,d:8}]},
        {base:{n:2,d:3}, equivs:[{n:4,d:6}]},
        {base:{n:1,d:3}, equivs:[{n:2,d:6}]},
        {base:{n:1,d:4}, equivs:[{n:2,d:8}]},
        {base:{n:3,d:4}, equivs:[{n:6,d:8}]},
    ];
    const set = pickFrom(sets);
    const equiv = pickFrom(set.equivs);
    const wrongPool = [{n:1,d:3},{n:1,d:4},{n:2,d:4},{n:3,d:4},{n:1,d:2},{n:2,d:3},{n:3,d:6},{n:5,d:6},{n:3,d:8},{n:5,d:8},{n:7,d:8},{n:1,d:6},{n:4,d:6},{n:2,d:8},{n:6,d:8}];
    const filtered = wrongPool.filter(w => !fracEq(w.n,w.d,set.base.n,set.base.d) && !(w.n===equiv.n && w.d===equiv.d));
    shuffleArray(filtered);
    const allStrips = [{...equiv, isCorrect:true}, ...filtered.slice(0,3).map(w => ({...w, isCorrect:false}))];
    shuffleArray(allStrips);
    const labels = ['A','B','C','D'];
    const ansIdx = allStrips.findIndex(s => s.isCorrect);
    return {
        category: 'equivalent', type: 'mc_strips',
        question: 'Which fraction strip shows a fraction equal to the one above?',
        visual: { type: 'reference_strip', numer: set.base.n, denom: set.base.d },
        strips: allStrips, labels,
        answer: labels[ansIdx]
    };
}

function genWholeNumber() {
    const wn = randInt(2, 5);
    const denoms = [2,3,4,6,8].filter(d => wn*d <= 40);
    const denom = pickFrom(denoms.length > 0 ? denoms : [3]);
    const correct = `${wn*denom}/${denom}`;
    const choices = [correct];
    addUnique(choices, `${denom}/${denom}`);
    addUnique(choices, `${wn}/${denom}`);
    addUnique(choices, `${(wn-1)*denom}/${denom}`);
    addUnique(choices, `${(wn+1)*denom}/${denom}`);
    addUnique(choices, `1/${wn}`);
    return {
        category: 'equivalent', type: 'mc',
        question: `Which fraction has a value equal to ${wn}?`,
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct, wholeNum: wn
    };
}

function genNNEqualsOne() {
    // Matches assessment Q17: "Which fraction is equivalent to 4/4?"
    // Shows n/n, correct answer is another m/m (both equal 1)
    const shownDenoms = [2, 3, 4, 6, 8];
    const shownD = pickFrom(shownDenoms);
    const answerPool = shownDenoms.filter(d => d !== shownD);
    const ansD = pickFrom(answerPool);
    const correct = `${ansD}/${ansD}`;
    const choices = [correct];
    // Distractor: n/1 (confuse with the number itself)
    addUnique(choices, `${shownD}/1`);
    // Distractor: 1/n
    addUnique(choices, `1/${shownD}`);
    // Distractor: n/2 or 2n/n
    addUnique(choices, `${shownD * 2}/${shownD}`);
    addUnique(choices, `${shownD}/${shownD * 2}`);
    // Distractor: another non-one fraction
    addUnique(choices, `${ansD + 1}/${ansD}`);
    return {
        category: 'equivalent', type: 'mc',
        question: `Which fraction is equivalent to ${makeFractionHTML(shownD, shownD, true)}?`,
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct, nnShownDenom: shownD
    };
}

function genEquivPairs() {
    // Q17 style: "Which choice shows equivalent fractions?" with 4 pairs like "1/2 = 2/4"
    const equivSets = [
        {n:1,d:2, pairs:[[2,4],[3,6],[4,8]]},
        {n:1,d:3, pairs:[[2,6]]},
        {n:2,d:3, pairs:[[4,6]]},
        {n:1,d:4, pairs:[[2,8]]},
        {n:3,d:4, pairs:[[6,8]]},
        {n:2,d:4, pairs:[[1,2],[3,6],[4,8]]},
    ];
    const set = pickFrom(equivSets);
    const pair = pickFrom(set.pairs);
    const correctStr = `${set.n}/${set.d} = ${pair[0]}/${pair[1]}`;
    // Generate 3 wrong pairs (NOT equivalent)
    const wrongPairs = new Set();
    let safety = 0;
    while (wrongPairs.size < 3 && safety < 40) {
        const n1 = randInt(1,4), d1 = pickFrom([2,3,4,6,8]);
        const n2 = randInt(1,7), d2 = pickFrom([2,3,4,6,8]);
        if (n1 < d1 && n2 < d2 && !fracEq(n1,d1,n2,d2)) {
            const str = `${n1}/${d1} = ${n2}/${d2}`;
            if (str !== correctStr) wrongPairs.add(str);
        }
        safety++;
    }
    const choices = shuffleArray([correctStr, ...[...wrongPairs].slice(0,3)]);
    return {
        category: 'equivalent', type: 'mc_equivpairs',
        question: 'Which choice shows equivalent fractions?',
        visual: null, choices,
        answer: correctStr
    };
}

function genMeasurementWordProblem() {
    // Matches assessment Q15: "Jaime has a container that holds 1/4 cup.
    // How many TIMES should Jaime fill it to get 1/2 cup?"
    const scenarios = [
        { unitD: 4, targetN: 1, targetD: 2, answer: 2, targetStr: '½' },      // 1/4 → 1/2 = 2 times
        { unitD: 4, targetN: 3, targetD: 4, answer: 3, targetStr: '¾' },      // 1/4 → 3/4 = 3 times
        { unitD: 3, targetN: 2, targetD: 3, answer: 2, targetStr: '⅔' },      // 1/3 → 2/3 = 2 times
        { unitD: 8, targetN: 1, targetD: 2, answer: 4, targetStr: '½' },      // 1/8 → 1/2 = 4 times
        { unitD: 6, targetN: 1, targetD: 2, answer: 3, targetStr: '½' },      // 1/6 → 1/2 = 3 times
        { unitD: 8, targetN: 3, targetD: 8, answer: 3, targetStr: '⅜' },      // 1/8 → 3/8 = 3 times
        { unitD: 6, targetN: 2, targetD: 6, answer: 2, targetStr: '²⁄₆' },    // 1/6 → 2/6 = 2 times
    ];
    const names = ['Jaime','Sofia','Malik','Ava','Carlos','Priya','Ben','Lily'];
    const items = [
        { container: 'cup', substance: 'dog food', target: 'the dog gets exactly', into: "the dog's bowl" },
        { container: 'cup', substance: 'juice', target: 'they have exactly', into: 'a pitcher' },
        { container: 'cup', substance: 'flour', target: 'they have exactly', into: 'a mixing bowl' },
        { container: 'cup', substance: 'water', target: 'there is exactly', into: 'a pot' },
    ];
    const sc = pickFrom(scenarios);
    const nm = pickFrom(names);
    const item = pickFrom(items);

    const question = `${nm} has a small container that holds exactly ${makeFractionHTML(1, sc.unitD, false)} ${item.container} of ${item.substance}. How many <strong>times</strong> should ${nm} fill the container and pour it into ${item.into} to make sure ${item.target} ${makeFractionHTML(sc.targetN, sc.targetD, false)} ${item.container}?`;

    const correct = String(sc.answer);
    // Distractors: the unit fraction itself, the target fraction, double the answer, half
    const allChoices = new Set([correct]);
    allChoices.add(String(sc.unitD));
    allChoices.add(String(sc.targetN));
    if (sc.answer * 2 <= 8) allChoices.add(String(sc.answer * 2));
    if (sc.answer > 1) allChoices.add(String(sc.answer - 1));
    allChoices.add(String(sc.answer + 1));
    allChoices.add('1');
    const choiceArr = [...allChoices].filter(c => parseInt(c) > 0);
    shuffleArray(choiceArr);
    const final4 = [correct, ...choiceArr.filter(c => c !== correct).slice(0,3)];
    while (final4.length < 4) final4.push(String(randInt(1,6)));
    shuffleArray(final4);

    return {
        category: 'equivalent', type: 'mc_text',
        question: question,
        visual: null,
        choices: final4,
        answer: correct,
        measurementData: sc
    };
}

function genEquivFromNumberLine() {
    // Matches assessment Q18: Shows Point R on a number line, asks
    // "Which two fractions are equivalent to the value represented by Point R?"
    const equivSets = [
        { pos: 1, denom: 4, pairs: [ {a:'1/4',b:'2/8'}, ] },
        { pos: 2, denom: 4, pairs: [ {a:'2/4',b:'4/8'}, {a:'1/2',b:'4/8'}, ] },
        { pos: 3, denom: 4, pairs: [ {a:'3/4',b:'6/8'}, ] },
        { pos: 1, denom: 3, pairs: [ {a:'1/3',b:'2/6'}, ] },
        { pos: 2, denom: 3, pairs: [ {a:'2/3',b:'4/6'}, ] },
        { pos: 3, denom: 6, pairs: [ {a:'3/6',b:'1/2'}, ] },
        { pos: 2, denom: 8, pairs: [ {a:'2/8',b:'1/4'}, ] },
        { pos: 4, denom: 8, pairs: [ {a:'4/8',b:'1/2'}, {a:'4/8',b:'2/4'}, ] },
        { pos: 6, denom: 8, pairs: [ {a:'6/8',b:'3/4'}, ] },
    ];
    const set = pickFrom(equivSets);
    const pair = pickFrom(set.pairs);
    const correctStr = `${pair.a} and ${pair.b}`;

    // Generate wrong pairs (not equivalent to the point's value)
    const pointVal = set.pos / set.denom;
    const wrongPairs = new Set();
    let safety = 0;
    while (wrongPairs.size < 3 && safety < 50) {
        const ds = [2,3,4,6,8];
        const d1 = pickFrom(ds), d2 = pickFrom(ds);
        const n1 = randInt(1,d1-1), n2 = randInt(1,d2-1);
        // At least one fraction should NOT match the point value
        if (!(n1/d1 === pointVal && n2/d2 === pointVal)) {
            const str = `${n1}/${d1} and ${n2}/${d2}`;
            if (str !== correctStr) wrongPairs.add(str);
        }
        safety++;
    }
    const choices = shuffleArray([correctStr, ...[...wrongPairs].slice(0,3)]);

    return {
        category: 'equivalent', type: 'mc_pair',
        question: `Which two fractions are equivalent to the value shown by Point R?`,
        visual: { type: 'numberline', numer: set.pos, denom: set.denom },
        choices, answer: correctStr
    };
}

function renderQuestion(problem) {
    const card = document.getElementById('questionCard');
    const label = document.getElementById('questionLabel');
    const text = document.getElementById('questionText');
    const visual = document.getElementById('visualContainer');
    const answerArea = document.getElementById('answerArea');

    const catLabels = {
        identify: 'Identifying Fractions',
        numberline: 'Number Lines',
        comparing: 'Comparing Fractions',
        equivalent: 'Equivalent Fractions'
    };

    label.textContent = catLabels[problem.category];
    visual.innerHTML = '';
    answerArea.innerHTML = '';

    text.innerHTML = problem.question;

    // Render visual
    if (problem.visual) {
        switch (problem.visual.type) {
            case 'bar': renderBarVisual(visual, problem.visual); break;
            case 'multi_bar': renderMultiBarVisual(visual, problem.visual); break;
            case 'numberline': renderNumberLine(visual, problem.visual); break;
            case 'labeled_numberline': renderLabeledNL(visual, problem.visual); break;
            case 'multi_point': renderMultiPointNL(visual, problem.visual); break;
            case 'comparison': renderComparisonVisual(visual, problem.visual); break;
            case 'reference_strip': renderReferenceStrip(visual, problem.visual); break;
        }
    }

    // Render answer area
    switch (problem.type) {
        case 'mc': renderMCFraction(answerArea, problem); break;
        case 'mc_text': renderMCText(answerArea, problem); break;
        case 'mc_visual_nl': renderMCVisualNL(answerArea, problem); break;
        case 'mc_pair': renderMCPair(answerArea, problem); break;
        case 'mc_comparison': renderMCComparison(answerArea, problem); break;
        case 'mc_strips': renderMCStrips(answerArea, problem); break;
        case 'mc_equivpairs': renderMCEquivPairs(answerArea, problem); break;
        case 'symbol': renderSymbolOptions(answerArea, problem); break;
    }

    card.classList.remove('hidden');
}

// ── VISUAL RENDERERS ──

function renderBarVisual(container, v) {
    const bar = document.createElement('div');
    bar.className = 'fraction-bar-model';
    for (let i = 0; i < v.denom; i++) {
        const seg = document.createElement('div');
        seg.className = 'bar-segment ' + (i < v.numer ? 'shaded' : 'unshaded');
        bar.appendChild(seg);
    }
    container.appendChild(bar);
}

function renderMultiBarVisual(container, v) {
    // Shows multiple whole bars side by side (for fractions > 1)
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;';
    let shadedRemaining = v.totalShaded;
    for (let w = 0; w < v.numWholes; w++) {
        const bar = document.createElement('div');
        bar.className = 'fraction-bar-model';
        bar.style.cssText = 'flex:1;min-width:80px;max-width:180px;';
        for (let i = 0; i < v.denom; i++) {
            const seg = document.createElement('div');
            if (shadedRemaining > 0) {
                seg.className = 'bar-segment shaded';
                shadedRemaining--;
            } else {
                seg.className = 'bar-segment unshaded';
            }
            bar.appendChild(seg);
        }
        wrap.appendChild(bar);
    }
    container.appendChild(wrap);
}

function renderNumberLine(container, v) {
    const wrap = document.createElement('div');
    wrap.className = 'number-line-container';
    const line = document.createElement('div');
    line.className = 'number-line';
    for (let i = 0; i <= v.denom; i++) {
        const pct = (i / v.denom) * 100;
        const tick = document.createElement('div');
        tick.className = 'nl-tick'; tick.style.left = pct + '%';
        line.appendChild(tick);
        if (i === 0 || i === v.denom) {
            const lbl = document.createElement('div');
            lbl.className = 'nl-label'; lbl.style.left = pct + '%';
            lbl.textContent = i === 0 ? '0' : '1';
            line.appendChild(lbl);
        }
    }
    const ptPct = (v.numer / v.denom) * 100;
    const pt = document.createElement('div');
    pt.className = 'nl-point'; pt.style.left = ptPct + '%';
    line.appendChild(pt);
    const ptLbl = document.createElement('div');
    ptLbl.className = 'nl-point-label'; ptLbl.style.left = ptPct + '%';
    ptLbl.textContent = 'P';
    line.appendChild(ptLbl);
    wrap.appendChild(line);
    container.appendChild(wrap);
}

function handleAnswer(problem, response) {
    const correct = response === problem.answer;
    recordAnswer(problem.category, correct, problem, response);

    // Track in Supabase
    const catLabels = { identify: 'Identifying', numberline: 'Number Lines', comparing: 'Comparing', equivalent: 'Equivalent' };
    GameTracker.recordQuestion({
        questionText: (catLabels[problem.category] || problem.category) + ': ' + (problem.question || '').replace(/<[^>]*>/g, '').substring(0, 200),
        studentAnswer: String(response),
        correctAnswer: String(problem.answer),
        isCorrect: correct
    });
    GameTracker.checkAutoSave();

    nextQuestion();
}

function nextQuestion() {
    updateProgress();

    if (isSessionComplete()) {
        transitionTo('end');
        return;
    }

    const card = document.getElementById('questionCard');
    card.classList.add('slide-out');

    setTimeout(() => {
        const cat = getNextCategory();
        if (!cat) { transitionTo('end'); return; }
        currentProblem = generateProblem(cat);

        card.classList.remove('slide-out');
        card.style.opacity = '0';
        card.style.transform = 'translateX(40px)';

        renderQuestion(currentProblem);

        requestAnimationFrame(() => {
            card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateX(0)';
        });
    }, 300);
}

// XSS prevention for AI response text
function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function getAIFeedback() {
    var feedbackEl = document.getElementById('aiFeedbackContent');
    var catLabels = { identify: 'Identifying fractions from shaded models', numberline: 'Reading fractions on number lines', comparing: 'Comparing fractions using < > =', equivalent: 'Finding equivalent fractions' };

    // Build performance summary
    var perfSummary = 'Student performance on fractions practice:\n';
    CATEGORIES.forEach(function(cat) {
        var c = sessionData.categoryCorrect[cat], t = sessionData.categoryTotal[cat];
        var pct = t > 0 ? Math.round((c/t)*100) : 0;
        perfSummary += '- ' + catLabels[cat] + ': ' + c + '/' + t + ' correct (' + pct + '%) ' + (c >= MASTERY_THRESHOLD ? '[MASTERED]' : '[NEEDS WORK]') + '\n';
    });
    var wrongs = sessionData.answers.filter(function(a) { return !a.correct; });
    if (wrongs.length > 0) {
        perfSummary += '\nSpecific errors:\n';
        wrongs.slice(0, 8).forEach(function(w) {
            perfSummary += '- ' + catLabels[w.category] + ': answered "' + w.response + '" (correct: "' + w.problem.answer + '")\n';
        });
    }

    var student = GameTracker.getStudent();
    var studentId = student ? student.id : 'anonymous';

    try {
        var response = await fetch(
            SUPABASE_URL + '/functions/v1/ai-feedback',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY
                },
                body: JSON.stringify({
                    performanceSummary: perfSummary,
                    studentId: studentId,
                    mode: 'feedback'
                })
            }
        );

        if (!response.ok) throw new Error('API returned ' + response.status);

        var data = await response.json();
        if (data.feedback) {
            feedbackEl.innerHTML = '<div class="ai-feedback-text">' + escapeHtml(data.feedback) + '</div>';
        } else {
            throw new Error('No feedback in response');
        }
    } catch (err) {
        console.warn('AI feedback unavailable:', err.message);
        // Static fallback
        var correct = sessionData.answers.filter(function(a) { return a.correct; }).length;
        var total = sessionData.totalAnswered;
        var weakCats = CATEGORIES.filter(function(c) { return sessionData.categoryCorrect[c] < MASTERY_THRESHOLD; });
        var fallback = 'You completed ' + total + ' questions and got ' + correct + ' right. ';
        if (weakCats.length === 0) {
            fallback += 'Great work — you showed strong skills across all fraction types!';
        } else {
            var catLabelsShort = { identify: 'identifying fractions', numberline: 'number lines', comparing: 'comparing fractions', equivalent: 'equivalent fractions' };
            fallback += 'Keep practicing ' + weakCats.map(function(c) { return catLabelsShort[c]; }).join(' and ') + ' — you\'re getting there!';
        }
        feedbackEl.innerHTML = '<div class="ai-feedback-text">' + escapeHtml(fallback) + '</div>';
    }
}

// ── localStorage persistence ──

function saveMissedToStorage(missedProblems) {
    try {
        // Serialize problems (strip functions, keep data)
        const serializable = missedProblems.map(a => ({
            category: a.category,
            problem: serializeProblem(a.problem),
            wrongResponse: a.response
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(serializable));
    } catch (e) { console.warn('Could not save missed questions:', e); }
}

function loadMissedFromStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || data.length === 0) return null;
        return data;
    } catch (e) { return null; }
}

function clearMissedStorage() {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

function serializeProblem(p) {
    // Create a clean copy without DOM references or functions
    const clean = {};
    for (const key of Object.keys(p)) {
        const val = p[key];
        if (typeof val !== 'function' && key !== 'checkAnswer') {
            clean[key] = val;
        }
    }
    return clean;
}

// ── Hint generation ──

function getHint(problem, attemptNum, wrongResponse) {
    if (attemptNum === 1) return getHint1(problem);
    if (attemptNum === 2) return getHint2(problem, wrongResponse);
    return null; // attemptNum >= 3 triggers Claude API
}

function getHint1(problem) {
    switch (problem.category) {
        case 'identify':
            if (problem.visual && problem.visual.type === 'multi_bar') {
                return `Count ALL the shaded parts across every shape. Each shape is divided into ${problem.denom} equal parts.`;
            }
            if (problem.visual && problem.visual.type === 'bar') {
                return `Count all the parts in the shape — that's the bottom number (denominator). It has ${problem.denom} equal parts.`;
            }
            return `Read the problem carefully. The total number of parts or items is the denominator (bottom number).`;
        case 'numberline':
            if (problem.visual && problem.visual.type === 'numberline') {
                return `Count the spaces between 0 and 1 on the number line. Each space is one equal part. There are ${problem.denom} spaces.`;
            }
            if (problem.visual && problem.visual.type === 'labeled_numberline') {
                return `Look at how many equal spaces are between 0 and 1 on the number line. Then count which space the place is at.`;
            }
            if (problem.visual && problem.visual.type === 'multi_point' && problem.question.includes('distance')) {
                return `Distance means how many spaces apart two points are. Count the spaces between each pair of points to find which pair matches.`;
            }
            if (problem.visual && problem.visual.type === 'multi_point') {
                return `Count the total spaces between 0 and 1 — that's the denominator. Then count which space the point is at.`;
            }
            // pick_number_line: comparing 4 mini number lines
            if (problem.type === 'mc_visual_nl') {
                return `Look at each number line. First find which ones have the right number of spaces (that's the denominator). Then check if the dot is in the right spot.`;
            }
            return `Count all the tick marks between 0 and 1. The number of spaces tells you the denominator.`;
        case 'comparing':
            if (problem.type === 'symbol') {
                if (problem.d1 === problem.d2) {
                    return `These fractions have the same denominator (${problem.d1}). When denominators are the same, the bigger numerator means a bigger fraction.`;
                }
                if (problem.n1 === problem.n2) {
                    return `These fractions have the same numerator (${problem.n1}). When numerators are the same, the bigger denominator means smaller pieces.`;
                }
            }
            // fill_blank: "3/6 > ___" — all same denominator
            if (problem.type === 'mc') {
                return `All the choices have the same denominator. Focus on the numerators — which one makes the statement true?`;
            }
            // not_correct: "Which comparison is NOT correct?"
            if (problem.type === 'mc_comparison' && problem.question.includes('NOT')) {
                return `Check each comparison one by one. For each pair, figure out which fraction is actually bigger, then see if the symbol matches.`;
            }
            // which_is_true: "Which number sentence is true?"
            if (problem.type === 'mc_comparison') {
                return `These fractions have the same numerator. Remember: same numerator, bigger denominator = smaller pieces = smaller fraction. Check each statement.`;
            }
            // two_greater: "Which two fractions BOTH have a value greater than ___?"
            if (problem.type === 'mc_pair') {
                return `Think about where each fraction sits compared to the target. Is the fraction more or less than the target? Both fractions in the pair need to be greater.`;
            }
            return `Think about the size of the pieces. A bigger denominator means smaller pieces.`;
        case 'equivalent':
            if (problem.measurementData) {
                return `Think about it: each fill adds ${makeFractionHTML(1, problem.measurementData.unitD, false)} cup. How many fills to reach ${makeFractionHTML(problem.measurementData.targetN, problem.measurementData.targetD, false)} cup?`;
            }
            if (problem.nnShownDenom) {
                return `When the numerator and denominator are the same, the fraction equals 1 whole. Which other fraction also equals 1 whole?`;
            }
            if (problem.wholeNum) {
                return `To write ${problem.wholeNum} as a fraction, think: how many pieces of that size make ${problem.wholeNum} wholes?`;
            }
            // equiv_numberline: read number line first, then find equivalent pair
            if (problem.type === 'mc_pair' && problem.visual && problem.visual.type === 'numberline') {
                return `First, figure out what fraction Point R shows: count the spaces from 0 to 1 (that's the denominator), then count how many spaces to Point R (that's the numerator). Then find two fractions equal to that value.`;
            }
            // fraction_strips: visual matching, not simplifying
            if (problem.type === 'mc_strips') {
                return `Look at how much of each strip is filled. Which strip has the same amount filled as the one on top?`;
            }
            // equiv_pairs: "Which choice shows equivalent fractions?"
            if (problem.type === 'mc_equivpairs') {
                return `For each pair, check: can you multiply or divide the top and bottom of one fraction by the same number to get the other?`;
            }
            return `Equivalent fractions show the same amount. Try simplifying — divide both the numerator and denominator by the same number.`;
    }
}

function getHint2(problem, wrongResponse) {
    switch (problem.category) {
        case 'identify':
            if (problem.visual && problem.visual.type === 'multi_bar') {
                return `There are ${problem.visual.numWholes} shapes, each with ${problem.denom} parts. Count every shaded part — you should get ${problem.numer}. The denominator stays ${problem.denom} because the parts are all the same size.`;
            }
            if (problem.visual && problem.visual.type === 'bar') {
                return `The shape has ${problem.denom} equal parts. Count the shaded ones — there are ${problem.numer} shaded. So the fraction is ${problem.numer} over ${problem.denom}.`;
            }
            return `The bottom number is the total. The top number is the part you're asked about. Look again at the numbers in the problem.`;
        case 'numberline':
            if (problem.question && problem.question.includes('distance')) {
                return `Find each pair of points on the number line. Count the spaces between them. The correct pair has exactly ${problem.answer.replace(/ and /, ' to ')} with the right number of spaces between them.`;
            }
            // pick_number_line: 4 mini number lines
            if (problem.type === 'mc_visual_nl' && problem.lines) {
                const correct = problem.lines.find(l => l.label === problem.answer);
                if (correct) {
                    return `The correct number line needs ${correct.denom} equal spaces (denominator) with the dot at the ${ordinal(correct.pointPos)} space. Look at option ${problem.answer}.`;
                }
            }
            if (problem.numer !== undefined && problem.denom !== undefined) {
                return `There are ${problem.denom} equal spaces. Point P is at the ${ordinal(problem.numer)} space from 0. The fraction is ${problem.numer} over ${problem.denom}.`;
            }
            return `Count carefully from 0. Each mark is one equal part. Which mark is the point sitting on?`;
        case 'comparing':
            if (problem.type === 'symbol' && problem.d1 === problem.d2) {
                return `Same size pieces (${problem.d1}ths). ${problem.n1} pieces vs ${problem.n2} pieces — which is more?`;
            }
            if (problem.type === 'symbol' && problem.n1 === problem.n2) {
                return `Same number of pieces (${problem.n1}). But ${problem.d1}ths are ${problem.d1 < problem.d2 ? 'bigger' : 'smaller'} pieces than ${problem.d2}ths. Bigger pieces = bigger fraction.`;
            }
            // fill_blank: same-denominator comparison
            if (problem.type === 'mc') {
                const parts = problem.answer.split('/');
                const ansDenom = parts.length === 2 ? parts[1] : '?';
                return `All the fractions have ${ansDenom} as the denominator, so they're the same size pieces. Just compare the numerators (top numbers) to see which makes the statement true.`;
            }
            // not_correct: find the wrong comparison
            if (problem.type === 'mc_comparison' && problem.question.includes('NOT') && problem.comparisons) {
                return `Look at each comparison. If the fractions have the same denominator, the bigger numerator is bigger. If same numerator, the bigger denominator makes a smaller fraction. One statement has the symbol backwards.`;
            }
            // which_is_true: find the correct comparison
            if (problem.type === 'mc_comparison' && problem.comparisons) {
                return `Same numerator means you're comparing piece sizes. Bigger denominator = smaller pieces = smaller fraction. Find the one statement where the symbol matches correctly.`;
            }
            // two_greater: benchmark comparison
            if (problem.type === 'mc_pair') {
                return `Check each fraction in the pair: is its numerator more than half its denominator? If so, it's greater than one half. Both fractions in the correct pair need to be greater than the target.`;
            }
            return `Think about the size of the pieces. A bigger denominator means smaller pieces.`;
        case 'equivalent':
            if (problem.measurementData) {
                const sc = problem.measurementData;
                return `Each fill = ${makeFractionHTML(1, sc.unitD, false)}. Fill ${sc.answer} times: ${sc.answer} × ${makeFractionHTML(1, sc.unitD, false)} = ${makeFractionHTML(sc.answer, sc.unitD, false)} = ${makeFractionHTML(sc.targetN, sc.targetD, false)}. The answer is ${sc.answer}.`;
            }
            if (problem.nnShownDenom) {
                return `${problem.nnShownDenom}/${problem.nnShownDenom} = 1. Any fraction where the top and bottom are the same number also equals 1. Look for another fraction like that.`;
            }
            if (problem.shownNumer && problem.shownDenom) {
                const g = gcd(problem.shownNumer, problem.shownDenom);
                if (g > 1) {
                    return `Try dividing both ${problem.shownNumer} and ${problem.shownDenom} by ${g}. What do you get?`;
                }
            }
            if (problem.wholeNum) {
                const ans = problem.answer.split('/');
                return `${problem.wholeNum} wholes. Each whole has ${ans[1]} pieces. So ${problem.wholeNum} × ${ans[1]} = ${ans[0]} pieces total.`;
            }
            // equiv_numberline: two-step — read NL then find equivalent pair
            if (problem.type === 'mc_pair' && problem.visual && problem.visual.type === 'numberline') {
                return `Point R is at ${problem.visual.numer} out of ${problem.visual.denom} spaces, so it shows ${problem.visual.numer}/${problem.visual.denom}. Now find two fractions that equal that same value.`;
            }
            // fraction_strips: visual comparison
            if (problem.type === 'mc_strips' && problem.visual) {
                return `The top strip shows ${problem.visual.numer}/${problem.visual.denom}. Look at each answer strip — which one has the exact same amount filled in? The answer is ${problem.answer}.`;
            }
            // equiv_pairs: check each equation
            if (problem.type === 'mc_equivpairs') {
                return `For each pair, simplify both fractions to their lowest terms. If they simplify to the same fraction, they're equivalent.`;
            }
            return `Multiply or divide both the top and bottom by the same number. The amount stays the same — just different sized pieces.`;
    }
}

function ordinal(n) {
    if (n === 1) return '1st';
    if (n === 2) return '2nd';
    if (n === 3) return '3rd';
    return n + 'th';
}

async function getAIHint(problem, wrongResponse) {
    const catLabels = { identify: 'identifying a fraction from a visual model', numberline: 'reading a fraction on a number line', comparing: 'comparing two fractions', equivalent: 'finding equivalent fractions' };

Question: ${(problem.question || '').replace(/<[^>]*>/g, '')}
Correct answer: ${problem.answer}

They've already tried ${tutorAttempts} times and seen 2 hints.

Give them ONE short sentence (under 25 words) that helps them see WHY their answer is wrong and nudges them toward the right thinking. Use simple words. Don't give the answer directly.`;
