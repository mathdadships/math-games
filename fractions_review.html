// ── Tutor mode flow ──

function startTutorFromSession() {
    // Use missed problems from current session
    const missed = sessionData.answers.filter(a => !a.correct);
    if (missed.length === 0) return;
    
    // Save to localStorage for future sessions
    saveMissedToStorage(missed);
    
    // Build tutor queue from missed problems (re-generate similar problems)
    tutorQueue = missed.map(m => ({
        originalProblem: m.problem,
        category: m.category,
        wrongResponse: m.response
    }));
    shuffleArray(tutorQueue);
    startTutorSession();
}

function startTutorFromSaved() {
    const saved = loadMissedFromStorage();
    if (!saved || saved.length === 0) return;
    
    tutorQueue = saved.map(s => ({
        originalProblem: s.problem,
        category: s.category,
        wrongResponse: s.wrongResponse
    }));
    shuffleArray(tutorQueue);
    startTutorSession();
}

function startTutorSession() {
    tutorMode = true;
    tutorIndex = 0;
    tutorSessionId = 'tutor_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    // Create the tutor session row immediately so it shows on dashboard even if student quits
    saveTutorProgress();
    // Also save tutor progress on page exit (use sendBeacon for reliability)
    const saveTutorOnExit = () => saveTutorProgress(true);
    window.addEventListener('beforeunload', saveTutorOnExit);
    window.addEventListener('pagehide', saveTutorOnExit);
    document.getElementById('progressFill').style.width = '0%';
    transitionTo('question');
    loadTutorProblem();
}

function loadTutorProblem() {
    if (tutorIndex >= tutorQueue.length) {
        endTutorSession();
        return;
    }

    const item = tutorQueue[tutorIndex];
    // Generate a fresh problem of the same category/type
    tutorCurrentProblem = generateProblem(item.category);
    tutorAttempts = 0;

    const card = document.getElementById('questionCard');
    document.getElementById('tutorBadge').classList.remove('hidden');
    document.getElementById('tutorProgress').classList.remove('hidden');
    document.getElementById('tutorProgress').textContent = `Question ${tutorIndex + 1} of ${tutorQueue.length}`;
    document.getElementById('hintArea').innerHTML = '';

    card.style.opacity = '1';
    card.style.transform = 'translateX(0)';
    card.style.transition = 'none';
    renderTutorQuestion(tutorCurrentProblem);

    // Update progress
    document.getElementById('progressFill').style.width = ((tutorIndex / tutorQueue.length) * 100) + '%';
}

function renderTutorQuestion(problem) {
    // Same rendering as normal, but answer handling is different
    const card = document.getElementById('questionCard');
    const label = document.getElementById('questionLabel');
    const text = document.getElementById('questionText');
    const visual = document.getElementById('visualContainer');
    const answerArea = document.getElementById('answerArea');

    const catLabels = { identify: 'Identifying Fractions', numberline: 'Number Lines', comparing: 'Comparing Fractions', equivalent: 'Equivalent Fractions' };

    label.textContent = catLabels[problem.category];
    visual.innerHTML = '';
    answerArea.innerHTML = '';
    document.getElementById('hintArea').innerHTML = '';

    text.innerHTML = problem.question;

    if (problem.visual) {
        switch (problem.visual.type) {
            case 'bar': renderBarVisual(visual, problem.visual); break;
            case 'multi_bar': renderMultiBarVisual(visual, problem.visual); break;
            case 'numberline': renderNumberLine(visual, problem.visual); break;
            case 'labeled_numberline': renderLabeledNL(visual, problem.visual); break;
            case 'multi_point': renderMultiPointNL(visual, problem.visual); break;
            case 'comparison': renderComparisonVisual(visual, problem.visual); break;
            case 'reference_strip': renderReferenceStrip(visual, problem.visual); break;
        }
    }

    // Render answer area with TUTOR click handlers
    switch (problem.type) {
        case 'mc': renderTutorMC(answerArea, problem, 'fraction'); break;
        case 'mc_text': renderTutorMC(answerArea, problem, 'text'); break;
        case 'mc_visual_nl': renderMCVisualNLTutor(answerArea, problem); break;
        case 'mc_pair': renderTutorMC(answerArea, problem, 'pair'); break;
        case 'mc_comparison': renderMCComparisonTutor(answerArea, problem); break;
        case 'mc_strips': renderMCStripsTutor(answerArea, problem); break;
        case 'mc_equivpairs': renderTutorMC(answerArea, problem, 'equivpairs'); break;
        case 'symbol': renderSymbolTutor(answerArea, problem); break;
    }

    card.classList.remove('hidden');
}

// Generic tutor MC renderer
function renderTutorMC(container, problem, style) {
    const grid = document.createElement('div');
    
    if (style === 'pair' || style === 'equivpairs') {
        grid.className = 'mc-options single-col';
    } else {
        grid.className = 'mc-options' + (style === 'fraction' ? ' force-2col' : '');
    }

    problem.choices.forEach(choice => {
        const btn = document.createElement('div');
        btn.className = 'mc-option';
        btn.dataset.choice = choice;

        if (style === 'fraction') {
            const parts = choice.split('/');
            btn.innerHTML = makeFractionHTML(parseInt(parts[0]), parseInt(parts[1]), false);
        } else if (style === 'text') {
            btn.innerHTML = `<span style="font-size:15px;font-weight:600">${choice}</span>`;
        } else if (style === 'pair') {
            const parts = choice.split(' and ');
            const f1 = parts[0].split('/'), f2 = parts[1].split('/');
            btn.innerHTML = `${makeFractionHTML(f1[0],f1[1],false)} <span style="margin:0 6px;font-weight:600">and</span> ${makeFractionHTML(f2[0],f2[1],false)}`;
        } else if (style === 'equivpairs') {
            const parts = choice.split(' = ');
            const f1 = parts[0].split('/'), f2 = parts[1].split('/');
            btn.innerHTML = `${makeFractionHTML(f1[0],f1[1],false)} <span style="font-size:20px;font-weight:700;margin:0 8px">=</span> ${makeFractionHTML(f2[0],f2[1],false)}`;
        }

        btn.addEventListener('click', () => handleTutorAnswer(problem, choice, btn, grid));
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

function renderMCVisualNLTutor(container, problem) {
    const grid = document.createElement('div');
    grid.className = 'mc-options';
    problem.lines.forEach(line => {
        const btn = document.createElement('div');
        btn.className = 'mc-option'; btn.style.padding = '10px';
        btn.dataset.choice = line.label;
        const lbl = document.createElement('div');
        lbl.style.cssText = 'font-weight:700;font-size:14px;margin-bottom:4px;';
        lbl.textContent = line.label;
        btn.appendChild(lbl);
        const nlWrap = document.createElement('div');
        nlWrap.className = 'mini-nl-wrap';
        const nl = document.createElement('div');
        nl.className = 'mini-nl';
        for (let i = 0; i <= line.denom; i++) {
            const tick = document.createElement('div');
            tick.className = 'mini-nl-tick'; tick.style.left = (i/line.denom*100) + '%';
            nl.appendChild(tick);
            if (i === 0 || i === line.denom) {
                const el = document.createElement('div');
                el.className = 'mini-nl-endlabel'; el.style.left = (i/line.denom*100) + '%';
                el.textContent = i === 0 ? '0' : '1';
                nl.appendChild(el);
            }
        }
        const pt = document.createElement('div');
        pt.className = 'mini-nl-point'; pt.style.left = (line.pointPos/line.denom*100) + '%';
        nl.appendChild(pt);
        nlWrap.appendChild(nl); btn.appendChild(nlWrap);
        btn.addEventListener('click', () => handleTutorAnswer(problem, line.label, btn, grid));
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

function renderMCComparisonTutor(container, problem) {
    const grid = document.createElement('div');
    grid.className = 'mc-options single-col';
    problem.comparisons.forEach((comp, idx) => {
        const btn = document.createElement('div');
        btn.className = 'mc-option'; btn.style.flexDirection = 'row'; btn.style.gap = '6px';
        btn.dataset.choice = problem.labels[idx];
        btn.innerHTML = `<span style="font-weight:700;margin-right:6px">${problem.labels[idx]}.</span> ${makeFractionHTML(comp.n1,comp.d1,false)} <span style="font-size:18px;font-weight:700;margin:0 4px">${comp.sym}</span> ${makeFractionHTML(comp.n2,comp.d2,false)}`;
        btn.addEventListener('click', () => handleTutorAnswer(problem, problem.labels[idx], btn, grid));
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

function renderMCStripsTutor(container, problem) {
    const grid = document.createElement('div');
    grid.className = 'mc-options';
    problem.strips.forEach((strip, idx) => {
        const btn = document.createElement('div');
        btn.className = 'mc-option'; btn.style.padding = '10px';
        btn.dataset.choice = problem.labels[idx];
        const lbl = document.createElement('div');
        lbl.style.cssText = 'font-weight:700;font-size:13px;margin-bottom:6px;';
        lbl.textContent = problem.labels[idx];
        btn.appendChild(lbl);
        const ms = document.createElement('div');
        ms.className = 'mini-strip';
        for (let i = 0; i < strip.d; i++) {
            const seg = document.createElement('div');
            seg.className = 'mini-strip-seg ' + (i < strip.n ? 'shaded' : 'unshaded');
            ms.appendChild(seg);
        }
        btn.appendChild(ms);
        btn.addEventListener('click', () => handleTutorAnswer(problem, problem.labels[idx], btn, grid));
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

function renderSymbolTutor(container, problem) {
    const grid = document.createElement('div');
    grid.className = 'symbol-options';
    ['<', '=', '>'].forEach(symbol => {
        const btn = document.createElement('div');
        btn.className = 'symbol-btn';
        btn.textContent = symbol;
        btn.dataset.choice = symbol;
        btn.addEventListener('click', () => {
            document.getElementById('symbolBlank').textContent = symbol;
            handleTutorAnswer(problem, symbol, btn, grid);
        });
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

// ── Core tutor answer handler ──

async function handleTutorAnswer(problem, response, clickedBtn, grid) {
    const correct = response === problem.answer;
    tutorAttempts++;

    // Track tutor answers in Supabase
    const catLabels2 = { identify: 'Identifying', numberline: 'Number Lines', comparing: 'Comparing', equivalent: 'Equivalent' };
    GameTracker.recordQuestion({
        questionText: '[Tutor] ' + (catLabels2[problem.category] || problem.category) + ': ' + (problem.question || '').replace(/<[^>]*>/g, '').substring(0, 200),
        studentAnswer: String(response),
        correctAnswer: String(problem.answer),
        isCorrect: correct,
        attemptNumber: tutorAttempts
    });

    if (correct) {
        // Green highlight, brief pause, then next
        clickedBtn.style.borderColor = 'var(--green)';
        clickedBtn.style.background = 'var(--correct-soft)';
        document.getElementById('hintArea').innerHTML = '';

        // Disable all buttons
        grid.querySelectorAll('.mc-option, .symbol-btn').forEach(b => {
            b.style.pointerEvents = 'none';
        });

        setTimeout(() => {
            tutorIndex++;
            saveTutorProgress(); // update dashboard with progress so far
            const card = document.getElementById('questionCard');
            card.classList.add('slide-out');
            setTimeout(() => {
                card.classList.remove('slide-out');
                loadTutorProblem();
            }, 300);
        }, 800);
        return;
    }

    // Wrong — show hint, keep going
    clickedBtn.style.borderColor = 'var(--amber)';
    clickedBtn.style.background = 'var(--wrong-soft)';
    clickedBtn.style.pointerEvents = 'none'; // disable this choice
    clickedBtn.style.opacity = '0.5';

    const hintArea = document.getElementById('hintArea');

    if (tutorAttempts <= 2) {
        // Hardcoded hint
        const hintText = getHint(problem, tutorAttempts, response);
        hintArea.innerHTML = `<div class="hint-box">
            <div class="hint-label">Hint ${tutorAttempts}</div>
            <div class="hint-text">${hintText}</div>
        </div>`;
    } else {
        // Claude API hint
        hintArea.innerHTML = `<div class="hint-box ai-hint">
            <div class="hint-label">Let me help</div>
            <div class="hint-loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>Thinking...</span></div>
        </div>`;

        const aiHint = await getAIHint(problem, response);
        if (aiHint) {
            hintArea.innerHTML = `<div class="hint-box ai-hint">
                <div class="hint-label">Let me help</div>
                <div class="hint-text">${escapeHtml(aiHint)}</div>
            </div>`;
        } else {
            // Fallback if API fails
            const fallback = `The answer is one of the remaining choices. Take your time and try again.`;
            hintArea.innerHTML = `<div class="hint-box">
                <div class="hint-label">Hint</div>
                <div class="hint-text">${fallback}</div>
            </div>`;
        }
    }
}

function endTutorSession() {
    // Final save — upserts the same tutor session row with complete data
    tutorIndex = tutorQueue.length; // ensure count is correct
    saveTutorProgress();

    tutorMode = false;
    clearMissedStorage();
    document.getElementById('tutorBadge').classList.add('hidden');
    document.getElementById('tutorProgress').classList.add('hidden');
    document.getElementById('progressFill').style.width = '100%';

    // Show a simple completion message
    const card = document.getElementById('questionCard');
    const label = document.getElementById('questionLabel');
    const text = document.getElementById('questionText');
    const visual = document.getElementById('visualContainer');
    const answerArea = document.getElementById('answerArea');
    const hintArea = document.getElementById('hintArea');

    label.textContent = '';
    visual.innerHTML = '';
    answerArea.innerHTML = '';
    hintArea.innerHTML = '';
    text.innerHTML = `<div style="text-align:center;padding:20px 0;">
        <div style="font-size:32px;margin-bottom:12px;">🎉</div>
        <div style="margin-bottom:8px;">You reviewed all your missed questions!</div>
        <div style="font-size:14px;color:var(--text-secondary);margin-bottom:24px;">Great job working through those.</div>
        <button class="restart-btn" onclick="restartSession()" style="margin:0 auto;">Back to Start</button>
    </div>`;
}

// ── Init: check localStorage for saved missed questions ──

function checkSavedMissed() {
    const saved = loadMissedFromStorage();
    const section = document.getElementById('startTutorSection');
    if (saved && saved.length > 0) {
        section.classList.remove('hidden');
        document.getElementById('startTutorInfo').textContent =
            `You have ${saved.length} missed question${saved.length > 1 ? 's' : ''} to review from last time.`;
    } else {
        section.classList.add('hidden');
    }
}
