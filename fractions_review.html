<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fractions Review</title>
    <script src="tracker.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F7F4;
            --card: #FFFFFF;
            --text: #1A1A2E;
            --text-secondary: #6B7094;
            --accent: #4A6CF7;
            --accent-light: #EEF1FE;
            --border: #E8E8EE;
            --progress-track: #E8E8EE;
            --progress-fill: #4A6CF7;
            --correct-soft: #E8F5E9;
            --wrong-soft: #FFF3E0;
            --amber: #E8A838;
            --green: #43A047;
            --radius: 16px;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ── PROGRESS BAR ── */
        .progress-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 4px; background: var(--progress-track); z-index: 100;
        }
        .progress-fill {
            height: 100%; background: var(--progress-fill);
            width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0 2px 2px 0;
        }

        /* ── MAIN CONTAINER ── */
        .container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px;
            position: relative;
            overflow-y: auto;
        }

        /* ── QUESTION CARD ── */
        .question-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(24px, 4vw, 40px);
            max-width: 560px; width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .question-card.slide-out {
            opacity: 0; transform: translateX(-40px);
        }
        .question-card.slide-in {
            opacity: 0; transform: translateX(40px);
        }

        .question-label {
            font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-secondary); margin-bottom: 12px;
        }

        .question-text {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(20px, 3.5vw, 28px);
            line-height: 1.4; margin-bottom: 24px;
            color: var(--text);
        }

        /* ── FRACTION DISPLAY ── */
        .fraction {
            display: inline-flex; flex-direction: column;
            align-items: center; vertical-align: middle;
            margin: 0 4px; position: relative; top: -2px;
        }
        .fraction-num, .fraction-den {
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(20px, 3vw, 26px); font-weight: 700;
            line-height: 1.2; text-align: center; min-width: 20px;
        }
        .fraction-bar {
            width: 100%; height: 2px; background: var(--text);
            margin: 2px 0; min-width: 24px;
        }
        .fraction-lg .fraction-num, .fraction-lg .fraction-den {
            font-size: clamp(28px, 4vw, 36px);
        }
        .fraction-lg .fraction-bar { height: 3px; min-width: 32px; }

        /* ── VISUAL MODELS ── */
        .visual-container {
            margin: 20px 0; display: flex;
            justify-content: center; align-items: center; gap: 24px;
            flex-wrap: wrap;
        }

        /* Fraction Bar Model */
        .fraction-bar-model {
            display: flex; border-radius: 8px;
            overflow: hidden; border: 2px solid var(--text);
            height: 48px; width: min(100%, 360px);
        }
        .bar-segment {
            flex: 1; border-right: 1.5px solid var(--text);
            transition: background 0.3s ease;
        }
        .bar-segment:last-child { border-right: none; }
        .bar-segment.shaded { background: var(--accent); }
        .bar-segment.unshaded { background: var(--card); }

        /* Number Line Model */
        .number-line-container {
            width: min(100%, 400px); position: relative;
            padding: 32px 16px 24px;
        }
        .number-line {
            width: 100%; height: 3px; background: var(--text);
            position: relative; border-radius: 2px;
        }
        .nl-tick {
            position: absolute; top: -8px;
            width: 2px; height: 19px; background: var(--text);
            transform: translateX(-50%);
        }
        .nl-label {
            position: absolute; top: 16px;
            font-size: 14px; font-weight: 600;
            transform: translateX(-50%); color: var(--text-secondary);
            white-space: nowrap;
        }
        .nl-point {
            position: absolute; top: -14px;
            width: 16px; height: 16px; background: var(--accent);
            border-radius: 50%; border: 3px solid var(--text);
            transform: translateX(-50%); z-index: 2;
        }
        .nl-point-label {
            position: absolute; top: -36px;
            font-size: 16px; font-weight: 700;
            transform: translateX(-50%); color: var(--accent);
            white-space: nowrap;
        }
        .nl-place-label {
            position: absolute; top: -48px;
            font-size: 10px; font-weight: 600;
            transform: translateX(-50%) rotate(-25deg);
            transform-origin: bottom center;
            color: var(--text); white-space: nowrap;
        }

        /* Comparison Visual */
        .comparison-visual {
            display: flex; flex-direction: column; gap: 12px;
            width: min(100%, 360px);
        }
        .comp-row {
            display: flex; align-items: center; gap: 12px;
        }
        .comp-label {
            font-size: 14px; font-weight: 600;
            color: var(--text-secondary); min-width: 40px; text-align: right;
        }
        .comp-bar-wrap {
            flex: 1; height: 32px; border-radius: 6px;
            border: 2px solid var(--border); overflow: hidden;
            background: var(--card);
        }
        .comp-bar-fill {
            height: 100%; background: var(--accent);
            border-radius: 4px 0 0 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Fraction Comparison Display */
        .comparison-equation {
            display: flex; align-items: center;
            justify-content: center; gap: 20px;
            margin: 16px 0;
        }
        .comparison-blank {
            width: 48px; height: 48px;
            border: 2px dashed var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700; color: var(--accent);
        }

        /* Mini number line in choices */
        .mini-nl-wrap {
            width: 100%; position: relative; padding: 6px 6px 18px;
        }
        .mini-nl {
            width: 100%; height: 2px; background: var(--text); position: relative;
        }
        .mini-nl-tick {
            position: absolute; top: -5px;
            width: 1.5px; height: 12px; background: var(--text);
            transform: translateX(-50%);
        }
        .mini-nl-point {
            position: absolute; top: -8px;
            width: 10px; height: 10px; background: var(--accent);
            border-radius: 50%; border: 2px solid var(--text);
            transform: translateX(-50%); z-index: 2;
        }
        .mini-nl-endlabel {
            position: absolute; top: 8px; font-size: 9px; font-weight: 600;
            transform: translateX(-50%); color: var(--text-secondary);
        }

        /* Mini fraction strip in choices */
        .mini-strip {
            display: flex; border-radius: 4px; overflow: hidden;
            border: 1.5px solid var(--text); height: 22px; width: 100%;
        }
        .mini-strip-seg {
            flex: 1; border-right: 1px solid var(--text);
        }
        .mini-strip-seg:last-child { border-right: none; }
        .mini-strip-seg.shaded { background: var(--accent); opacity: 0.6; }
        .mini-strip-seg.unshaded { background: var(--card); }

        /* ── ANSWER OPTIONS ── */

        /* Multiple Choice */
        .mc-options {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-top: 8px;
        }
        .mc-options.single-col { grid-template-columns: 1fr; }
        .mc-option {
            background: var(--bg); border: 2px solid var(--border);
            border-radius: 12px; padding: 16px;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            cursor: pointer; transition: all 0.2s ease;
            min-height: 64px;
        }
        .mc-option:hover { border-color: var(--accent); background: var(--accent-light); }
        .mc-option:active { transform: scale(0.97); }

        /* Comparison Symbol Select */
        .symbol-options {
            display: flex; justify-content: center;
            gap: 16px; margin-top: 8px;
        }
        .symbol-btn {
            width: 72px; height: 72px;
            background: var(--bg); border: 2px solid var(--border);
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
            color: var(--text);
        }
        .symbol-btn:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
        .symbol-btn:active { transform: scale(0.93); }

        /* Type-in Fraction Input */
        .fraction-input-area {
            display: flex; align-items: center;
            justify-content: center; gap: 16px; margin-top: 16px;
        }
        .fraction-input {
            display: inline-flex; flex-direction: column;
            align-items: center; gap: 4px;
        }
        .fraction-input input {
            width: 64px; height: 52px;
            border: 2px solid var(--border); border-radius: 10px;
            text-align: center; font-size: 24px; font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            color: var(--text); background: var(--bg);
            outline: none; transition: border-color 0.2s;
            -moz-appearance: textfield;
        }
        .fraction-input input::-webkit-inner-spin-button,
        .fraction-input input::-webkit-outer-spin-button { -webkit-appearance: none; }
        .fraction-input input:focus { border-color: var(--accent); background: white; }
        .fraction-input-bar {
            width: 64px; height: 3px; background: var(--text); border-radius: 2px;
        }
        .submit-btn {
            background: var(--accent); color: white;
            border: none; border-radius: 12px;
            padding: 14px 32px; font-size: 16px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.2s;
            margin-top: 16px;
        }
        .submit-btn:hover { background: #3B5DE7; transform: translateY(-1px); }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ── START SCREEN ── */
        .start-screen {
            text-align: center; max-width: 480px;
        }
        .start-title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(28px, 5vw, 40px);
            margin-bottom: 12px;
        }
        .start-subtitle {
            font-size: 16px; color: var(--text-secondary);
            line-height: 1.6; margin-bottom: 32px;
        }
        .start-btn {
            background: var(--accent); color: white;
            border: none; border-radius: 14px;
            padding: 18px 48px; font-size: 18px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(74, 108, 247, 0.3);
        }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(74, 108, 247, 0.4); }
        .start-btn:active { transform: scale(0.97); }

        /* ── END SCREEN ── */
        .end-screen {
            text-align: center; max-width: 520px; width: 100%;
        }
        .end-title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(24px, 4vw, 34px);
            margin-bottom: 8px;
        }
        .end-subtitle {
            font-size: 15px; color: var(--text-secondary);
            margin-bottom: 28px;
        }
        .results-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-bottom: 28px; text-align: left;
        }
        .result-card {
            background: var(--card); border-radius: 12px;
            padding: 16px; box-shadow: var(--shadow);
        }
        .result-card-label {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-secondary);
            margin-bottom: 6px; font-weight: 600;
        }
        .result-card-value {
            font-size: 22px; font-weight: 700;
        }
        .result-mastered { color: var(--green); }
        .result-working { color: var(--amber); }

        .ai-feedback-card {
            background: var(--card); border-radius: var(--radius);
            padding: 24px; box-shadow: var(--shadow);
            text-align: left; margin-bottom: 24px;
            border-left: 4px solid var(--accent);
        }
        .ai-feedback-label {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent);
            margin-bottom: 10px; font-weight: 700;
        }
        .ai-feedback-text {
            font-size: 16px; line-height: 1.7; color: var(--text);
        }
        .ai-loading {
            display: flex; align-items: center;
            justify-content: center; gap: 8px;
            padding: 20px; color: var(--text-secondary);
        }
        .ai-loading .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); animation: pulse 1.4s ease-in-out infinite;
        }
        .ai-loading .dot:nth-child(2) { animation-delay: 0.2s; }
        .ai-loading .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .restart-btn {
            background: var(--bg); color: var(--text);
            border: 2px solid var(--border); border-radius: 12px;
            padding: 14px 32px; font-size: 16px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer; transition: all 0.2s;
        }
        .restart-btn:hover { border-color: var(--accent); background: var(--accent-light); }

        /* ── UTILITIES ── */
        .hidden { display: none !important; }

        @media (max-width: 500px) {
            .mc-options:not(.force-2col) { grid-template-columns: 1fr; }
            .results-grid { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            .question-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="container" id="mainContainer">
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-title">Fractions Practice</div>
        <div class="start-subtitle">
            Answer questions about fractions at your own pace.<br>
            Take your time — there's no timer.
        </div>
        <button class="start-btn" onclick="startSession()">Begin</button>
    </div>

    <!-- Question Card -->
    <div class="question-card hidden" id="questionCard">
        <div class="question-label" id="questionLabel"></div>
        <div class="question-text" id="questionText"></div>
        <div class="visual-container" id="visualContainer"></div>
        <div id="answerArea"></div>
    </div>

    <!-- End Screen -->
    <div class="end-screen hidden" id="endScreen">
        <div class="end-title">Practice Complete</div>
        <div class="end-subtitle" id="endSubtitle"></div>
        <div class="results-grid" id="resultsGrid"></div>
        <div class="ai-feedback-card" id="aiFeedbackCard">
            <div class="ai-feedback-label">Your Practice Summary</div>
            <div id="aiFeedbackContent">
                <div class="ai-loading">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    <span style="margin-left:4px">Preparing your feedback...</span>
                </div>
            </div>
        </div>
        <button class="restart-btn" onclick="restartSession()">Practice Again</button>
    </div>
</div>

<script>
// ═══════════════════════════════════════════
// ███ ADAPTIVE ENGINE (UNCHANGED FROM ORIGINAL) ███
// ═══════════════════════════════════════════

const CATEGORIES = ['identify', 'numberline', 'comparing', 'equivalent'];
const MASTERY_THRESHOLD = 3;
const MAX_PROBLEMS = 25;
const REQUEUE_DELAY = 2;

let sessionData = {
    answers: [],
    categoryCorrect: { identify: 0, numberline: 0, comparing: 0, equivalent: 0 },
    categoryTotal: { identify: 0, numberline: 0, comparing: 0, equivalent: 0 },
    totalAnswered: 0,
    startTime: null
};

let queue = [];
let currentProblem = null;
let requeueBuffer = [];
let problemsSinceRequeue = 0;

// Globals for GameTracker.checkAutoSave()
var questionsAnswered = 0;
var score = 0;
var bestStreak = 0;
var _currentStreak = 0;

function buildInitialQueue() {
    queue = [];
    CATEGORIES.forEach(cat => { for (let i = 0; i < 3; i++) queue.push(cat); });
    shuffleArray(queue);
}

function getNextCategory() {
    for (let i = requeueBuffer.length - 1; i >= 0; i--) {
        if (problemsSinceRequeue >= requeueBuffer[i].insertAfter) {
            const cat = requeueBuffer[i].category;
            requeueBuffer.splice(i, 1);
            if (sessionData.categoryCorrect[cat] < MASTERY_THRESHOLD) return cat;
        }
    }
    while (queue.length > 0) {
        const cat = queue.shift();
        if (sessionData.categoryCorrect[cat] < MASTERY_THRESHOLD) return cat;
    }
    const unmastered = CATEGORIES.filter(c => sessionData.categoryCorrect[c] < MASTERY_THRESHOLD);
    if (unmastered.length > 0) return unmastered[Math.floor(Math.random() * unmastered.length)];
    return null;
}

function recordAnswer(category, correct, problem, response) {
    sessionData.answers.push({ category, correct, problem, response, timestamp: Date.now() });
    sessionData.categoryTotal[category]++;
    sessionData.totalAnswered++;
    problemsSinceRequeue++;

    // Update globals for GameTracker auto-save
    questionsAnswered = sessionData.totalAnswered;
    if (correct) {
        sessionData.categoryCorrect[category]++;
        score++;
        _currentStreak++;
        if (_currentStreak > bestStreak) bestStreak = _currentStreak;
    } else {
        _currentStreak = 0;
        requeueBuffer.push({ category, insertAfter: REQUEUE_DELAY });
        problemsSinceRequeue = 0;
    }
}

function isSessionComplete() {
    if (CATEGORIES.every(c => sessionData.categoryCorrect[c] >= MASTERY_THRESHOLD)) return true;
    if (sessionData.totalAnswered >= MAX_PROBLEMS) return true;
    return false;
}

function getProgress() {
    let total = 0;
    CATEGORIES.forEach(c => { total += Math.min(sessionData.categoryCorrect[c], MASTERY_THRESHOLD); });
    return total / (CATEGORIES.length * MASTERY_THRESHOLD);
}

// ═══════════════════════════════════════════
// ███ HELPERS ███
// ═══════════════════════════════════════════

function makeFractionHTML(n, d, large) {
    return `<span class="fraction ${large ? 'fraction-lg' : ''}"><span class="fraction-num">${n}</span><span class="fraction-bar"></span><span class="fraction-den">${d}</span></span>`;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function pickFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickTwo(arr) { const s = [...arr]; shuffleArray(s); return [s[0], s[1]]; }
function range(start, end) { const a = []; for (let i = start; i <= end; i++) a.push(i); return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b) { [a,b] = [b, a%b]; } return a; }
function fracEq(n1,d1,n2,d2) { return n1*d2 === n2*d1; }

function addUnique(arr, val) {
    if (!arr.includes(val) && val.split('/').every(n => parseInt(n) > 0)) arr.push(val);
}

function finalizeChoices(choices, correct) {
    const unique = [...new Set(choices)].filter(c => c.split('/').every(n => parseInt(n) > 0 && !isNaN(parseInt(n))));
    const distractors = unique.filter(c => c !== correct);
    shuffleArray(distractors);
    const final4 = [correct, ...distractors.slice(0, 3)];
    let safety = 0;
    while (final4.length < 4 && safety < 20) {
        const r = `${randInt(1,7)}/${randInt(2,8)}`;
        if (!final4.includes(r)) final4.push(r);
        safety++;
    }
    shuffleArray(final4);
    return final4;
}

// Sub-type rotation to avoid repeats
let recentSubTypes = [];
function pickSubType(types) {
    const avail = types.filter(t => !recentSubTypes.includes(t));
    const pool = avail.length > 0 ? avail : types;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    recentSubTypes.push(pick);
    if (recentSubTypes.length > 5) recentSubTypes.shift();
    return pick;
}

// ═══════════════════════════════════════════
// ███ PROBLEM GENERATORS ███
// ═══════════════════════════════════════════

function generateProblem(category) {
    switch (category) {
        case 'identify': return generateIdentifyProblem();
        case 'numberline': return generateNumberLineProblem();
        case 'comparing': return generateComparingProblem();
        case 'equivalent': return generateEquivalentProblem();
    }
}

// ── IDENTIFY: shaded bar OR word problem ──
function generateIdentifyProblem() {
    const sub = pickSubType(['shaded_bar', 'word_problem']);
    if (sub === 'word_problem') return genWordProblem();
    return genShadedBar();
}

function genShadedBar() {
    const denoms = [2, 3, 4, 6, 8];
    const denom = pickFrom(denoms);
    const numer = randInt(1, denom - 1);
    const correct = `${numer}/${denom}`;
    const choices = [correct];
    if (denom !== numer) addUnique(choices, `${denom}/${numer}`);
    if (numer > 1) addUnique(choices, `${numer - 1}/${denom}`);
    if (numer < denom) addUnique(choices, `${numer + 1}/${denom}`);
    addUnique(choices, `${denom - numer}/${denom}`);
    const altDenom = pickFrom(denoms.filter(d => d !== denom));
    addUnique(choices, `${numer}/${altDenom}`);

    return {
        category: 'identify', type: 'mc',
        question: 'What fraction of the shape is shaded?',
        visual: { type: 'bar', numer, denom },
        choices: finalizeChoices(choices, correct),
        answer: correct, numer, denom
    };
}

function genWordProblem() {
    const templates = [
        { text: (nm, data) => `${nm} and ${data.denom - 1} friend${data.denom-1>1?'s':''} share a pizza equally. What fraction does EACH person get?`,
          gen: () => { const d = randInt(2, 8); return { numer: 1, denom: d }; } },
        { text: (nm, data) => `${nm} divided a garden into ${data.denom} equal parts and planted seeds in ${data.numer} parts. What fraction of the garden has seeds?`,
          gen: () => { const d = randInt(3, 8); return { numer: randInt(1, d-1), denom: d }; } },
        { text: (nm, data) => `${nm} has ${data.denom} marbles. ${data.numer} of them are blue. What fraction of the marbles are blue?`,
          gen: () => { const d = randInt(3, 8); return { numer: randInt(1, d-1), denom: d }; } },
        { text: (nm, data) => `A rectangle is cut into ${data.denom} equal pieces. ${data.numer} pieces are colored. What fraction is colored?`,
          gen: () => { const d = randInt(2, 8); return { numer: randInt(1, d-1), denom: d }; } }
    ];
    const names = ['Emma','Liam','Sophia','Noah','Olivia','Theo','Lily','James','Mia','Wendy'];
    const nm = pickFrom(names);
    const tmpl = pickFrom(templates);
    const data = tmpl.gen();
    const correct = `${data.numer}/${data.denom}`;
    const choices = [correct];
    addUnique(choices, `${data.denom}/${data.numer}`);
    addUnique(choices, `${data.denom - data.numer}/${data.denom}`);
    if (data.numer === 1) {
        addUnique(choices, `1/${data.denom + 1}`);
        addUnique(choices, `${data.denom}/${data.denom}`);
    } else {
        addUnique(choices, `${data.numer}/${data.denom + 1}`);
        addUnique(choices, `1/${data.denom}`);
    }
    return {
        category: 'identify', type: 'mc',
        question: tmpl.text(nm, data),
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct, numer: data.numer, denom: data.denom
    };
}

// ── NUMBER LINE: 4 sub-types ──
function generateNumberLineProblem() {
    const sub = pickSubType(['point_to_fraction', 'labeled_places', 'fraction_to_point', 'pick_number_line']);
    switch (sub) {
        case 'point_to_fraction': return genPointToFraction();
        case 'labeled_places': return genLabeledPlaces();
        case 'fraction_to_point': return genFractionToPoint();
        case 'pick_number_line': return genPickNumberLine();
    }
}

function genPointToFraction() {
    const denoms = [3, 4, 6, 8];
    const denom = pickFrom(denoms);
    const numer = randInt(1, denom - 1);
    const correct = `${numer}/${denom}`;
    const choices = [correct];
    addUnique(choices, `${numer}/${denom + 1}`);
    if (numer > 1) addUnique(choices, `${numer - 1}/${denom}`);
    addUnique(choices, `${numer + 1}/${denom}`);
    addUnique(choices, `${denom - numer}/${denom}`);
    const altD = pickFrom(denoms.filter(d => d !== denom));
    addUnique(choices, `${numer}/${altD}`);
    return {
        category: 'numberline', type: 'mc',
        question: 'What fraction does point P represent?',
        visual: { type: 'numberline', numer, denom },
        choices: finalizeChoices(choices, correct),
        answer: correct, numer, denom
    };
}

function genLabeledPlaces() {
    const scenarios = [
        { denom: 8, start: "Erin's House", places: [{name:"Fire Station",pos:1},{name:"Park",pos:3},{name:"School",pos:4},{name:"Market",pos:5},{name:"Library",pos:8}] },
        { denom: 8, start: "Home", places: [{name:"Bakery",pos:2},{name:"Playground",pos:3},{name:"Store",pos:5},{name:"Pool",pos:6},{name:"School",pos:8}] },
        { denom: 6, start: "Start", places: [{name:"Café",pos:1},{name:"Park",pos:2},{name:"Shop",pos:3},{name:"Library",pos:4},{name:"Finish",pos:6}] },
        { denom: 4, start: "Jordan's House", places: [{name:"Park",pos:1},{name:"Soccer Field",pos:2},{name:"School",pos:3},{name:"Library",pos:4}] }
    ];
    const scene = pickFrom(scenarios);
    const interior = scene.places.filter(p => p.pos > 0 && p.pos < scene.denom);
    const target = pickFrom(interior);
    const wrong = scene.places.filter(p => p.name !== target.name);
    shuffleArray(wrong);
    const choices = shuffleArray([target.name, ...wrong.slice(0, 3).map(p => p.name)]);
    return {
        category: 'numberline', type: 'mc_text',
        question: `Which place is ${makeFractionHTML(target.pos, scene.denom, false)} mile from ${scene.start}?`,
        visual: { type: 'labeled_numberline', denom: scene.denom, start: scene.start, places: scene.places },
        choices, answer: target.name
    };
}

function genFractionToPoint() {
    const denom = pickFrom([6, 8]); // need ≥5 interior positions for 4 unique points
    const allPos = range(1, denom - 1);
    shuffleArray(allPos);
    const positions = allPos.slice(0, 4).sort((a, b) => a - b);
    const labels = ['A','B','C','D'];
    const targetIdx = randInt(0, 3);
    return {
        category: 'numberline', type: 'mc_text',
        question: `Which point on the number line represents ${makeFractionHTML(positions[targetIdx], denom, false)}?`,
        visual: { type: 'multi_point', denom, points: positions.map((p,i) => ({pos:p, label:labels[i]})) },
        choices: shuffleArray([...labels]),
        answer: labels[targetIdx]
    };
}

function genPickNumberLine() {
    const targetDenom = pickFrom([3, 4, 6, 8]);
    const targetNumer = randInt(1, targetDenom - 1);
    const labels = ['A','B','C','D'];
    const correctIdx = randInt(0, 3);
    const lines = [];
    const used = new Set();
    used.add(`${targetNumer}-${targetDenom}`);
    for (let i = 0; i < 4; i++) {
        if (i === correctIdx) {
            lines.push({ denom: targetDenom, pointPos: targetNumer, label: labels[i] });
        } else {
            let d, p, safety = 0;
            do { d = pickFrom([2,3,4,5,6,8]); p = randInt(1, d-1); safety++; }
            while ((used.has(`${p}-${d}`) || fracEq(p,d,targetNumer,targetDenom)) && safety < 30);
            used.add(`${p}-${d}`);
            lines.push({ denom: d, pointPos: p, label: labels[i] });
        }
    }
    return {
        category: 'numberline', type: 'mc_visual_nl',
        question: `Which number line shows a point at ${makeFractionHTML(targetNumer, targetDenom, false)}?`,
        visual: null, lines,
        answer: labels[correctIdx]
    };
}

// ── COMPARING: 4 sub-types ──
function generateComparingProblem() {
    const sub = pickSubType(['compare_symbols', 'fill_blank', 'not_correct', 'two_greater']);
    switch (sub) {
        case 'compare_symbols': return genCompareSymbols();
        case 'fill_blank': return genFillBlank();
        case 'not_correct': return genNotCorrect();
        case 'two_greater': return genTwoGreater();
    }
}

function genCompareSymbols() {
    const denoms = [2,3,4,5,6,8];
    const sameNumer = Math.random() < 0.5;
    let n1,d1,n2,d2;
    if (sameNumer) {
        const num = randInt(1, 4);
        const pool = denoms.filter(d => d > num);
        [d1, d2] = pool.length >= 2 ? pickTwo(pool) : [3, 4];
        n1 = num; n2 = num;
    } else {
        const den = pickFrom(denoms.filter(d => d >= 3));
        [n1, n2] = pickTwo(range(1, den - 1));
        d1 = den; d2 = den;
    }
    const v1 = n1/d1, v2 = n2/d2;
    const answer = v1 < v2 ? '<' : v1 > v2 ? '>' : '=';
    return {
        category: 'comparing', type: 'symbol',
        question: 'Compare these fractions.',
        visual: { type: 'comparison', n1, d1, n2, d2 },
        answer, n1, d1, n2, d2
    };
}

function genFillBlank() {
    const denoms = [3,4,5,6,8];
    const denom = pickFrom(denoms);
    const numer = randInt(2, denom - 1);
    const op = pickFrom(['>','<']);
    let correctN;
    if (op === '>') {
        correctN = randInt(1, numer - 1);
    } else {
        if (numer + 1 >= denom) return genFillBlank(); // can't go higher, retry
        correctN = randInt(numer + 1, denom - 1);
    }
    const correct = `${correctN}/${denom}`;
    const choices = [correct];
    for (let i = 1; i < denom; i++) {
        if (i !== correctN && i !== numer) addUnique(choices, `${i}/${denom}`);
    }
    addUnique(choices, `${denom}/${denom}`);
    return {
        category: 'comparing', type: 'mc',
        question: `Which fraction goes in the blank?  ${makeFractionHTML(numer, denom, true)} ${op} ___`,
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct
    };
}

function genNotCorrect() {
    const denoms = [3,4,5,6,8];
    const comps = [];
    // 3 correct comparisons
    for (let i = 0; i < 3; i++) {
        let n1,d1,n2,d2;
        if (Math.random() < 0.5) {
            const d = pickFrom(denoms); n1 = randInt(1,d-1); n2 = randInt(1,d-1);
            while (n2 === n1) n2 = randInt(1,d-1);
            d1 = d; d2 = d;
        } else {
            const n = randInt(1,3);
            const pool = denoms.filter(dd => dd > n);
            [d1,d2] = pool.length >= 2 ? pickTwo(pool) : [4,6];
            n1 = n; n2 = n;
        }
        const sym = n1/d1 < n2/d2 ? '<' : n1/d1 > n2/d2 ? '>' : '=';
        comps.push({n1,d1,sym,n2,d2,isCorrectComparison:true});
    }
    // 1 WRONG comparison
    const wd = pickFrom(denoms);
    let wn1 = randInt(1,wd-1), wn2 = randInt(1,wd-1);
    while (wn2 === wn1) wn2 = randInt(1,wd-1);
    const realSym = wn1/wd < wn2/wd ? '<' : '>';
    const wrongSym = realSym === '<' ? '>' : '<';
    comps.push({n1:wn1,d1:wd,sym:wrongSym,n2:wn2,d2:wd,isCorrectComparison:false});

    shuffleArray(comps);
    const labels = ['A','B','C','D'];
    const wrongIdx = comps.findIndex(c => !c.isCorrectComparison);
    return {
        category: 'comparing', type: 'mc_comparison',
        question: 'Which fraction comparison is <strong>NOT</strong> correct?',
        visual: null, comparisons: comps, labels,
        answer: labels[wrongIdx]
    };
}

function genTwoGreater() {
    const target = pickFrom([{n:2,d:4},{n:1,d:2},{n:2,d:6},{n:1,d:3},{n:3,d:8}]);
    const tv = target.n / target.d;
    function genFrac(greater) {
        const ds = [2,3,4,5,6,8]; let n,d,s=0;
        do { d = pickFrom(ds); n = randInt(1,d-1); s++; }
        while (((greater && n/d <= tv) || (!greater && n/d > tv)) && s < 30);
        return {n,d};
    }
    const cA = genFrac(true), cB = genFrac(true);
    const correctStr = `${cA.n}/${cA.d} and ${cB.n}/${cB.d}`;
    const allChoices = new Set([correctStr]);
    let safety = 0;
    while (allChoices.size < 4 && safety < 40) {
        const a = genFrac(safety%2===0), b = genFrac(safety%2!==0);
        const str = `${a.n}/${a.d} and ${b.n}/${b.d}`;
        allChoices.add(str);
        safety++;
    }
    const choices = shuffleArray([...allChoices]);
    return {
        category: 'comparing', type: 'mc_pair',
        question: `Which two fractions BOTH have a value greater than ${makeFractionHTML(target.n, target.d, false)}?`,
        visual: null, choices, answer: correctStr
    };
}

// ── EQUIVALENT: 3 sub-types ──
function generateEquivalentProblem() {
    const sub = pickSubType(['find_equivalent', 'fraction_strips', 'whole_number', 'equiv_pairs']);
    switch (sub) {
        case 'find_equivalent': return genFindEquivalent();
        case 'fraction_strips': return genFractionStrips();
        case 'whole_number': return genWholeNumber();
        case 'equiv_pairs': return genEquivPairs();
    }
}

function genFindEquivalent() {
    const bases = [{n:1,d:2},{n:1,d:3},{n:1,d:4},{n:2,d:3},{n:2,d:4},{n:3,d:4},{n:2,d:6},{n:3,d:6},{n:2,d:8},{n:3,d:8},{n:4,d:6}];
    const base = pickFrom(bases);
    const mults = [2,3,4].filter(m => base.d * m <= 12);
    const mult = mults.length > 0 ? pickFrom(mults) : 2;
    const shown = { n: base.n * mult, d: base.d * mult };
    const g = gcd(shown.n, shown.d);
    const simp = { n: shown.n/g, d: shown.d/g };
    const correct = `${simp.n}/${simp.d}`;
    const choices = [correct];
    addUnique(choices, `${simp.n+1}/${simp.d}`);
    addUnique(choices, `${simp.n}/${simp.d+1}`);
    addUnique(choices, `${shown.d}/${shown.n}`);
    addUnique(choices, `${simp.d}/${simp.n}`);
    return {
        category: 'equivalent', type: 'mc',
        question: `What fraction is equivalent to ${makeFractionHTML(shown.n, shown.d, true)}?`,
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct, shownNumer: shown.n, shownDenom: shown.d
    };
}

function genFractionStrips() {
    const sets = [
        {base:{n:1,d:2}, equivs:[{n:2,d:4},{n:3,d:6},{n:4,d:8}]},
        {base:{n:2,d:3}, equivs:[{n:4,d:6}]},
        {base:{n:1,d:3}, equivs:[{n:2,d:6}]},
        {base:{n:1,d:4}, equivs:[{n:2,d:8}]},
        {base:{n:3,d:4}, equivs:[{n:6,d:8}]},
    ];
    const set = pickFrom(sets);
    const equiv = pickFrom(set.equivs);
    const wrongPool = [{n:1,d:3},{n:1,d:4},{n:2,d:4},{n:3,d:4},{n:1,d:2},{n:2,d:3},{n:3,d:6},{n:5,d:6},{n:3,d:8},{n:5,d:8},{n:7,d:8},{n:1,d:6},{n:4,d:6},{n:2,d:8},{n:6,d:8}];
    const filtered = wrongPool.filter(w => !fracEq(w.n,w.d,set.base.n,set.base.d) && !(w.n===equiv.n && w.d===equiv.d));
    shuffleArray(filtered);
    const allStrips = [{...equiv, isCorrect:true}, ...filtered.slice(0,3).map(w => ({...w, isCorrect:false}))];
    shuffleArray(allStrips);
    const labels = ['A','B','C','D'];
    const ansIdx = allStrips.findIndex(s => s.isCorrect);
    return {
        category: 'equivalent', type: 'mc_strips',
        question: 'Which fraction strip shows a fraction equal to the one above?',
        visual: { type: 'reference_strip', numer: set.base.n, denom: set.base.d },
        strips: allStrips, labels,
        answer: labels[ansIdx]
    };
}

function genWholeNumber() {
    const wn = randInt(2, 5);
    const denoms = [2,3,4,6,8].filter(d => wn*d <= 40);
    const denom = pickFrom(denoms.length > 0 ? denoms : [3]);
    const correct = `${wn*denom}/${denom}`;
    const choices = [correct];
    addUnique(choices, `${denom}/${denom}`);
    addUnique(choices, `${wn}/${denom}`);
    addUnique(choices, `${(wn-1)*denom}/${denom}`);
    addUnique(choices, `${(wn+1)*denom}/${denom}`);
    addUnique(choices, `1/${wn}`);
    return {
        category: 'equivalent', type: 'mc',
        question: `Which fraction has a value equal to ${wn}?`,
        visual: null,
        choices: finalizeChoices(choices, correct),
        answer: correct, wholeNum: wn
    };
}

function genEquivPairs() {
    // Q17 style: "Which choice shows equivalent fractions?" with 4 pairs like "1/2 = 2/4"
    const equivSets = [
        {n:1,d:2, pairs:[[2,4],[3,6],[4,8]]},
        {n:1,d:3, pairs:[[2,6]]},
        {n:2,d:3, pairs:[[4,6]]},
        {n:1,d:4, pairs:[[2,8]]},
        {n:3,d:4, pairs:[[6,8]]},
        {n:2,d:4, pairs:[[1,2],[3,6],[4,8]]},
    ];
    const set = pickFrom(equivSets);
    const pair = pickFrom(set.pairs);
    const correctStr = `${set.n}/${set.d} = ${pair[0]}/${pair[1]}`;
    // Generate 3 wrong pairs (NOT equivalent)
    const wrongPairs = new Set();
    let safety = 0;
    while (wrongPairs.size < 3 && safety < 40) {
        const n1 = randInt(1,4), d1 = pickFrom([2,3,4,6,8]);
        const n2 = randInt(1,7), d2 = pickFrom([2,3,4,6,8]);
        if (n1 < d1 && n2 < d2 && !fracEq(n1,d1,n2,d2)) {
            const str = `${n1}/${d1} = ${n2}/${d2}`;
            if (str !== correctStr) wrongPairs.add(str);
        }
        safety++;
    }
    const choices = shuffleArray([correctStr, ...[...wrongPairs].slice(0,3)]);
    return {
        category: 'equivalent', type: 'mc_equivpairs',
        question: 'Which choice shows equivalent fractions?',
        visual: null, choices,
        answer: correctStr
    };
}

function renderQuestion(problem) {
    const card = document.getElementById('questionCard');
    const label = document.getElementById('questionLabel');
    const text = document.getElementById('questionText');
    const visual = document.getElementById('visualContainer');
    const answerArea = document.getElementById('answerArea');

    const catLabels = {
        identify: 'Identifying Fractions',
        numberline: 'Number Lines',
        comparing: 'Comparing Fractions',
        equivalent: 'Equivalent Fractions'
    };

    label.textContent = catLabels[problem.category];
    visual.innerHTML = '';
    answerArea.innerHTML = '';

    text.innerHTML = problem.question;

    // Render visual
    if (problem.visual) {
        switch (problem.visual.type) {
            case 'bar': renderBarVisual(visual, problem.visual); break;
            case 'numberline': renderNumberLine(visual, problem.visual); break;
            case 'labeled_numberline': renderLabeledNL(visual, problem.visual); break;
            case 'multi_point': renderMultiPointNL(visual, problem.visual); break;
            case 'comparison': renderComparisonVisual(visual, problem.visual); break;
            case 'reference_strip': renderReferenceStrip(visual, problem.visual); break;
        }
    }

    // Render answer area
    switch (problem.type) {
        case 'mc': renderMCFraction(answerArea, problem); break;
        case 'mc_text': renderMCText(answerArea, problem); break;
        case 'mc_visual_nl': renderMCVisualNL(answerArea, problem); break;
        case 'mc_pair': renderMCPair(answerArea, problem); break;
        case 'mc_comparison': renderMCComparison(answerArea, problem); break;
        case 'mc_strips': renderMCStrips(answerArea, problem); break;
        case 'mc_equivpairs': renderMCEquivPairs(answerArea, problem); break;
        case 'symbol': renderSymbolOptions(answerArea, problem); break;
    }

    card.classList.remove('hidden');
}

// ── VISUAL RENDERERS ──

function renderBarVisual(container, v) {
    const bar = document.createElement('div');
    bar.className = 'fraction-bar-model';
    for (let i = 0; i < v.denom; i++) {
        const seg = document.createElement('div');
        seg.className = 'bar-segment ' + (i < v.numer ? 'shaded' : 'unshaded');
        bar.appendChild(seg);
    }
    container.appendChild(bar);
}

function renderNumberLine(container, v) {
    const wrap = document.createElement('div');
    wrap.className = 'number-line-container';
    const line = document.createElement('div');
    line.className = 'number-line';
    for (let i = 0; i <= v.denom; i++) {
        const pct = (i / v.denom) * 100;
        const tick = document.createElement('div');
        tick.className = 'nl-tick'; tick.style.left = pct + '%';
        line.appendChild(tick);
        if (i === 0 || i === v.denom) {
            const lbl = document.createElement('div');
            lbl.className = 'nl-label'; lbl.style.left = pct + '%';
            lbl.textContent = i === 0 ? '0' : '1';
            line.appendChild(lbl);
        }
    }
    const ptPct = (v.numer / v.denom) * 100;
    const pt = document.createElement('div');
    pt.className = 'nl-point'; pt.style.left = ptPct + '%';
    line.appendChild(pt);
    const ptLbl = document.createElement('div');
    ptLbl.className = 'nl-point-label'; ptLbl.style.left = ptPct + '%';
    ptLbl.textContent = 'P';
    line.appendChild(ptLbl);
    wrap.appendChild(line);
    container.appendChild(wrap);
}

function renderLabeledNL(container, v) {
    const wrap = document.createElement('div');
    wrap.className = 'number-line-container';
    wrap.style.paddingTop = '56px';
    const line = document.createElement('div');
    line.className = 'number-line';
    for (let i = 0; i <= v.denom; i++) {
        const pct = (i / v.denom) * 100;
        const tick = document.createElement('div');
        tick.className = 'nl-tick'; tick.style.left = pct + '%';
        line.appendChild(tick);
    }
    // Start and end labels
    [{text:v.start,pos:0},{text:'0',pos:0,cls:'nl-label'},{text:'1',pos:100,cls:'nl-label'}].forEach(l => {
        const el = document.createElement('div');
        el.className = l.cls || 'nl-place-label';
        el.style.left = l.pos + '%';
        el.textContent = l.text;
        line.appendChild(el);
    });
    v.places.forEach(p => {
        const pct = (p.pos / v.denom) * 100;
        const pt = document.createElement('div');
        pt.className = 'nl-point'; pt.style.left = pct + '%';
        line.appendChild(pt);
        const lbl = document.createElement('div');
        lbl.className = 'nl-place-label'; lbl.style.left = pct + '%';
        lbl.textContent = p.name;
        line.appendChild(lbl);
    });
    wrap.appendChild(line);
    container.appendChild(wrap);
}

function renderMultiPointNL(container, v) {
    const wrap = document.createElement('div');
    wrap.className = 'number-line-container';
    const line = document.createElement('div');
    line.className = 'number-line';
    for (let i = 0; i <= v.denom; i++) {
        const pct = (i / v.denom) * 100;
        const tick = document.createElement('div');
        tick.className = 'nl-tick'; tick.style.left = pct + '%';
        line.appendChild(tick);
        if (i === 0 || i === v.denom) {
            const lbl = document.createElement('div');
            lbl.className = 'nl-label'; lbl.style.left = pct + '%';
            lbl.textContent = i === 0 ? '0' : '1';
            line.appendChild(lbl);
        }
    }
    v.points.forEach(p => {
        const pct = (p.pos / v.denom) * 100;
        const pt = document.createElement('div');
        pt.className = 'nl-point'; pt.style.left = pct + '%';
        line.appendChild(pt);
        const lbl = document.createElement('div');
        lbl.className = 'nl-point-label'; lbl.style.left = pct + '%';
        lbl.textContent = p.label;
        line.appendChild(lbl);
    });
    wrap.appendChild(line);
    container.appendChild(wrap);
}

function renderComparisonVisual(container, v) {
    const wrap = document.createElement('div');
    wrap.className = 'comparison-visual';
    const eq = document.createElement('div');
    eq.className = 'comparison-equation';
    eq.innerHTML = makeFractionHTML(v.n1, v.d1, true) +
        '<div class="comparison-blank" id="symbolBlank"></div>' +
        makeFractionHTML(v.n2, v.d2, true);
    wrap.appendChild(eq);
    [{n:v.n1,d:v.d1},{n:v.n2,d:v.d2}].forEach((f, idx) => {
        const row = document.createElement('div');
        row.className = 'comp-row';
        const label = document.createElement('div');
        label.className = 'comp-label';
        label.innerHTML = makeFractionHTML(f.n, f.d, false);
        const barWrap = document.createElement('div');
        barWrap.className = 'comp-bar-wrap';
        const fill = document.createElement('div');
        fill.className = 'comp-bar-fill'; fill.style.width = '0%';
        barWrap.appendChild(fill);
        row.appendChild(label); row.appendChild(barWrap);
        wrap.appendChild(row);
        setTimeout(() => { fill.style.width = ((f.n / f.d) * 100) + '%'; }, 100 + idx * 150);
    });
    container.appendChild(wrap);
}

function renderReferenceStrip(container, v) {
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:13px;color:var(--text-secondary);font-weight:600;margin-bottom:8px;text-align:center;';
    lbl.innerHTML = `This strip shows ${makeFractionHTML(v.numer, v.denom, false)}:`;
    container.appendChild(lbl);
    const bar = document.createElement('div');
    bar.className = 'fraction-bar-model'; bar.style.height = '36px';

        const seg = document.createElement('div');
        seg.className = 'bar-segment ' + (i < v.numer ? 'shaded' : 'unshaded');

function renderMCVisualNL(container, problem) {
    const grid = document.createElement('div');
    grid.className = 'mc-options';
    problem.lines.forEach(line => {
        const btn = document.createElement('div');
        btn.className = 'mc-option'; btn.style.padding = '10px';
        const lbl = document.createElement('div');
        lbl.style.cssText = 'font-weight:700;font-size:14px;margin-bottom:4px;';
        lbl.textContent = line.label;
        btn.appendChild(lbl);
        const nlWrap = document.createElement('div');
        nlWrap.className = 'mini-nl-wrap';
        const nl = document.createElement('div');

// ═══════════════════════════════════════════
// ███ ANSWER HANDLING (UNCHANGED FROM ORIGINAL) ███
// ═══════════════════════════════════════════

function handleAnswer(problem, response) {
    const correct = response === problem.answer;
    recordAnswer(problem.category, correct, problem, response);

    // Track in Supabase
    const catLabels = { identify: 'Identifying', numberline: 'Number Lines', comparing: 'Comparing', equivalent: 'Equivalent' };
    GameTracker.recordQuestion({
        questionText: (catLabels[problem.category] || problem.category) + ': ' + (problem.question || '').replace(/<[^>]*>/g, '').substring(0, 200),
        studentAnswer: String(response),
        correctAnswer: String(problem.answer),
        isCorrect: correct
    });
    GameTracker.checkAutoSave();

    nextQuestion();
}

function nextQuestion() {
    updateProgress();

    if (isSessionComplete()) {
        transitionTo('end');
        return;
    }

    const card = document.getElementById('questionCard');
    card.classList.add('slide-out');

    setTimeout(() => {
        const cat = getNextCategory();
        if (!cat) { transitionTo('end'); return; }
        currentProblem = generateProblem(cat);

        card.classList.remove('slide-out');
        card.style.opacity = '0';
        card.style.transform = 'translateX(40px)';

        renderQuestion(currentProblem);

        requestAnimationFrame(() => {
            card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateX(0)';
        });
    }, 300);
}

// ═══════════════════════════════════════════
// ███ SESSION FLOW (UNCHANGED FROM ORIGINAL) ███
// ═══════════════════════════════════════════

function startSession() {
    sessionData = {
        answers: [],
        categoryCorrect: { identify: 0, numberline: 0, comparing: 0, equivalent: 0 },
        categoryTotal: { identify: 0, numberline: 0, comparing: 0, equivalent: 0 },
        totalAnswered: 0,
        startTime: Date.now()
    };
    queue = [];
    requeueBuffer = [];
    problemsSinceRequeue = 0;
    recentSubTypes = [];
    questionsAnswered = 0;
    score = 0;
    bestStreak = 0;
    _currentStreak = 0;

    buildInitialQueue();
    updateProgress();

    transitionTo('question');

    const cat = getNextCategory();
    currentProblem = generateProblem(cat);
    const card = document.getElementById('questionCard');
    card.style.opacity = '1';
    card.style.transform = 'translateX(0)';
    card.style.transition = 'none';
    renderQuestion(currentProblem);
}

function restartSession() {
    transitionTo('start');
}

function transitionTo(screen) {
    const start = document.getElementById('startScreen');
    const card = document.getElementById('questionCard');
    const end = document.getElementById('endScreen');
    start.classList.add('hidden');
    card.classList.add('hidden');
    end.classList.add('hidden');
    switch (screen) {
        case 'start':
            start.classList.remove('hidden');
            document.getElementById('progressFill').style.width = '0%';
            break;
        case 'question':
            card.classList.remove('hidden');
            break;
        case 'end':
            end.classList.remove('hidden');
            renderEndScreen();
            break;
    }
}

function updateProgress() {
    document.getElementById('progressFill').style.width = (getProgress() * 100) + '%';
}

// ═══════════════════════════════════════════
// ███ END SCREEN (UNCHANGED FROM ORIGINAL) ███
// ═══════════════════════════════════════════

function renderEndScreen() {
    const catLabels = { identify: 'Identifying', numberline: 'Number Lines', comparing: 'Comparing', equivalent: 'Equivalent' };
    const total = sessionData.totalAnswered;
    const correct = sessionData.answers.filter(a => a.correct).length;
    const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
    document.getElementById('endSubtitle').textContent = `You answered ${total} questions — ${pct}% correct.`;

    // Final save to Supabase
    GameTracker.saveResult({
        gameFile: 'fractions_review.html',
        gameTitle: 'Fractions Review',
        score: correct,
        questionsAnswered: total,
        bestStreak: bestStreak,
        timeSeconds: Math.round((Date.now() - sessionData.startTime) / 1000)
    });
    const grid = document.getElementById('resultsGrid');
    grid.innerHTML = '';
    CATEGORIES.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'result-card';
        const mastered = sessionData.categoryCorrect[cat] >= MASTERY_THRESHOLD;
        card.innerHTML = `<div class="result-card-label">${catLabels[cat]}</div><div class="result-card-value ${mastered ? 'result-mastered' : 'result-working'}">${sessionData.categoryCorrect[cat]}/${sessionData.categoryTotal[cat]}${mastered ? ' ✓' : ''}</div>`;
        grid.appendChild(card);
    });
    getAIFeedback();
}

async function getAIFeedback() {
    const feedbackEl = document.getElementById('aiFeedbackContent');
    const catLabels = { identify: 'Identifying fractions from shaded models', numberline: 'Reading fractions on number lines', comparing: 'Comparing fractions using < > =', equivalent: 'Finding equivalent fractions' };
    let perfSummary = 'Student performance on fractions practice:\n';
    CATEGORIES.forEach(cat => {
        const c = sessionData.categoryCorrect[cat], t = sessionData.categoryTotal[cat];
        const pct = t > 0 ? Math.round((c/t)*100) : 0;
        perfSummary += `- ${catLabels[cat]}: ${c}/${t} correct (${pct}%) ${c >= MASTERY_THRESHOLD ? '[MASTERED]' : '[NEEDS WORK]'}\n`;
    });
    const wrongs = sessionData.answers.filter(a => !a.correct);
    if (wrongs.length > 0) {
        perfSummary += '\nSpecific errors:\n';
        wrongs.slice(0, 8).forEach(w => {
            perfSummary += `- ${catLabels[w.category]}: answered "${w.response}" (correct: "${w.problem.answer}")\n`;
        });
    }
    try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "claude-sonnet-4-20250514", max_tokens: 1000,
                system: `You are a warm, encouraging math tutor for a 3rd grade student (age 8-9). The student just completed a fractions practice session. Give them brief, specific feedback in 2-3 sentences.\n\nRules:\n- Be encouraging and specific — mention what they did well\n- If they struggled somewhere, give ONE concrete tip they can remember\n- Use simple language a 3rd grader understands\n- Never be discouraging. Frame weaknesses as "next steps" not failures\n- Keep it under 50 words\n- Do NOT use bullet points or lists. Just natural sentences.`,
                messages: [{ role: "user", content: perfSummary }]
            })
        });
        const data = await response.json();
        const text = data.content.map(item => item.type === 'text' ? item.text : '').join('');
        feedbackEl.innerHTML = `<div class="ai-feedback-text">${text}</div>`;
    } catch (err) {
        const correct = sessionData.answers.filter(a => a.correct).length;
        const total = sessionData.totalAnswered;
        const weakCats = CATEGORIES.filter(c => sessionData.categoryCorrect[c] < MASTERY_THRESHOLD);
        let fallback = `You completed ${total} questions and got ${correct} right. `;
        if (weakCats.length === 0) fallback += 'Great work — you showed strong skills across all fraction types!';
        else {
            const catLabelsShort = { identify: 'identifying fractions', numberline: 'number lines', comparing: 'comparing fractions', equivalent: 'equivalent fractions' };
            fallback += `Keep practicing ${weakCats.map(c => catLabelsShort[c]).join(' and ')} — you're getting there!`;
        }
        feedbackEl.innerHTML = `<div class="ai-feedback-text">${fallback}</div>`;
    }
}

function prepareTeacherData() {
    const teacherPayload = {
        timestamp: new Date().toISOString(),
        session_duration_ms: Date.now() - sessionData.startTime,
        total_questions: sessionData.totalAnswered,
        total_correct: sessionData.answers.filter(a => a.correct).length,
        categories: {},
        detailed_answers: sessionData.answers.map(a => ({ category: a.category, correct: a.correct, response: a.response, answer: a.problem.answer, timestamp: a.timestamp }))
    };
    CATEGORIES.forEach(cat => {
        teacherPayload.categories[cat] = { correct: sessionData.categoryCorrect[cat], total: sessionData.categoryTotal[cat], mastered: sessionData.categoryCorrect[cat] >= MASTERY_THRESHOLD };
    });
    console.log('=== TEACHER DASHBOARD PAYLOAD ===');
    console.log(JSON.stringify(teacherPayload, null, 2));
}
