<!DOCTYPE html>
<html>
<head>
<title>Scoring Logic Tests</title>
<style>
body { font: 14px/1.6 system-ui, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
.pass { color: #2e7d32; } .fail { color: #c62828; font-weight: bold; }
h2 { margin-top: 32px; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
pre { background: #f5f5f5; padding: 8px 12px; border-radius: 4px; overflow-x: auto; }
.summary { font-size: 18px; font-weight: bold; margin: 20px 0; padding: 12px; border-radius: 8px; }
.summary.all-pass { background: #e8f5e9; color: #2e7d32; }
.summary.has-fail { background: #fceae8; color: #c62828; }
</style>
</head>
<body>
<h1>Scoring Logic Tests</h1>
<div id="summary"></div>
<div id="output"></div>

<script>
// =====================================================================
// Copy of scoring functions from teacher.html (keep in sync)
// =====================================================================

function collapseAttempts(questions) {
    if (questions.length === 0) return questions;
    const collapsed = [];
    let i = 0;
    while (i < questions.length) {
        const qt = questions[i].question_text;
        const ca = questions[i].correct_answer;
        let j = i + 1;
        while (j < questions.length && questions[j].question_text === qt && questions[j].correct_answer === ca) j++;
        const group = questions.slice(i, j);
        if (group.some(q => (q.attempt_number || 1) > 1)) {
            const final = group[group.length - 1];
            collapsed.push(final);
        } else if (group.length === 1) {
            collapsed.push(group[0]);
        } else {
            const final = { ...group[group.length - 1] };
            final.attempt_number = group.length;
            final._wrongAttempts = group.filter(q => !q.is_correct).map(q => q.student_answer);
            collapsed.push(final);
        }
        i = j;
    }
    return collapsed;
}

function firstAttemptDedup(questions) {
    const seen = {};
    const result = [];
    questions.forEach(q => {
        const key = (q.question_text || '') + '||' + (q.correct_answer || '');
        if (key in seen) {
            const first = seen[key];
            first.attempt_number = (first.attempt_number || 1) + (q.attempt_number || 1);
            if (!first.is_correct) {
                if (!first._wrongAttempts) first._wrongAttempts = [];
                if (q._wrongAttempts) first._wrongAttempts.push(...q._wrongAttempts);
                if (!q.is_correct) first._wrongAttempts.push(q.student_answer);
            }
        } else {
            const entry = { ...q };
            if ((entry.attempt_number || 1) > 1) {
                entry.is_correct = false;
            }
            seen[key] = entry;
            result.push(entry);
        }
    });
    return result;
}

// Table enrichment logic (extracted)
function enrichScoring(scoped) {
    scoped.sort((a, b) => (a.answered_at || '').localeCompare(b.answered_at || ''));
    const byQ = {};
    scoped.forEach(q => {
        const qKey = (q.question_text || '') + '||' + (q.correct_answer || '');
        if (!(qKey in byQ)) byQ[qKey] = !!q.is_correct;
    });
    const qTexts = Object.keys(byQ);
    const rightUnique = qTexts.filter(k => byQ[k]).length;
    const wrongUnique = qTexts.length - rightUnique;
    return { questions: qTexts.length, right: rightUnique, wrong: wrongUnique };
}

// Full panel pipeline
function panelPipeline(rawQuestions) {
    const collapsed = collapseAttempts(rawQuestions);
    const deduped = firstAttemptDedup(collapsed);
    const right = deduped.filter(q => q.is_correct).length;
    const wrong = deduped.length - right;
    return { questions: deduped.length, right, wrong, entries: deduped };
}

// =====================================================================
// Helper to make question objects
// =====================================================================
function q(text, answer, correct, studentAns, time, opts = {}) {
    return {
        question_text: text,
        correct_answer: answer,
        is_correct: correct,
        student_answer: studentAns || (correct ? answer : 'wrong'),
        answered_at: time || '2026-02-24T10:00:00Z',
        attempt_number: opts.attempt_number || 1
    };
}

// =====================================================================
// Test runner
// =====================================================================
let passed = 0, failed = 0;
const out = document.getElementById('output');

function test(name, fn) {
    try {
        fn();
        passed++;
        out.innerHTML += `<div class="pass">PASS: ${name}</div>`;
    } catch (e) {
        failed++;
        out.innerHTML += `<div class="fail">FAIL: ${name}</div><pre>${e.message}</pre>`;
    }
}

function assert(condition, msg) {
    if (!condition) throw new Error(msg || 'Assertion failed');
}
function assertEqual(actual, expected, label) {
    if (actual !== expected) throw new Error(`${label || ''} expected ${expected}, got ${actual}`);
}

// =====================================================================
// TABLE ENRICHMENT TESTS (enrichScoring)
// =====================================================================
out.innerHTML += '<h2>Table Enrichment (enrichScoring)</h2>';

test('Single correct question → 1 right', () => {
    const r = enrichScoring([q('2/4', '1/2', true, '1/2', 'T1')]);
    assertEqual(r.right, 1, 'right');
    assertEqual(r.wrong, 0, 'wrong');
    assertEqual(r.questions, 1, 'questions');
});

test('Single wrong question → 1 wrong', () => {
    const r = enrichScoring([q('2/4', '1/2', false, '3/4', 'T1')]);
    assertEqual(r.right, 0, 'right');
    assertEqual(r.wrong, 1, 'wrong');
});

test('Wrong then right (same question) → wrong (first attempt counts)', () => {
    const r = enrichScoring([
        q('2/4', '1/2', false, '3/4', 'T1'),
        q('2/4', '1/2', true,  '1/2', 'T2'),
    ]);
    assertEqual(r.right, 0, 'right');
    assertEqual(r.wrong, 1, 'wrong');
    assertEqual(r.questions, 1, 'questions');
});

test('Right then wrong (same question) → right (first attempt counts)', () => {
    const r = enrichScoring([
        q('2/4', '1/2', true,  '1/2', 'T1'),
        q('2/4', '1/2', false, '3/4', 'T2'),
    ]);
    assertEqual(r.right, 1, 'right');
    assertEqual(r.wrong, 0, 'wrong');
});

test('Same question_text, different correct_answer → 2 separate questions', () => {
    const r = enrichScoring([
        q('2/4', '1/2', true,  '1/2', 'T1'),
        q('2/4', '3/6', true,  '3/6', 'T2'),
    ]);
    assertEqual(r.questions, 2, 'questions');
    assertEqual(r.right, 2, 'right');
});

test('Same question_text, different answer — one right one wrong', () => {
    const r = enrichScoring([
        q('2/4', '1/2', true,  '1/2', 'T1'),
        q('2/4', '3/6', false, '2/3', 'T2'),
    ]);
    assertEqual(r.questions, 2, 'questions');
    assertEqual(r.right, 1, 'right');
    assertEqual(r.wrong, 1, 'wrong');
});

test('Fraction Blaster scenario: 3 unique, 1 retry, 1 re-gen', () => {
    // A wrong then replayed correct, B correct, A (diff answer) correct
    const r = enrichScoring([
        q('2/4', '1/2', false, '3/4', 'T1'),  // A: wrong
        q('3/6', '1/2', true,  '1/2', 'T2'),  // B: right
        q('2/4', '3/6', true,  '3/6', 'T3'),  // C: different problem, same display
        q('2/4', '1/2', true,  '1/2', 'T4'),  // A: replay, correct
    ]);
    assertEqual(r.questions, 3, 'questions');  // A, B, C
    assertEqual(r.right, 2, 'right');          // B and C
    assertEqual(r.wrong, 1, 'wrong');          // A (first attempt was wrong)
});

test('All wrong → 0 right', () => {
    const r = enrichScoring([
        q('1/2', '2/4', false, 'x', 'T1'),
        q('1/3', '2/6', false, 'x', 'T2'),
    ]);
    assertEqual(r.right, 0);
    assertEqual(r.wrong, 2);
});

// =====================================================================
// COLLAPSE ATTEMPTS TESTS
// =====================================================================
out.innerHTML += '<h2>collapseAttempts</h2>';

test('Empty input → empty output', () => {
    assertEqual(collapseAttempts([]).length, 0);
});

test('Single question passes through', () => {
    const r = collapseAttempts([q('2/4', '1/2', true, '1/2')]);
    assertEqual(r.length, 1);
    assert(r[0].is_correct);
});

test('Consecutive same question → collapsed to 1 with attempt_number', () => {
    const r = collapseAttempts([
        q('2/4', '1/2', false, '3/4'),
        q('2/4', '1/2', false, '2/3'),
        q('2/4', '1/2', true,  '1/2'),
    ]);
    assertEqual(r.length, 1, 'count');
    assertEqual(r[0].attempt_number, 3, 'attempts');
    assert(r[0].is_correct, 'last attempt was correct');
    assertEqual(r[0]._wrongAttempts.length, 2, 'wrong attempts collected');
});

test('Consecutive same text but different answer → NOT collapsed', () => {
    const r = collapseAttempts([
        q('2/4', '1/2', true, '1/2'),
        q('2/4', '3/6', true, '3/6'),
    ]);
    assertEqual(r.length, 2, 'should be 2 separate entries');
});

test('Non-consecutive duplicates → not collapsed (left for firstAttemptDedup)', () => {
    const r = collapseAttempts([
        q('2/4', '1/2', false, '3/4'),
        q('3/6', '1/2', true,  '1/2'),
        q('2/4', '1/2', true,  '1/2'),
    ]);
    assertEqual(r.length, 3, 'all 3 remain');
});

test('Explicit attempt_number > 1 → keeps last row as-is', () => {
    const r = collapseAttempts([
        q('2/4', '1/2', false, '3/4', null, { attempt_number: 1 }),
        q('2/4', '1/2', true,  '1/2', null, { attempt_number: 2 }),
    ]);
    assertEqual(r.length, 1, 'collapsed');
    assert(r[0].is_correct, 'kept last (correct)');
    assertEqual(r[0].attempt_number, 2, 'kept explicit attempt_number');
});

// =====================================================================
// FIRST ATTEMPT DEDUP TESTS
// =====================================================================
out.innerHTML += '<h2>firstAttemptDedup</h2>';

test('No duplicates → pass through unchanged', () => {
    const input = [
        q('1/2', '2/4', true,  '2/4'),
        q('1/3', '2/6', false, 'x'),
    ];
    const r = firstAttemptDedup(input);
    assertEqual(r.length, 2);
    assert(r[0].is_correct);
    assert(!r[1].is_correct);
});

test('Entry with attempt_number > 1 → marked wrong', () => {
    const input = [{ ...q('2/4', '1/2', true, '1/2'), attempt_number: 3 }];
    const r = firstAttemptDedup(input);
    assertEqual(r.length, 1);
    assert(!r[0].is_correct, 'should be wrong due to retries');
});

test('Non-consecutive dup, first was wrong → stays wrong, attempts merged', () => {
    const input = [
        q('2/4', '1/2', false, '3/4'),
        q('3/6', '1/2', true,  '1/2'),
        q('2/4', '1/2', true,  '1/2'),
    ];
    const r = firstAttemptDedup(input);
    assertEqual(r.length, 2, 'deduped to 2');
    assert(!r[0].is_correct, 'first was wrong, stays wrong');
    assertEqual(r[0].attempt_number, 2, 'merged attempts');
    assert(r[1].is_correct, 'other question unaffected');
});

test('Non-consecutive dup, first was correct → stays correct', () => {
    const input = [
        q('2/4', '1/2', true, '1/2'),
        q('3/6', '1/2', true, '1/2'),
        q('2/4', '1/2', true, '1/2'),  // re-generation, not a retry
    ];
    const r = firstAttemptDedup(input);
    assertEqual(r.length, 2, 'deduped to 2');
    assert(r[0].is_correct, 'first was correct, stays correct');
});

test('Same question_text different answer → not deduped', () => {
    const input = [
        q('2/4', '1/2', true,  '1/2'),
        q('2/4', '3/6', false, 'x'),
    ];
    const r = firstAttemptDedup(input);
    assertEqual(r.length, 2, 'different problems, not deduped');
});

// =====================================================================
// FULL PIPELINE TESTS (panel: collapse + dedup)
// =====================================================================
out.innerHTML += '<h2>Full Panel Pipeline</h2>';

test('Simple correct session', () => {
    const r = panelPipeline([
        q('1/2', '2/4', true, '2/4', 'T1'),
        q('1/3', '2/6', true, '2/6', 'T2'),
        q('1/4', '2/8', true, '2/8', 'T3'),
    ]);
    assertEqual(r.questions, 3);
    assertEqual(r.right, 3);
    assertEqual(r.wrong, 0);
});

test('Consecutive retry then correct → 1 wrong question', () => {
    const r = panelPipeline([
        q('2/4', '1/2', false, '3/4', 'T1'),
        q('2/4', '1/2', false, '2/3', 'T2'),
        q('2/4', '1/2', true,  '1/2', 'T3'),
    ]);
    assertEqual(r.questions, 1);
    assertEqual(r.wrong, 1, 'retried = wrong');
    assertEqual(r.right, 0);
});

test('Non-consecutive replay (Fraction Blaster style)', () => {
    // Wrong on 2/4→1/2, correct on 3/6, then 2/4→1/2 replays correctly
    const r = panelPipeline([
        q('2/4', '1/2', false, '3/4', 'T1'),
        q('3/6', '1/2', true,  '1/2', 'T2'),
        q('2/4', '1/2', true,  '1/2', 'T3'),  // replay
    ]);
    assertEqual(r.questions, 2, '2 unique problems');
    assertEqual(r.right, 1, '3/6 was right');
    assertEqual(r.wrong, 1, '2/4 was wrong on first attempt');
});

test('Same display fraction, different answers → separate questions', () => {
    const r = panelPipeline([
        q('2/4', '1/2', true, '1/2', 'T1'),
        q('2/4', '3/6', true, '3/6', 'T2'),
    ]);
    assertEqual(r.questions, 2, 'two distinct problems');
    assertEqual(r.right, 2);
});

test('Realistic Fraction Blaster session with streak', () => {
    // Student gets a few wrong early, builds streak with replays
    const r = panelPipeline([
        q('3/6', '1/2', false, '2/3', 'T01'),  // wrong
        q('2/4', '1/2', true,  '1/2', 'T02'),  // right
        q('1/3', '2/6', false, '1/6', 'T03'),  // wrong
        q('3/6', '1/2', true,  '1/2', 'T04'),  // replay of T01 → correct
        q('1/3', '2/6', true,  '2/6', 'T05'),  // replay of T03 → correct
        q('2/8', '1/4', true,  '1/4', 'T06'),  // right
        q('4/6', '2/3', true,  '2/3', 'T07'),  // right
        q('3/9', '1/3', true,  '1/3', 'T08'),  // right
        q('2/4', '3/6', true,  '3/6', 'T09'),  // right (diff answer than T02)
        q('5/10','1/2', true,  '1/2', 'T10'),  // right
    ]);
    assertEqual(r.questions, 8, '8 unique problems');
    assertEqual(r.right, 6, '6 right on first attempt');
    assertEqual(r.wrong, 2, '3/6→1/2 and 1/3→2/6 wrong on first attempt');
});

test('Table and panel agree on same data', () => {
    const raw = [
        q('3/6', '1/2', false, '2/3', 'T01'),
        q('2/4', '1/2', true,  '1/2', 'T02'),
        q('1/3', '2/6', false, '1/6', 'T03'),
        q('3/6', '1/2', true,  '1/2', 'T04'),
        q('1/3', '2/6', true,  '2/6', 'T05'),
        q('2/8', '1/4', true,  '1/4', 'T06'),
    ];
    const table = enrichScoring(raw);
    const panel = panelPipeline(raw);
    assertEqual(table.right, panel.right, 'right counts match');
    assertEqual(table.wrong, panel.wrong, 'wrong counts match');
    assertEqual(table.questions, panel.questions, 'question counts match');
});

// =====================================================================
// SUMMARY
// =====================================================================
const summaryEl = document.getElementById('summary');
const total = passed + failed;
summaryEl.className = 'summary ' + (failed === 0 ? 'all-pass' : 'has-fail');
summaryEl.textContent = failed === 0
    ? `All ${total} tests passed`
    : `${failed} of ${total} tests FAILED`;
</script>
</body>
</html>
