<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Math Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }

        /* Password Gate */
        #password-gate {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #2d3436, #636e72);
            display: flex; align-items: center; justify-content: center;
            z-index: 99999;
        }
        #password-box {
            background: white; border-radius: 20px; padding: 40px 36px;
            max-width: 360px; width: 90%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        #password-box h2 { color: #333; margin-bottom: 6px; font-size: 1.3rem; }
        #password-box p { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
        #password-input {
            display: block; width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 1rem; text-align: center; outline: none;
            font-family: inherit;
        }
        #password-input:focus { border-color: #667eea; }
        #password-btn {
            display: block; width: 100%; padding: 12px;
            background: linear-gradient(135deg, #2d3436, #636e72);
            color: white; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            margin-top: 12px; font-family: inherit;
        }
        #password-error { color: #e53935; font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }

        /* Dashboard */
        #dashboard { display: none; }

        /* Header */
        .dash-header {
            background: linear-gradient(135deg, #2d3436, #636e72);
            padding: 20px 32px;
            color: white;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px;
        }
        .dash-header h1 { font-size: 1.4rem; }
        .dash-header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .dash-header select, .dash-header button {
            padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1); color: white;
            font-size: 0.85rem; cursor: pointer; font-family: inherit;
        }
        .dash-header select option { color: #333; background: white; }
        .dash-header button:hover { background: rgba(255,255,255,0.2); }
        .btn-export { background: rgba(76,175,80,0.3) !important; border-color: rgba(76,175,80,0.5) !important; }
        .btn-refresh { background: rgba(33,150,243,0.3) !important; border-color: rgba(33,150,243,0.5) !important; }

        /* Stats cards */
        .stats-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px; padding: 24px 32px;
        }
        .stat-card {
            background: white; border-radius: 14px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card .stat-value { font-size: 2rem; font-weight: 800; color: #333; }
        .stat-card .stat-label { font-size: 0.8rem; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

        /* Tabs */
        .tabs {
            display: flex; gap: 0; padding: 0 32px; border-bottom: 2px solid #e0e0e0;
            background: white;
        }
        .tab {
            padding: 12px 20px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
            color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px;
            transition: all 0.2s; font-family: inherit; background: none; border-top: none;
            border-left: none; border-right: none;
        }
        .tab:hover { color: #555; }
        .tab.active { color: #667eea; border-bottom-color: #667eea; }

        /* Tab content */
        .tab-content { display: none; padding: 24px 32px; }
        .tab-content.active { display: block; }

        /* Table */
        .data-table {
            width: 100%; border-collapse: collapse; background: white;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .data-table th {
            background: #f8f9fa; padding: 12px 16px; text-align: left;
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: #888; font-weight: 700; cursor: pointer; user-select: none;
            white-space: nowrap;
        }
        .data-table th:hover { color: #555; }
        .data-table th .sort-arrow { margin-left: 4px; font-size: 0.7rem; }
        .data-table td {
            padding: 11px 16px; border-top: 1px solid #f0f0f0;
            font-size: 0.88rem; color: #444;
        }
        .data-table tr:hover td { background: #f8f9ff; }

        /* Accuracy badges */
        .acc-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-weight: 700; font-size: 0.82rem;
        }
        .acc-high { background: #e8f5e9; color: #2e7d32; }
        .acc-mid { background: #fff3e0; color: #e65100; }
        .acc-low { background: #fce4ec; color: #c62828; }

        /* Student cards */
        .student-card {
            background: white; border-radius: 14px; padding: 20px 24px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer; transition: box-shadow 0.2s;
        }
        .student-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
        .student-card.expanded { cursor: default; }
        .student-card-header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }
        .student-card-header h3 { color: #333; font-size: 1.1rem; }
        .student-card-header .meta { color: #999; font-size: 0.85rem; }
        .student-card-summary {
            display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap;
        }
        .student-card-summary .summary-chip {
            background: #f8f9fa; border-radius: 8px; padding: 6px 12px;
            font-size: 0.82rem; color: #555;
        }
        .summary-chip strong { color: #333; }

        /* Expanded detail area */
        .student-detail-area { display: none; margin-top: 16px; }
        .student-card.expanded .student-detail-area { display: block; }
        .detail-toolbar {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .detail-toolbar label { font-size: 0.85rem; color: #666; cursor: pointer; }
        .detail-toolbar select {
            padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd;
            font-size: 0.82rem; font-family: inherit;
        }
        .toggle-mistakes {
            display: flex; align-items: center; gap: 6px;
            background: #fce4ec; border-radius: 8px; padding: 6px 12px;
            cursor: pointer; font-size: 0.82rem; color: #c62828; font-weight: 600;
            border: none; font-family: inherit; transition: background 0.2s;
        }
        .toggle-mistakes.active { background: #c62828; color: white; }
        .toggle-mistakes:hover { opacity: 0.85; }

        /* Question detail table */
        .question-table {
            width: 100%; border-collapse: collapse; font-size: 0.82rem;
        }
        .question-table th {
            background: #f8f9fa; padding: 8px 12px; text-align: left;
            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: #888; font-weight: 700;
        }
        .question-table td {
            padding: 8px 12px; border-top: 1px solid #f0f0f0; color: #444;
        }
        .question-table tr.correct td { background: #f6fff6; }
        .question-table tr.wrong td { background: #fff6f6; }
        .question-table .icon { font-size: 1rem; }
        .question-table .answer-wrong { color: #c62828; font-weight: 600; }
        .question-table .answer-correct { color: #2e7d32; }

        /* Game accuracy cards */
        .game-acc-card {
            background: #f8f9fa; border-radius: 10px; padding: 12px 16px;
            font-size: 0.85rem; display: flex; align-items: center;
            justify-content: space-between; gap: 10px;
        }
        .game-acc-card .game-name { font-weight: 700; color: #333; }
        .game-acc-card .game-stats { color: #888; font-size: 0.8rem; }
        .game-acc-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px; margin-bottom: 12px;
        }

        /* Loading */
        .loading { text-align: center; padding: 60px; color: #999; font-size: 1.1rem; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #ddd; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty state */
        .empty { text-align: center; padding: 60px; color: #bbb; }
        .empty .empty-icon { font-size: 3rem; margin-bottom: 12px; }

        /* Pagination */
        .pagination { display: flex; gap: 6px; margin-top: 12px; align-items: center; justify-content: center; }
        .pagination button {
            padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd;
            background: white; cursor: pointer; font-size: 0.82rem; font-family: inherit;
        }
        .pagination button.active { background: #667eea; color: white; border-color: #667eea; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

        @media (max-width: 600px) {
            .dash-header { padding: 16px; }
            .stats-row, .tab-content { padding: 16px; }
            .tabs { padding: 0 16px; overflow-x: auto; }
            .data-table, .question-table { font-size: 0.78rem; }
            .data-table th, .data-table td { padding: 8px 10px; }
            .student-card { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <!-- Password Gate -->
    <div id="password-gate">
        <div id="password-box">
            <h2>🔐 Teacher Dashboard</h2>
            <p>Enter your teacher password</p>
            <input type="password" id="password-input" placeholder="Password" autocomplete="off" />
            <button id="password-btn" onclick="checkPassword()">Enter</button>
            <p id="password-error"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <div class="dash-header">
            <h1>📊 Teacher Dashboard</h1>
            <div class="dash-header-actions">
                <select id="class-filter">
                    <option value="all">All Classes</option>
                </select>
                <select id="game-filter">
                    <option value="all">All Games</option>
                </select>
                <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
                <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="stat-students">-</div>
                <div class="stat-label">Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-questions">-</div>
                <div class="stat-label">Questions Answered</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-accuracy">-</div>
                <div class="stat-label">Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-wrong">-</div>
                <div class="stat-label">Wrong Answers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-today">-</div>
                <div class="stat-label">Questions Today</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('results', this)">All Results</button>
            <button class="tab" onclick="switchTab('students', this)">By Student</button>
            <button class="tab" onclick="switchTab('games', this)">By Game</button>
        </div>

        <!-- All Results Tab -->
        <div class="tab-content active" id="tab-results">
            <table class="data-table" id="results-table">
                <thead>
                    <tr>
                        <th onclick="sortTable('first_name')">Student <span class="sort-arrow"></span></th>
                        <th onclick="sortTable('class_code')">Class <span class="sort-arrow"></span></th>
                        <th onclick="sortTable('game_title')">Game <span class="sort-arrow"></span></th>
                        <th onclick="sortTable('questions_answered')">Questions <span class="sort-arrow"></span></th>
                        <th onclick="sortTable('right_count')">Right <span class="sort-arrow"></span></th>
                        <th onclick="sortTable('wrong_count')">Wrong <span class="sort-arrow"></span></th>
                        <th onclick="sortTable('accuracy')">Accuracy <span class="sort-arrow"></span></th>
                        <th onclick="sortTable('played_at')">Date <span class="sort-arrow"></span></th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>

        <!-- By Student Tab -->
        <div class="tab-content" id="tab-students">
            <div class="loading"><span class="loading-spinner"></span> Loading...</div>
        </div>

        <!-- By Game Tab -->
        <div class="tab-content" id="tab-games">
            <table class="data-table" id="games-table">
                <thead>
                    <tr>
                        <th>Game</th>
                        <th>Times Played</th>
                        <th>Total Questions</th>
                        <th>Accuracy</th>
                        <th>Most Missed</th>
                    </tr>
                </thead>
                <tbody id="games-body"></tbody>
            </table>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://pnarndrlkkrzqvbnmahh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8ZmsmQ2JV7m3cwGOUbGiIg_UM6gw17d';
    const TEACHER_PASSWORD = 'mathteacher2026';

    let allStudents = [];
    let allResults = [];
    let allQuestions = [];  // question_responses data
    let questionsByStudent = {}; // studentId -> [questions]
    let currentSort = { key: 'played_at', dir: 'desc' };

    // Cache loaded student question details
    const studentQuestionCache = {};

    // ============ AUTH ============
    function checkPassword() {
        const input = document.getElementById('password-input').value;
        if (input === TEACHER_PASSWORD) {
            document.getElementById('password-gate').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            sessionStorage.setItem('teacher_auth', 'true');
            loadData();
        } else {
            document.getElementById('password-error').textContent = 'Incorrect password';
        }
    }

    document.getElementById('password-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkPassword();
    });

    if (sessionStorage.getItem('teacher_auth') === 'true') {
        document.getElementById('password-gate').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
    } else {
        setTimeout(() => document.getElementById('password-input').focus(), 100);
    }

    // ============ DATA ============
    async function supaFetch(table, query = '') {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`
            }
        });
        return res.json();
    }

    async function loadData() {
        document.getElementById('results-body').innerHTML =
            '<tr><td colspan="8" class="loading"><span class="loading-spinner"></span> Loading...</td></tr>';

        // Load students, game_results, and question_responses summary
        const [students, results, questions] = await Promise.all([
            supaFetch('students', 'order=created_at.asc'),
            supaFetch('game_results', 'select=*,students(first_name,class_code)&order=played_at.desc&limit=5000'),
            supaFetch('question_responses', 'select=student_id,game_file,is_correct&limit=50000')
        ]);

        allStudents = students;
        const enriched = results.map(r => ({
            ...r,
            first_name: r.students?.first_name || 'Unknown',
            class_code: r.students?.class_code || '?'
        }));

        // Deduplicate: keep one row per session.
        // Real session_ids (from tracker.js) are short base36 strings like "m5abc1x2f".
        // Backfilled session_ids are UUIDs (from the migration: session_id = id::text).
        // Group backfilled/missing rows by student + game + date to collapse auto-save dupes.
        const isRealSessionId = (sid) => sid && sid.length < 20 && !sid.includes('-');
        const dedup = {};
        enriched.forEach(r => {
            let sessionKey;
            if (isRealSessionId(r.session_id)) {
                sessionKey = r.session_id;
            } else {
                // Backfilled UUID or missing: group by date
                const day = r.played_at ? r.played_at.split('T')[0] : 'unknown';
                sessionKey = 'legacy_' + day;
            }
            const key = r.student_id + '|' + r.game_file + '|' + sessionKey;
            if (!dedup[key] || (r.questions_answered || 0) > (dedup[key].questions_answered || 0)) {
                dedup[key] = r;
            }
        });
        allResults = Object.values(dedup);
        allQuestions = questions;

        // Build question stats by student
        questionsByStudent = {};
        allQuestions.forEach(q => {
            if (!questionsByStudent[q.student_id]) {
                questionsByStudent[q.student_id] = { total: 0, right: 0, wrong: 0, byGame: {} };
            }
            const s = questionsByStudent[q.student_id];
            s.total++;
            if (q.is_correct) s.right++; else s.wrong++;
            if (!s.byGame[q.game_file]) s.byGame[q.game_file] = { total: 0, right: 0, wrong: 0 };
            const g = s.byGame[q.game_file];
            g.total++;
            if (q.is_correct) g.right++; else g.wrong++;
        });

        // Enrich results with accuracy from question data
        allResults.forEach(r => {
            const qs = questionsByStudent[r.student_id];
            if (qs && qs.byGame[r.game_file]) {
                const g = qs.byGame[r.game_file];
                r.right_count = g.right;
                r.wrong_count = g.wrong;
                r.accuracy = g.total > 0 ? Math.round((g.right / g.total) * 100) : null;
            } else {
                r.right_count = null;
                r.wrong_count = null;
                r.accuracy = null;
            }
        });

        populateFilters();
        updateStats();
        renderResults();
        renderStudents();
        renderGames();
    }

    function getFilteredResults() {
        const classVal = document.getElementById('class-filter').value;
        const gameVal = document.getElementById('game-filter').value;
        return allResults.filter(r => {
            if (classVal !== 'all' && r.class_code !== classVal) return false;
            if (gameVal !== 'all' && r.game_file !== gameVal) return false;
            return true;
        });
    }

    function getFilteredStudentIds() {
        const classVal = document.getElementById('class-filter').value;
        if (classVal === 'all') return allStudents.map(s => s.id);
        return allStudents.filter(s => s.class_code === classVal).map(s => s.id);
    }

    function populateFilters() {
        const classFilter = document.getElementById('class-filter');
        const gameFilter = document.getElementById('game-filter');
        const classes = [...new Set(allStudents.map(s => s.class_code))].sort();
        const games = [...new Set(allResults.map(r => r.game_title || r.game_file))].sort();
        const classVal = classFilter.value;
        const gameVal = gameFilter.value;
        classFilter.innerHTML = '<option value="all">All Classes</option>' +
            classes.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
        gameFilter.innerHTML = '<option value="all">All Games</option>' +
            games.map(g => `<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('');
        classFilter.value = classVal;
        gameFilter.value = gameVal;
    }

    document.getElementById('class-filter').addEventListener('change', () => {
        updateStats(); renderResults(); renderStudents(); renderGames();
    });
    document.getElementById('game-filter').addEventListener('change', () => {
        updateStats(); renderResults(); renderStudents(); renderGames();
    });

    // ============ STATS ============
    function updateStats() {
        const filteredIds = new Set(getFilteredStudentIds());
        // Get questions for filtered students
        const filteredQ = allQuestions.filter(q => filteredIds.has(q.student_id));
        const gameVal = document.getElementById('game-filter').value;
        const finalQ = gameVal === 'all' ? filteredQ : filteredQ.filter(q => q.game_file === gameVal);

        const totalQ = finalQ.length;
        const rightQ = finalQ.filter(q => q.is_correct).length;
        const wrongQ = totalQ - rightQ;
        const accuracy = totalQ > 0 ? Math.round((rightQ / totalQ) * 100) : 0;

        // Count unique students from game_results (not just question_responses)
        // so students without question data still get counted
        const filteredResults = getFilteredResults();
        const uniqueStudents = new Set(filteredResults.map(r => r.student_id));

        // Today's questions — we don't have answered_at in the summary fetch,
        // so use game_results played_at as proxy
        const today = new Date().toISOString().split('T')[0];
        const todayResults = filteredResults.filter(r => r.played_at && r.played_at.startsWith(today));
        const todayQuestions = todayResults.reduce((sum, r) => sum + (r.questions_answered || 0), 0);

        document.getElementById('stat-students').textContent = uniqueStudents.size;
        document.getElementById('stat-questions').textContent = totalQ.toLocaleString();
        document.getElementById('stat-accuracy').textContent = accuracy + '%';
        document.getElementById('stat-wrong').textContent = wrongQ.toLocaleString();
        document.getElementById('stat-today').textContent = todayQuestions;
    }

    // ============ RESULTS TABLE ============
    function sortTable(key) {
        if (currentSort.key === key) {
            currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort = { key, dir: 'asc' };
        }
        renderResults();
    }

    function renderResults() {
        const filtered = getFilteredResults();
        const sorted = [...filtered].sort((a, b) => {
            let va = a[currentSort.key] ?? '';
            let vb = b[currentSort.key] ?? '';
            if (typeof va === 'number' && typeof vb === 'number') return currentSort.dir === 'asc' ? va - vb : vb - va;
            va = String(va).toLowerCase();
            vb = String(vb).toLowerCase();
            return currentSort.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });

        const tbody = document.getElementById('results-body');
        if (sorted.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="empty-icon">📭</div>No results yet</div></td></tr>';
            return;
        }

        tbody.innerHTML = sorted.map(r => {
            const title = r.game_title || r.game_file.replace('.html', '').replace(/_/g, ' ');
            const date = r.played_at ? new Date(r.played_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '-';
            const accClass = r.accuracy >= 80 ? 'acc-high' : r.accuracy >= 50 ? 'acc-mid' : 'acc-low';
            const accText = r.accuracy !== null ? r.accuracy + '%' : '-';
            return `<tr>
                <td><strong>${escHtml(r.first_name)}</strong></td>
                <td>${escHtml(r.class_code)}</td>
                <td>${escHtml(title)}</td>
                <td>${r.questions_answered || '-'}</td>
                <td>${r.right_count !== null ? '<span style="color:#2e7d32;font-weight:600">' + r.right_count + '</span>' : '-'}</td>
                <td>${r.wrong_count !== null ? '<span style="color:#c62828;font-weight:600">' + r.wrong_count + '</span>' : '-'}</td>
                <td>${r.accuracy !== null ? '<span class="acc-badge ' + accClass + '">' + accText + '</span>' : '-'}</td>
                <td>${date}</td>
            </tr>`;
        }).join('');
    }

    // ============ BY STUDENT ============
    function renderStudents() {
        const filtered = getFilteredResults();
        const container = document.getElementById('tab-students');

        const byStudent = {};
        filtered.forEach(r => {
            if (!byStudent[r.student_id]) {
                byStudent[r.student_id] = { id: r.student_id, name: r.first_name, classCode: r.class_code, results: [] };
            }
            byStudent[r.student_id].results.push(r);
        });

        if (Object.keys(byStudent).length === 0) {
            container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No students found</div>';
            return;
        }

        container.innerHTML = Object.values(byStudent)
            .sort((a, b) => a.name.localeCompare(b.name))
            .map(student => {
                const qs = questionsByStudent[student.id];
                const totalQ = qs ? qs.total : 0;
                const rightQ = qs ? qs.right : 0;
                const wrongQ = qs ? qs.wrong : 0;
                const accuracy = totalQ > 0 ? Math.round((rightQ / totalQ) * 100) : 0;
                const accClass = accuracy >= 80 ? 'acc-high' : accuracy >= 50 ? 'acc-mid' : 'acc-low';

                // Per-game accuracy chips
                const gameChips = qs ? Object.entries(qs.byGame).map(([gf, gs]) => {
                    const title = gf.replace('.html', '').replace(/_/g, ' ');
                    const gAcc = gs.total > 0 ? Math.round((gs.right / gs.total) * 100) : 0;
                    const gAccClass = gAcc >= 80 ? 'acc-high' : gAcc >= 50 ? 'acc-mid' : 'acc-low';
                    return `<div class="game-acc-card">
                        <div>
                            <div class="game-name">${escHtml(title)}</div>
                            <div class="game-stats">${gs.right}/${gs.total} correct</div>
                        </div>
                        <span class="acc-badge ${gAccClass}">${gAcc}%</span>
                    </div>`;
                }).join('') : '';

                return `<div class="student-card" id="student-${student.id}" onclick="toggleStudentDetail('${student.id}')">
                    <div class="student-card-header">
                        <h3>${escHtml(student.name)} <span class="meta">(${escHtml(student.classCode)})</span></h3>
                        <span class="acc-badge ${accClass}" style="font-size:1rem;">${accuracy}%</span>
                    </div>
                    <div class="student-card-summary">
                        <div class="summary-chip"><strong>${totalQ}</strong> questions</div>
                        <div class="summary-chip" style="color:#2e7d32"><strong>${rightQ}</strong> right</div>
                        <div class="summary-chip" style="color:#c62828"><strong>${wrongQ}</strong> wrong</div>
                        <div class="summary-chip"><strong>${student.results.length}</strong> sessions</div>
                    </div>
                    <div class="game-acc-grid" style="margin-top:12px;">${gameChips}</div>
                    <div class="student-detail-area" id="detail-${student.id}">
                        <div class="loading" style="padding:20px;"><span class="loading-spinner"></span> Loading question details...</div>
                    </div>
                </div>`;
            }).join('');
    }

    async function toggleStudentDetail(studentId) {
        const card = document.getElementById('student-' + studentId);
        const detail = document.getElementById('detail-' + studentId);

        if (card.classList.contains('expanded')) {
            card.classList.remove('expanded');
            return;
        }

        card.classList.add('expanded');

        // Lazy-load question details for this student
        if (!studentQuestionCache[studentId]) {
            try {
                const questions = await supaFetch('question_responses',
                    `student_id=eq.${studentId}&order=answered_at.desc&limit=500`);
                studentQuestionCache[studentId] = questions;
            } catch (err) {
                detail.innerHTML = '<div style="color:#c62828;padding:12px;">Failed to load question data.</div>';
                return;
            }
        }

        renderStudentDetail(studentId);
    }

    function renderStudentDetail(studentId) {
        const detail = document.getElementById('detail-' + studentId);
        const questions = studentQuestionCache[studentId] || [];

        if (questions.length === 0) {
            detail.innerHTML = '<div style="color:#999;padding:12px;">No question data recorded yet. Questions will appear after the student plays with the updated games.</div>';
            return;
        }

        // Get unique games for filter
        const games = [...new Set(questions.map(q => q.game_file))].sort();

        detail.innerHTML = `
            <div class="detail-toolbar">
                <select onchange="filterStudentQuestions('${studentId}')" id="game-sel-${studentId}">
                    <option value="all">All Games</option>
                    ${games.map(g => `<option value="${escHtml(g)}">${escHtml(g.replace('.html','').replace(/_/g,' '))}</option>`).join('')}
                </select>
                <button class="toggle-mistakes" id="mistakes-btn-${studentId}" onclick="event.stopPropagation(); toggleMistakes('${studentId}')">
                    ✗ Mistakes Only
                </button>
                <span style="color:#999;font-size:0.8rem;" id="q-count-${studentId}">${questions.length} questions</span>
            </div>
            <div id="q-table-${studentId}"></div>
        `;

        filterStudentQuestions(studentId);
    }

    function filterStudentQuestions(studentId) {
        const questions = studentQuestionCache[studentId] || [];
        const gameFilter = document.getElementById('game-sel-' + studentId)?.value || 'all';
        const mistakesBtn = document.getElementById('mistakes-btn-' + studentId);
        const mistakesOnly = mistakesBtn?.classList.contains('active') || false;

        let filtered = questions;
        if (gameFilter !== 'all') filtered = filtered.filter(q => q.game_file === gameFilter);
        if (mistakesOnly) filtered = filtered.filter(q => !q.is_correct);

        const countEl = document.getElementById('q-count-' + studentId);
        if (countEl) countEl.textContent = filtered.length + ' questions' + (mistakesOnly ? ' (mistakes)' : '');

        const container = document.getElementById('q-table-' + studentId);

        if (filtered.length === 0) {
            container.innerHTML = mistakesOnly
                ? '<div style="text-align:center;padding:20px;color:#2e7d32;font-weight:600;">🎉 No mistakes!</div>'
                : '<div style="text-align:center;padding:20px;color:#999;">No questions found.</div>';
            return;
        }

        // Show max 50 at a time
        const page = parseInt(container.dataset.page || '0');
        const pageSize = 50;
        const paged = filtered.slice(page * pageSize, (page + 1) * pageSize);
        const totalPages = Math.ceil(filtered.length / pageSize);

        let html = `<table class="question-table">
            <thead><tr>
                <th style="width:30px"></th>
                <th>Game</th>
                <th>Question</th>
                <th>Their Answer</th>
                <th>Correct Answer</th>
                <th>When</th>
            </tr></thead>
            <tbody>`;

        paged.forEach(q => {
            const rowClass = q.is_correct ? 'correct' : 'wrong';
            const icon = q.is_correct ? '✓' : '✗';
            const answerClass = q.is_correct ? 'answer-correct' : 'answer-wrong';
            const game = (q.game_file || '').replace('.html', '').replace(/_/g, ' ');
            const when = q.answered_at ? new Date(q.answered_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '-';

            html += `<tr class="${rowClass}">
                <td class="icon">${icon}</td>
                <td>${escHtml(game)}</td>
                <td>${escHtml(q.question_text || '?')}</td>
                <td class="${answerClass}">${escHtml(q.student_answer || '?')}</td>
                <td>${escHtml(q.correct_answer || '?')}</td>
                <td style="white-space:nowrap">${when}</td>
            </tr>`;
        });

        html += '</tbody></table>';

        if (totalPages > 1) {
            html += '<div class="pagination">';
            html += `<button ${page === 0 ? 'disabled' : ''} onclick="event.stopPropagation(); pageStudentQuestions('${studentId}', ${page - 1})">← Prev</button>`;
            html += `<span style="font-size:0.82rem;color:#888;">Page ${page + 1} of ${totalPages}</span>`;
            html += `<button ${page >= totalPages - 1 ? 'disabled' : ''} onclick="event.stopPropagation(); pageStudentQuestions('${studentId}', ${page + 1})">Next →</button>`;
            html += '</div>';
        }

        container.innerHTML = html;
        container.dataset.page = page;
    }

    function toggleMistakes(studentId) {
        const btn = document.getElementById('mistakes-btn-' + studentId);
        btn.classList.toggle('active');
        const container = document.getElementById('q-table-' + studentId);
        if (container) container.dataset.page = '0';
        filterStudentQuestions(studentId);
    }

    function pageStudentQuestions(studentId, page) {
        const container = document.getElementById('q-table-' + studentId);
        container.dataset.page = page;
        filterStudentQuestions(studentId);
    }

    // ============ BY GAME ============
    function renderGames() {
        const gameVal = document.getElementById('game-filter').value;
        const filteredIds = new Set(getFilteredStudentIds());

        // Group questions by game
        const byGame = {};
        allQuestions.forEach(q => {
            if (!filteredIds.has(q.student_id)) return;
            if (gameVal !== 'all' && q.game_file !== gameVal) return;
            if (!byGame[q.game_file]) byGame[q.game_file] = { total: 0, right: 0, wrong: 0, wrongAnswers: {} };
            const g = byGame[q.game_file];
            g.total++;
            if (q.is_correct) g.right++; else g.wrong++;
        });

        // For "most missed" we need the full question data — we'll show a placeholder
        // and fetch details on demand. For now, show counts.
        const tbody = document.getElementById('games-body');

        const entries = Object.entries(byGame);
        if (entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5"><div class="empty"><div class="empty-icon">📭</div>No question data yet</div></td></tr>';
            return;
        }

        // Also get play counts from game_results
        const filtered = getFilteredResults();
        const playCounts = {};
        filtered.forEach(r => {
            playCounts[r.game_file] = (playCounts[r.game_file] || 0) + 1;
        });

        tbody.innerHTML = entries
            .sort((a, b) => b[1].total - a[1].total)
            .map(([gf, gs]) => {
                const title = gf.replace('.html', '').replace(/_/g, ' ');
                const acc = gs.total > 0 ? Math.round((gs.right / gs.total) * 100) : 0;
                const accClass = acc >= 80 ? 'acc-high' : acc >= 50 ? 'acc-mid' : 'acc-low';
                const plays = playCounts[gf] || 0;

                return `<tr>
                    <td><strong>${escHtml(title)}</strong></td>
                    <td>${plays}</td>
                    <td>${gs.total.toLocaleString()} <span style="color:#999;font-size:0.78rem;">(${gs.right}✓ ${gs.wrong}✗)</span></td>
                    <td><span class="acc-badge ${accClass}">${acc}%</span></td>
                    <td><button style="padding:4px 10px;border-radius:6px;border:1px solid #ddd;background:white;cursor:pointer;font-size:0.78rem;font-family:inherit;" onclick="showMostMissed('${escHtml(gf)}')">View Mistakes</button></td>
                </tr>`;
            }).join('');
    }

    async function showMostMissed(gameFile) {
        // Fetch wrong answers for this game
        try {
            const wrong = await supaFetch('question_responses',
                `game_file=eq.${encodeURIComponent(gameFile)}&is_correct=eq.false&order=answered_at.desc&limit=200`);

            if (wrong.length === 0) {
                alert('No wrong answers recorded for this game yet!');
                return;
            }

            // Count which questions are most missed
            const counts = {};
            wrong.forEach(q => {
                const key = q.question_text || '?';
                if (!counts[key]) counts[key] = { question: key, count: 0, wrongAnswers: {} };
                counts[key].count++;
                const wa = q.student_answer || '?';
                counts[key].wrongAnswers[wa] = (counts[key].wrongAnswers[wa] || 0) + 1;
            });

            const sorted = Object.values(counts).sort((a, b) => b.count - a.count).slice(0, 15);
            const title = gameFile.replace('.html', '').replace(/_/g, ' ');

            // Show in a simple overlay
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

            let tableHTML = `<div style="background:white;border-radius:16px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;">
                <h3 style="margin-bottom:4px;">Most Missed — ${escHtml(title)}</h3>
                <p style="color:#999;font-size:0.82rem;margin-bottom:16px;">${wrong.length} wrong answers total</p>
                <table class="question-table">
                <thead><tr><th>Question</th><th>Times Missed</th><th>Common Wrong Answer</th></tr></thead>
                <tbody>`;

            sorted.forEach(item => {
                const topWrong = Object.entries(item.wrongAnswers).sort((a, b) => b[1] - a[1])[0];
                tableHTML += `<tr class="wrong">
                    <td>${escHtml(item.question)}</td>
                    <td style="font-weight:700;color:#c62828;">${item.count}</td>
                    <td>"${escHtml(topWrong[0])}" <span style="color:#999">(${topWrong[1]}x)</span></td>
                </tr>`;
            });

            tableHTML += '</tbody></table><button onclick="this.closest(\'div\').parentElement.remove()" style="margin-top:16px;padding:8px 20px;border-radius:8px;border:none;background:#667eea;color:white;cursor:pointer;font-family:inherit;font-size:0.9rem;">Close</button></div>';

            overlay.innerHTML = tableHTML;
            document.body.appendChild(overlay);
        } catch (err) {
            alert('Error loading mistake data: ' + err.message);
        }
    }

    // ============ TABS ============
    function switchTab(name, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }

    // ============ EXPORT ============
    function exportCSV() {
        const filtered = getFilteredResults();
        if (filtered.length === 0) { alert('No data to export.'); return; }

        const headers = ['Student', 'Class', 'Game', 'Questions', 'Right', 'Wrong', 'Accuracy %', 'Date'];
        const rows = filtered.map(r => {
            const title = r.game_title || r.game_file.replace('.html', '').replace(/_/g, ' ');
            const date = r.played_at ? new Date(r.played_at).toLocaleString() : '';
            return [r.first_name, r.class_code, title, r.questions_answered || '', r.right_count || '', r.wrong_count || '', r.accuracy !== null ? r.accuracy : '', date];
        });

        const csv = [headers, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `math-games-results-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ============ UTIL ============
    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }
    </script>
