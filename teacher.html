    // ============ EXPORT ============
    function exportCSV() {
        const filtered = getFilteredResults();
        if (filtered.length === 0) { alert('No data to export.'); return; }

        const headers = ['Student', 'Class', 'Game', 'Questions', 'Right', 'Wrong', 'Retries', 'Accuracy %', 'Date'];
        const rows = filtered.map(r => {
            const title = r.game_title || r.game_file.replace('.html', '').replace(/_/g, ' ');
            const date = r.played_at ? new Date(r.played_at).toLocaleString() : '';
            return [r.first_name, r.class_code, title, r.questions_answered || '', r.right_count || '', r.wrong_count || '', r.retry_count || 0, r.accuracy !== null ? r.accuracy : '', date];
        });

        const csv = [headers, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `math-games-results-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // ============ UTIL ============
    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // ============ SESSION DRILL-DOWN PANEL ============
    let panelShowAll = false;
    let panelActiveCategory = 'all';
    let panelCurrentResult = null;
    let panelQuestions = [];
    let panelCategories = [];

    function isTutorSession(result) {
        return (result.game_title || '').toLowerCase().includes('tutor');
    }

    // Collapse consecutive rows with the same question_text into one row
    // with an inferred attempt_number. This handles games that record each
    // click as a separate row (e.g. face-off where student retries until correct).
    function collapseAttempts(questions) {
        if (questions.length === 0) return questions;
        const collapsed = [];
        let i = 0;
        while (i < questions.length) {
            const qt = questions[i].question_text;
            // Find all consecutive rows with the same question_text
            let j = i + 1;
            while (j < questions.length && questions[j].question_text === qt) j++;
            const group = questions.slice(i, j);
            // If attempt_number is already set (> 1) from the game, keep the last row as-is
            if (group.some(q => (q.attempt_number || 1) > 1)) {
                // Already tracked by the game — just keep the final attempt (correct or last wrong)
                const final = group[group.length - 1];
                collapsed.push(final);
            } else if (group.length === 1) {
                collapsed.push(group[0]);
            } else {
                // Multiple rows, no explicit attempt tracking — infer attempts
                // Keep the last row (the final answer) and set attempt_number to group size
                const final = { ...group[group.length - 1] };
                final.attempt_number = group.length;
                // Collect all wrong answers from the group for display
                final._wrongAttempts = group.filter(q => !q.is_correct).map(q => q.student_answer);
                collapsed.push(final);
            }
            i = j;
        }
        return collapsed;
    }

    async function getSessionQuestions(result) {
        // Ensure question cache is populated for this student
        if (!studentQuestionCache[result.student_id]) {
            const questions = await supaFetch('question_responses',
                `student_id=eq.${result.student_id}&order=answered_at.desc&limit=500`);
            studentQuestionCache[result.student_id] = questions;
        }
        const cached = studentQuestionCache[result.student_id] || [];
        // Filter to same game
        let sameGame = cached.filter(q => q.game_file === result.game_file);

        // Separate tutor vs practice questions by [Tutor] prefix
        const tutor = isTutorSession(result);
        sameGame = sameGame.filter(q => {
            const isTutorQ = (q.question_text || '').startsWith('[Tutor]');
            return tutor ? isTutorQ : !isTutorQ;
        });

        // Direct session_id match (new sessions)
        if (isRealSessionId(result.session_id)) {
            const matched = sameGame.filter(q => q.session_id === result.session_id);
            matched.sort((a, b) => (a.answered_at || '').localeCompare(b.answered_at || ''));
            return matched;
        }

        // Legacy fallback: time-window scoping for old data without session_id
        if (!result.played_at || sameGame.length === 0) {
            return sameGame.slice(0, result.questions_answered || 20);
        }
        sameGame.sort((a, b) => (b.answered_at || '').localeCompare(a.answered_at || ''));
        const playedAt = new Date(result.played_at);
        const sessionSec = result.time_seconds || 0;
        const afterMin = tutor ? 30 : (sessionSec > 0 ? Math.ceil(sessionSec / 60) + 2 : 10);
        const cutoff = new Date(playedAt.getTime() + afterMin * 60 * 1000);
        const allSessions = (allResults || []).filter(r =>
            r.student_id === result.student_id &&
            r.game_file === result.game_file &&
            isTutorSession(r) === tutor &&
            r.played_at && r.played_at < result.played_at
        ).sort((a, b) => b.played_at.localeCompare(a.played_at));
        const prevPlayedAt = allSessions.length > 0 ? new Date(allSessions[0].played_at) : null;
        const earliest = prevPlayedAt || new Date(playedAt.getTime() - 10 * 60 * 1000);
        const inWindow = sameGame.filter(q => {
            if (!q.answered_at) return false;
            const t = new Date(q.answered_at);
            return t <= cutoff && t > earliest;
        });
        const count = result.questions_answered || inWindow.length;
        const matched = inWindow.slice(0, count);
        matched.reverse();
        return matched;
    }

    function parseCategory(questionText) {
        const text = (questionText || '').trim();
        const isTutor = text.startsWith('[Tutor] ');
        const cleaned = isTutor ? text.substring(8) : text;
        // Check for explicit prefix "Category: ..."
        const colonIdx = cleaned.indexOf(':');
        if (colonIdx > 0 && colonIdx < 20) {
            const prefix = cleaned.substring(0, colonIdx).trim();
            const known = ['Identifying', 'Number Lines', 'Comparing', 'Equivalent'];
            if (known.includes(prefix)) return prefix;
        }
        // Multiplication: "3 x 7 = ?" or "3 × 7"
        const multMatch = text.match(/(\d+)\s*[x×]\s*(\d+)/);
        if (multMatch) {
            const a = parseInt(multMatch[1]), b = parseInt(multMatch[2]);
            return (Math.min(a, b) <= 5) ? '2s – 5s' : '6s – 9s';
        }
        // Division
        if (/^\d+\s*[÷\/]\s*\d+/.test(text)) return 'Division';
        // Heuristic matching
        if (/\bvs\b|greater|less|comparison|NOT correct/i.test(text)) return 'Comparing';
        if (/what fraction.*shaded|fraction is shown/i.test(text)) return 'Identifying';
        if (/point P|number line|mile from/i.test(text)) return 'Number Lines';
        if (/equal to|equivalent/i.test(text)) return 'Equivalent';
        return 'General';
    }

    function stripCategoryPrefix(questionText) {
        const text = (questionText || '').trim();
        let cleaned = text.startsWith('[Tutor] ') ? text.substring(8) : text;
        const colonIdx = cleaned.indexOf(':');
        if (colonIdx > 0 && colonIdx < 20) {
            const prefix = cleaned.substring(0, colonIdx).trim();
            const known = ['Identifying', 'Number Lines', 'Comparing', 'Equivalent'];
            if (known.includes(prefix)) return cleaned.substring(colonIdx + 1).trim();
        }
        return text;
    }

    // Split question text into the readable question and the [bracketed context]
    function parseQuestionContext(text) {
        const bracketMatch = text.match(/^(.*?)\s*\[([^\]]+)\]\s*$/);
        if (bracketMatch) {
            return { question: bracketMatch[1].trim() || text, context: bracketMatch[2].trim() };
        }
        return { question: text, context: null };
    }

    // Render an SVG visual from the bracket context string
    function renderContextVisual(context) {
        if (!context) return '';
        var m;

        // "bar: 3 of 4 parts shaded"
        m = context.match(/^bar:\s*(\d+)\s*of\s*(\d+)\s*parts?\s*shaded$/i);
        if (m) return drawFractionBar(parseInt(m[1]), parseInt(m[2]));

        // "2 whole(s), 3 parts each, 5 shaded"
        m = context.match(/^(\d+)\s*whole\(s\),\s*(\d+)\s*parts?\s*each,\s*(\d+)\s*shaded$/i);
        if (m) return drawMultiBar(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));

        // "N strip(s), D parts each, S of T shaded"
        m = context.match(/^(\d+)\s*strip\(s\),\s*(\d+)\s*parts?\s*each,\s*(\d+)\s*of\s*(\d+)\s*shaded$/i);
        if (m) return drawMultiBar(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));

        // "N parts, shade M"
        m = context.match(/^(\d+)\s*parts?,\s*shade\s*(\d+)$/i);
        if (m) return drawFractionBar(parseInt(m[2]), parseInt(m[1]));

        // "line divided into Nths, point at A/B"
        m = context.match(/^line divided into (\d+)ths?,\s*point at (\d+)\/(\d+)$/i);
        if (m) return drawNumberLine(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), 0, 1);

        // "line divided into Nths, answer: A/B"
        m = context.match(/^line divided into (\d+)ths?,\s*answer:\s*(\d+)\/(\d+)$/i);
        if (m) return drawNumberLine(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), 0, 1);

        // "line divided into Nths from PLACE, answer at A/B"
        m = context.match(/^line divided into (\d+)ths?\s*from\s*.+,\s*answer at (\d+)\/(\d+)$/i);
        if (m) return drawNumberLine(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), 0, 1);

        // "line divided into Nths from PLACE" (no answer)
        m = context.match(/^line divided into (\d+)ths?\s*from\s*.+$/i);
        if (m) return drawNumberLine(parseInt(m[1]), 0, 0, 0, 1);

        // "line divided into Nths, A=1/6, B=3/6, ..., answer: C"
        m = context.match(/^line divided into (\d+)ths?,\s*(.+),\s*answer:\s*([A-D])$/i);
        if (m) {
            // Parse point assignments to find the answer point
            var divs = parseInt(m[1]);
            var pointsStr = m[2];
            var ansLabel = m[3];
            var pointMatch = pointsStr.match(new RegExp(ansLabel + '=(\\d+)/(\\d+)'));
            if (pointMatch) return drawNumberLine(divs, parseInt(pointMatch[1]), parseInt(pointMatch[2]), 0, 1);
            return drawNumberLine(divs, 0, 0, 0, 1);
        }

        // "line divided into Nths" (generic)
        m = context.match(/^line divided into (\d+)ths?$/i);
        if (m) return drawNumberLine(parseInt(m[1]), 0, 0, 0, 1);

        // "answer line: N/D divided into Dths"
        m = context.match(/^answer line:\s*(\d+)\/(\d+)\s*divided into (\d+)ths?$/i);
        if (m) return drawNumberLine(parseInt(m[3]), parseInt(m[1]), parseInt(m[2]), 0, 1);

        // "line 0-E, answer: A/B"
        m = context.match(/^line 0-(\d+),\s*answer:\s*(\d+)\/(\d+)$/i);
        if (m) {
            var endpoint = parseInt(m[1]);
            var num = parseInt(m[2]), den = parseInt(m[3]);
            return drawNumberLine(den, num, den, 0, endpoint);
        }

        // "reference strip: A/B"
        m = context.match(/^reference strip:\s*(\d+)\/(\d+)$/i);
        if (m) return drawFractionBar(parseInt(m[1]), parseInt(m[2]));

        // "point at A/B on number line"
        m = context.match(/^point at (\d+)\/(\d+) on number line$/i);
        if (m) return drawNumberLine(parseInt(m[2]), parseInt(m[1]), parseInt(m[2]), 0, 1);

        // "compare: N/D vs N/D" — draw two comparison bars
        m = context.match(/^compare:\s*(\d+)\/(\d+)\s*vs\s*(\d+)\/(\d+)$/i);
        if (m) return drawComparisonBars(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4]));

        // comparison statements "A/B < C/D, ..."
        if (/^\d+\/\d+\s*[<>=]/.test(context)) {
            return renderComparisonStatements(context);
        }

        // "choices: A; B; C; D" or "choices: A, B, C, D"
        m = context.match(/^choices:\s*(.+)$/i);
        if (m) return renderChoiceChips(m[1]);

        // "equivalent to: N/D, answer: A/B"
        m = context.match(/^equivalent to:\s*(\d+)\/(\d+),\s*answer:\s*(.+)$/i);
        if (m) return renderEquivalentContext(parseInt(m[1]), parseInt(m[2]), m[3].trim());

        // "whole number: N, answer: A/B"
        m = context.match(/^whole number:\s*(\d+),\s*answer:\s*(.+)$/i);
        if (m) return renderWholeNumberContext(parseInt(m[1]), m[2].trim());

        // "answer: N/D" — simple answer badge
        m = context.match(/^answer:\s*(.+)$/i);
        if (m) return renderAnswerBadge(m[1].trim());

        // "measurement: answer is N"
        m = context.match(/^measurement:\s*answer is\s*(.+)$/i);
        if (m) return renderAnswerBadge(m[1].trim());

        // "4 number lines shown, answer: X" (legacy)
        m = context.match(/number lines? shown,\s*answer:\s*(.+)/i);
        if (m) return renderAnswerBadge(m[1].trim());

        // "4 number lines shown" (legacy, no answer)
        if (/number lines? shown/i.test(context)) {
            return '<div style="margin:8px 0;padding:6px 10px;background:#f8f4e8;border-radius:6px;font-size:0.82rem;color:#666;border-left:3px solid #e6a817;">Multiple number lines were shown as choices</div>';
        }

        // "visual bars shown"
        if (/visual bars? shown/i.test(context)) {
            return '<div style="margin:8px 0;padding:6px 10px;background:#f0f0ff;border-radius:6px;font-size:0.82rem;color:#666;border-left:3px solid #667eea;">Visual fraction bars were shown for comparison</div>';
        }

        // Fallback: just return text
        return '';
    }

    function drawFractionBar(shaded, total) {
        var w = 280, h = 40, pad = 2;
        var partW = (w - pad * 2) / total;
        var svg = '<svg width="' + w + '" height="' + h + '" style="display:block;margin:8px 0">';
        svg += '<rect x="0" y="0" width="' + w + '" height="' + h + '" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>';
        for (var i = 0; i < total; i++) {
            var x = pad + i * partW;
            var fill = i < shaded ? '#667eea' : '#fff';
            var stroke = i < shaded ? '#5568d0' : '#ccc';
            svg += '<rect x="' + x + '" y="' + pad + '" width="' + (partW - 1) + '" height="' + (h - pad * 2) + '" rx="2" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
        }
        svg += '<text x="' + (w / 2) + '" y="' + (h / 2 + 5) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#333">' + shaded + '/' + total + '</text>';
        svg += '</svg>';
        return svg;
    }

    function drawMultiBar(numWholes, partsEach, totalShaded) {
        var barW = 120, barH = 36, gap = 8, pad = 2;
        var totalW = numWholes * (barW + gap) - gap;
        var svg = '<svg width="' + totalW + '" height="' + (barH + 20) + '" style="display:block;margin:8px 0">';
        var remaining = totalShaded;
        for (var w = 0; w < numWholes; w++) {
            var bx = w * (barW + gap);
            svg += '<rect x="' + bx + '" y="0" width="' + barW + '" height="' + barH + '" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>';
            var partW = (barW - pad * 2) / partsEach;
            for (var p = 0; p < partsEach; p++) {
                var px = bx + pad + p * partW;
                var filled = remaining > 0;
                if (filled) remaining--;
                var fill = filled ? '#667eea' : '#fff';
                var stroke = filled ? '#5568d0' : '#ccc';
                svg += '<rect x="' + px + '" y="' + pad + '" width="' + (partW - 1) + '" height="' + (barH - pad * 2) + '" rx="2" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
            }
        }
        svg += '<text x="' + (totalW / 2) + '" y="' + (barH + 14) + '" text-anchor="middle" font-size="12" fill="#888">' + totalShaded + '/' + partsEach + (numWholes > 1 ? ' (' + numWholes + ' wholes)' : '') + '</text>';
        svg += '</svg>';
        return svg;
    }

    function drawNumberLine(divisions, pointNum, pointDen, startVal, endVal) {
        var w = 300, h = 50, mx = 30, lineY = 20;
        var lineW = w - mx * 2;
        var svg = '<svg width="' + w + '" height="' + h + '" style="display:block;margin:8px 0">';
        // Main line
        svg += '<line x1="' + mx + '" y1="' + lineY + '" x2="' + (w - mx) + '" y2="' + lineY + '" stroke="#333" stroke-width="2"/>';
        // Endpoints
        svg += '<line x1="' + mx + '" y1="' + (lineY - 8) + '" x2="' + mx + '" y2="' + (lineY + 8) + '" stroke="#333" stroke-width="2"/>';
        svg += '<line x1="' + (w - mx) + '" y1="' + (lineY - 8) + '" x2="' + (w - mx) + '" y2="' + (lineY + 8) + '" stroke="#333" stroke-width="2"/>';
        svg += '<text x="' + mx + '" y="' + (lineY + 22) + '" text-anchor="middle" font-size="11" fill="#666">' + startVal + '</text>';
        svg += '<text x="' + (w - mx) + '" y="' + (lineY + 22) + '" text-anchor="middle" font-size="11" fill="#666">' + endVal + '</text>';
        // Tick marks
        var totalTicks = divisions * (endVal - startVal);
        for (var i = 1; i < totalTicks; i++) {
            var tx = mx + (i / totalTicks) * lineW;
            var isWhole = (i % divisions === 0);
            var tickH = isWhole ? 7 : 4;
            svg += '<line x1="' + tx + '" y1="' + (lineY - tickH) + '" x2="' + tx + '" y2="' + (lineY + tickH) + '" stroke="#999" stroke-width="1"/>';
        }
        // Point marker
        if (pointNum > 0 && pointDen > 0) {
            var frac = pointNum / pointDen;
            var range = endVal - startVal;
            var px = mx + (frac / range) * lineW;
            svg += '<circle cx="' + px + '" cy="' + lineY + '" r="6" fill="#C0392B" stroke="#fff" stroke-width="2"/>';
            svg += '<text x="' + px + '" y="' + (lineY - 12) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#C0392B">' + pointNum + '/' + pointDen + '</text>';
        }
        svg += '</svg>';
        return svg;
    }

    function renderComparisonStatements(context) {
        var parts = context.split(',').map(function(s) { return s.trim(); });
        var html = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">';
        parts.forEach(function(stmt, i) {
            var label = String.fromCharCode(65 + i);
            html += '<span style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:4px 10px;font-size:0.82rem;font-weight:600;color:#333;">'
                + '<span style="color:#888;font-weight:400;margin-right:4px;">' + label + '.</span>'
                + escHtml(stmt) + '</span>';
        });
        html += '</div>';
        return html;
    }

    function drawComparisonBars(n1, d1, n2, d2) {
        var barW = 200, barH = 30, pad = 2, gap = 6;
        var totalH = barH * 2 + gap + 30;
        var svg = '<svg width="' + (barW + 60) + '" height="' + totalH + '" style="display:block;margin:8px 0">';
        // First fraction bar
        var partW1 = (barW - pad * 2) / d1;
        svg += '<rect x="0" y="0" width="' + barW + '" height="' + barH + '" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>';
        for (var i = 0; i < d1; i++) {
            var fill = i < n1 ? '#667eea' : '#fff';
            var stroke = i < n1 ? '#5568d0' : '#ccc';
            svg += '<rect x="' + (pad + i * partW1) + '" y="' + pad + '" width="' + (partW1 - 1) + '" height="' + (barH - pad * 2) + '" rx="2" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
        }
        svg += '<text x="' + (barW + 8) + '" y="' + (barH / 2 + 5) + '" font-size="13" font-weight="700" fill="#333">' + n1 + '/' + d1 + '</text>';
        // Second fraction bar
        var y2 = barH + gap;
        var partW2 = (barW - pad * 2) / d2;
        svg += '<rect x="0" y="' + y2 + '" width="' + barW + '" height="' + barH + '" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>';
        for (var j = 0; j < d2; j++) {
            var fill2 = j < n2 ? '#e67e22' : '#fff';
            var stroke2 = j < n2 ? '#d35400' : '#ccc';
            svg += '<rect x="' + (pad + j * partW2) + '" y="' + (y2 + pad) + '" width="' + (partW2 - 1) + '" height="' + (barH - pad * 2) + '" rx="2" fill="' + fill2 + '" stroke="' + stroke2 + '" stroke-width="1"/>';
        }
        svg += '<text x="' + (barW + 8) + '" y="' + (y2 + barH / 2 + 5) + '" font-size="13" font-weight="700" fill="#333">' + n2 + '/' + d2 + '</text>';
        svg += '</svg>';
        return svg;
    }

    function renderChoiceChips(choicesStr) {
        // Split by semicolons first, then by commas if no semicolons
        var parts = choicesStr.indexOf(';') >= 0 ? choicesStr.split(';') : choicesStr.split(',');
        parts = parts.map(function(s) { return s.trim(); }).filter(function(s) { return s; });
        var html = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">';
        parts.forEach(function(choice, i) {
            var label = String.fromCharCode(65 + i);
            html += '<span style="background:#fff;border:1px solid #ddd;border-radius:6px;padding:5px 12px;font-size:0.82rem;font-weight:600;color:#333;">'
                + '<span style="color:#888;font-weight:400;margin-right:4px;">' + label + '.</span>'
                + escHtml(choice) + '</span>';
        });
        html += '</div>';
        return html;
    }

    function renderEquivalentContext(numer, denom, answer) {
        var html = '<div style="display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap">';
        html += drawFractionBar(numer, denom);
        html += '<div style="font-size:1.1rem;font-weight:700;color:#333;">' + numer + '/' + denom + ' = <span style="color:#27ae60">' + escHtml(answer) + '</span></div>';
        html += '</div>';
        return html;
    }

    function renderWholeNumberContext(wholeNum, answer) {
        var html = '<div style="display:flex;align-items:center;gap:12px;margin:8px 0">';
        html += '<div style="font-size:1.5rem;font-weight:700;color:#333;background:#f8f4e8;border-radius:8px;padding:8px 16px;border:2px solid #e6a817;">' + wholeNum + '</div>';
        html += '<div style="font-size:1.1rem;color:#666;"> = </div>';
        html += '<div style="font-size:1.1rem;font-weight:700;color:#27ae60;">' + escHtml(answer) + '</div>';
        html += '</div>';
        return html;
    }

    function renderAnswerBadge(answer) {
        return '<div style="margin:8px 0;display:inline-block;padding:6px 14px;background:#e8f5e9;border-radius:6px;font-size:0.9rem;font-weight:600;color:#2e7d32;border:1px solid #c8e6c9;">Correct answer: ' + escHtml(answer) + '</div>';
    }

    function toggleQuestionDetail(rowId) {
        var detail = document.getElementById(rowId + '-detail');
        if (!detail) { console.warn('No detail element for', rowId); return; }
        // Close any other open details first
        document.querySelectorAll('.q-detail.open').forEach(function(el) {
            if (el.id !== rowId + '-detail') el.classList.remove('open');
        });
        detail.classList.toggle('open');
    }

    function buildCategoryStats(questions) {
        const cats = {};
        questions.forEach(q => {
            const name = parseCategory(q.question_text);
            if (!cats[name]) cats[name] = { name, right: 0, wrong: 0, total: 0, questions: [] };
            cats[name].total++;
            if (q.is_correct) cats[name].right++;
            else cats[name].wrong++;
            cats[name].questions.push(q);
        });
        return Object.values(cats).sort((a, b) => {
            const accA = a.total > 0 ? a.right / a.total : 0;
            const accB = b.total > 0 ? b.right / b.total : 0;
            return accA - accB;
        });
    }

    function generateInsight(categories, questions) {
        if (questions.length === 0) return 'No question data available for this session.';
        if (questions.length < 3) return 'Very short session \u2014 only ' + questions.length + ' question' + (questions.length > 1 ? 's' : '') + ' attempted. Not enough data to identify patterns.';

        const wrongQs = questions.filter(q => !q.is_correct);
        if (wrongQs.length === 0) return 'Perfect session \u2014 got all ' + questions.length + ' questions correct. \ud83c\udf89';

        const meaningful = categories.filter(c => c.total >= 2);
        if (meaningful.length === 0) {
            const overall = Math.round((questions.filter(q => q.is_correct).length / questions.length) * 100);
            return wrongQs.length + ' mistake' + (wrongQs.length > 1 ? 's' : '') + ' out of ' + questions.length + ' questions (' + overall + '% accuracy).';
        }

        const weakest = meaningful[0];
        const strongest = meaningful[meaningful.length - 1];
        const weakAcc = Math.round((weakest.right / weakest.total) * 100);
        const strongAcc = Math.round((strongest.right / strongest.total) * 100);
        const weakWrong = weakest.questions.filter(q => !q.is_correct);

        let parts = ['Struggled most with <strong>' + escHtml(weakest.name) + '</strong> (' + weakAcc + '%)'];
        let patternFound = false;

        // Check for flipped fractions
        let flipped = 0;
        weakWrong.forEach(q => {
            const sa = (q.student_answer || '').trim();
            const ca = (q.correct_answer || '').trim();
            const sm = sa.match(/^(\d+)\/(\d+)$/);
            const cm = ca.match(/^(\d+)\/(\d+)$/);
            if (sm && cm && sm[1] === cm[2] && sm[2] === cm[1]) flipped++;
        });
        if (flipped >= 2) {
            parts.push(' \u2014 confused numerator and denominator on ' + flipped + ' of ' + weakWrong.length + ' mistakes');
            patternFound = true;
        }

        // Check for addition instead of multiplication
        if (!patternFound) {
            let added = 0;
            weakWrong.forEach(q => {
                const m = (q.question_text || '').match(/(\d+)\s*[x×]\s*(\d+)/);
                if (m && parseInt(q.student_answer) === parseInt(m[1]) + parseInt(m[2])) added++;
            });
            if (added >= 2) {
                parts.push(' \u2014 added instead of multiplied on ' + added + ' problems');
                patternFound = true;
            }
        }

        // Check for guessing
        if (!patternFound && weakAcc < 30 && weakWrong.length >= 3) {
            const unique = new Set(weakWrong.map(q => q.student_answer));
            if (unique.size >= weakWrong.length * 0.8) {
                parts.push(' \u2014 answers suggest guessing rather than applying a strategy');
            }
        }

        // Check for multi-attempt questions (retries before getting correct)
        const multiAttemptQs = questions.filter(q => (q.attempt_number || 1) > 1);
        if (multiAttemptQs.length > 0) {
            const maxAtt = Math.max(...multiAttemptQs.map(q => q.attempt_number || 2));
            parts.push('. Needed multiple tries on ' + multiAttemptQs.length + ' of ' + questions.length + ' question' + (questions.length > 1 ? 's' : ''));
            if (maxAtt >= 4) parts.push(' (up to ' + maxAtt + ' attempts)');
        }

        if (strongest !== weakest) {
            parts.push('. Strongest on <strong>' + escHtml(strongest.name) + '</strong> (' + strongAcc + '%)');
        }

        return parts.join('') + '.';
    }

    async function openSessionPanel(resultId) {
        const result = allResults.find(r => r.id === resultId);
        if (!result) return;

        panelCurrentResult = result;
        panelShowAll = false;
        panelActiveCategory = 'all';

        // Highlight row
        document.querySelectorAll('#results-body tr').forEach(r => r.classList.remove('selected'));
        const clickedRow = document.querySelector('#results-body tr[data-result-id="' + resultId + '"]');
        if (clickedRow) clickedRow.classList.add('selected');

        // Header
        const tutor = isTutorSession(result);
        const gameBase = result.game_file.replace('.html', '').replace(/_/g, ' ');
        const displayTitle = tutor ? gameBase : (result.game_title || gameBase);
        const modeBadge = tutor
            ? '<span class="mode-badge mode-badge-tutor">Tutor</span>'
            : (result.game_file === 'fractions_review.html' ? '<span class="mode-badge mode-badge-practice">Practice</span>' : '');
        document.getElementById('panel-title').innerHTML = escHtml((result.first_name || '?') + ' \u2014 ' + displayTitle) + modeBadge;
        const date = result.played_at ? new Date(result.played_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
        document.getElementById('panel-meta').textContent = date + '  \u00b7  ' + (result.questions_answered || 0) + ' questions';

        // Show panel with loading
        const body = document.getElementById('panel-body');
        body.innerHTML = '<div class="loading" style="padding:40px"><span class="loading-spinner"></span> Loading question details\u2026</div>';
        document.getElementById('panel-overlay').classList.add('open');
        document.getElementById('session-panel').classList.add('open');
        document.body.style.overflow = 'hidden';

        try {
            const rawQuestions = await getSessionQuestions(result);
            panelQuestions = collapseAttempts(rawQuestions);
        } catch (err) {
            body.innerHTML = '<div style="color:#c62828;padding:24px">Failed to load question data.</div>';
            return;
        }

        // Update meta with actual question count (may differ from game_results.questions_answered)
        const actualCount = panelQuestions.length;
        document.getElementById('panel-meta').textContent = date + '  ·  ' + actualCount + ' question' + (actualCount !== 1 ? 's' : '');

        if (panelQuestions.length === 0) {
            body.innerHTML = '<div class="panel-empty"><div class="panel-empty-icon">\ud83d\udced</div>No detailed question data for this session.<br><span style="font-size:0.82rem;color:#A3A3A3">Question tracking may not have been active when this game was played.</span></div>';
            return;
        }

        panelCategories = buildCategoryStats(panelQuestions);
        renderPanelContent();
    }

    function renderPanelContent() {
        const body = document.getElementById('panel-body');
        let html = '';

        // Insight
        html += '<div class="insight-box">' + generateInsight(panelCategories, panelQuestions) + '</div>';

        // Category grid
        html += '<div class="category-grid">';
        panelCategories.forEach(cat => {
            const pct = cat.total > 0 ? Math.round((cat.right / cat.total) * 100) : 0;
            const sc = pct >= 67 ? 'score-good' : pct >= 40 ? 'score-mid' : 'score-bad';
            const fc = pct >= 67 ? 'fill-good' : pct >= 40 ? 'fill-mid' : 'fill-bad';
            const check = pct >= 67 ? '<span class="check-mark">\u2713</span>' : '';
            const active = panelActiveCategory === cat.name ? ' active' : '';
            const safeName = escHtml(cat.name).replace(/'/g, "\\'");

            html += '<div class="cat-card' + active + '" onclick="filterPanelCategory(\'' + safeName + '\')">'
                + check
                + '<div class="cat-card-label">' + escHtml(cat.name) + '</div>'
                + '<div class="cat-card-score ' + sc + '">' + cat.right + '/' + cat.total + '</div>'
                + '<div class="cat-card-bar"><div class="cat-card-bar-fill ' + fc + '" style="width:0%" data-width="' + pct + '%"></div></div>'
                + '</div>';
        });
        html += '</div>';

        // Questions
        html += renderPanelQuestions();
        body.innerHTML = html;

        // Animate bars
        requestAnimationFrame(() => {
            document.querySelectorAll('.cat-card-bar-fill').forEach(bar => {
                bar.style.width = bar.dataset.width;
            });
        });
    }

    function renderPanelQuestions() {
        const label = panelShowAll ? 'Show mistakes only' : 'Show all questions';
        let html = '<div class="mistakes-section">'
            + '<div class="mistakes-header">'
            + '<div class="mistakes-title">' + (panelShowAll ? 'All Questions' : 'Mistakes') + '</div>'
            + '<button class="mistakes-toggle" onclick="togglePanelShowAll()">' + label + '</button>'
            + '</div>';

        const catsToShow = panelActiveCategory === 'all'
            ? panelCategories
            : panelCategories.filter(c => c.name === panelActiveCategory);

        let hasContent = false;

        catsToShow.forEach(cat => {
            const filtered = panelShowAll ? cat.questions : cat.questions.filter(q => !q.is_correct);
            if (filtered.length === 0) return;
            hasContent = true;

            html += '<div class="mistake-group-label">' + escHtml(cat.name) + '</div>';

            filtered.forEach((q, idx) => {
                const displayText = stripCategoryPrefix(q.question_text);
                const parsed = parseQuestionContext(displayText);
                const att = q.attempt_number || 1;
                const attemptBadge = att > 1
                    ? '<span class="q-attempt ' + (att >= 3 ? 'q-attempt-3' : 'q-attempt-2') + '">'
                      + att + (att === 2 ? ' tries' : ' tries') + '</span>'
                    : '';
                const rowId = 'qrow-' + cat.name.replace(/[^a-zA-Z0-9]/g,'') + '-' + idx;
                const hasDetail = !!parsed.context;

                if (q.is_correct) {
                    html += '<div class="q-row correct-row' + (hasDetail ? ' has-detail' : '') + '" id="' + rowId + '"' + (hasDetail ? ' onclick="toggleQuestionDetail(\'' + rowId + '\')"' : '') + '>'
                        + '<span class="q-icon-right">\u2713</span>'
                        + '<span class="q-text">' + escHtml(parsed.question) + '</span>'
                        + '<span class="q-answer-right">' + escHtml(q.student_answer || '?') + attemptBadge + '</span>'
                        + '<span></span></div>';
                } else {
                    html += '<div class="q-row' + (hasDetail ? ' has-detail' : '') + '" id="' + rowId + '"' + (hasDetail ? ' onclick="toggleQuestionDetail(\'' + rowId + '\')"' : '') + '>'
                        + '<span class="q-icon-wrong">\u2717</span>'
                        + '<span class="q-text">' + escHtml(parsed.question) + '</span>'
                        + '<span class="q-answer-wrong">' + escHtml(q.student_answer || '?') + attemptBadge + '</span>'
                        + '<span class="q-answer-correct-inline">' + escHtml(q.correct_answer || '?') + '</span></div>';
                }

                // Expandable detail below the row
                if (hasDetail) {
                    var visual = renderContextVisual(parsed.context);
                    html += '<div class="q-detail" id="' + rowId + '-detail">';
                    if (visual) {
                        html += '<div class="q-detail-context">' + visual + '</div>';
                    } else {
                        html += '<div class="q-detail-context">' + escHtml(parsed.context) + '</div>';
                    }
                    html += '</div>';
                }
            });
        });

        if (!hasContent) {
            html += '<div style="text-align:center;padding:24px;color:#3A7D44;font-weight:600">\ud83c\udf89 No mistakes' + (panelActiveCategory !== 'all' ? ' in this category' : '') + '!</div>';
        }

        html += '</div>';
        return html;
    }

    function filterPanelCategory(catName) {
        panelActiveCategory = panelActiveCategory === catName ? 'all' : catName;
        renderPanelContent();
    }

    function togglePanelShowAll() {
        panelShowAll = !panelShowAll;
        renderPanelContent();
    }

    function closeSessionPanel() {
        document.getElementById('panel-overlay').classList.remove('open');
        document.getElementById('session-panel').classList.remove('open');
        document.querySelectorAll('#results-body tr').forEach(r => r.classList.remove('selected'));
        document.body.style.overflow = '';
        panelCurrentResult = null;
    }

    // Panel event listeners
    document.getElementById('panel-overlay').addEventListener('click', closeSessionPanel);
    document.getElementById('panel-close-btn').addEventListener('click', closeSessionPanel);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && panelCurrentResult) closeSessionPanel();
    });

    </script>
</body>
