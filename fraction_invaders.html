<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ FRACTION INVADERS ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --neon-pink: #ff00ff; --neon-cyan: #00ffff; --neon-green: #39ff14;
            --neon-yellow: #ffff00; --neon-orange: #ff6600; --neon-purple: #bf00ff;
            --dark-bg: #0a0a0a; --darker-bg: #050508; --amber: #E8A838;
            --grid-color: rgba(0, 255, 255, 0.08);
        }
        html, body { width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
        body { background: var(--darker-bg); font-family: 'Press Start 2P', monospace; image-rendering: pixelated; }

        /* CRT */
        #crt-overlay { position: fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:1000;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 2px); }
        #crt-overlay::before { content:''; position:absolute; top:0;left:0;right:0;bottom:0;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 70%, rgba(0,0,0,0.15) 100%); }

        #game-container { position:fixed; top:0;left:0; width:100%;height:100%;
            background: linear-gradient(180deg, #02001a 0%, #0a0025 25%, #080818 55%, #0a0a0a 100%); overflow:hidden; }

        /* Stars */
        #stars { position:absolute; top:0;left:0;right:0;bottom:0; overflow:hidden; }
        .star { position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation: starDrift linear infinite; }
        @keyframes starDrift { 0%{transform:translateY(0);opacity:.8}100%{transform:translateY(100vh);opacity:.3} }
        .star.fast { width:3px; height:3px; background:var(--neon-cyan); }

        /* Grid floor */
        #grid-floor { position:absolute; top:0;left:0;right:0;bottom:0;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size:40px 40px; transform:perspective(500px) rotateX(60deg); transform-origin:center top;
            animation: gridScroll 3s linear infinite; }
        @keyframes gridScroll { 0%{background-position:0 0}100%{background-position:0 40px} }

        /* TOP BAR — compact stats only */
        #top-bar { position:fixed; top:0;left:0;right:0; height:50px;
            background: linear-gradient(180deg, rgba(5,2,20,0.98) 0%, rgba(10,5,25,0.95) 100%);
            border-bottom: 3px solid var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink), 0 0 30px rgba(255,0,255,0.2);
            display:flex; align-items:center; justify-content:space-between; padding:0 15px; z-index:100; }
        .stats-panel { display:flex; gap:18px; align-items:center; }
        .stat-box { text-align:center; }
        .stat-label { font-size:6px; color:var(--neon-cyan); text-shadow:0 0 6px var(--neon-cyan); margin-bottom:2px; letter-spacing:1px; }
        .stat-value { font-size:16px; color:var(--neon-yellow); text-shadow:0 0 10px var(--neon-yellow),0 0 20px var(--neon-yellow),0 0 30px var(--neon-orange); animation:neonFlicker 3s ease-in-out infinite; }
        @keyframes neonFlicker { 0%,100%{opacity:1}93%{opacity:.8}94%{opacity:1}96%{opacity:.9}97%{opacity:1} }
        #health-bar { width:90px; height:14px; background:#1a1a2e; border:2px solid var(--neon-cyan); box-shadow:0 0 8px var(--neon-cyan),inset 0 0 8px rgba(0,0,0,0.8); position:relative; overflow:hidden; }
        #health-fill { height:100%; background:linear-gradient(90deg,var(--neon-green),#00ff88); box-shadow:0 0 15px var(--neon-green); transition:width 0.3s ease; width:100%; }
        #health-fill::after { content:''; position:absolute; top:0;left:0;right:0; height:50%; background:linear-gradient(180deg,rgba(255,255,255,0.3),transparent); }
        #health-fill.hurt { background:linear-gradient(90deg,var(--neon-orange),#ffaa00); box-shadow:0 0 20px var(--neon-orange); }
        #health-fill.danger { background:linear-gradient(90deg,var(--amber),#cc6600); box-shadow:0 0 20px var(--amber); animation:dangerPulse .5s ease-in-out infinite; }
        @keyframes dangerPulse { 0%,100%{opacity:1}50%{opacity:.6} }
        
        /* MISSION BOX — big and readable */
        #mission-box { position:fixed; top:58px; left:50%; transform:translateX(-50%); z-index:90;
            background: linear-gradient(180deg, rgba(10,0,30,0.96) 0%, rgba(5,5,20,0.94) 100%);
            border: 4px solid var(--neon-cyan); box-shadow: 0 0 25px rgba(0,255,255,0.5), inset 0 0 20px rgba(0,255,255,0.12);
            padding: 16px 35px 18px; text-align:center; min-width:480px; max-width:94vw; }
        #mission-label { display:none; }
        @keyframes pulse { 0%,100%{opacity:.8}50%{opacity:1} }
        #mission-text { font-size:24px; color:var(--neon-green); text-shadow:0 0 12px var(--neon-green),0 0 22px rgba(57,255,20,0.5); margin-bottom:10px; line-height:1.4; }
        #hud-visual { display:flex; justify-content:center; align-items:center; gap:12px; min-height:50px; }
        .hud-bar { display:flex; height:38px; border:3px solid var(--neon-cyan); box-shadow:0 0 12px rgba(0,255,255,0.4); }
        .hud-bar-cell { width:38px; border-right:1px solid rgba(0,255,255,0.3); }
        .hud-bar-cell:last-child { border-right:none; }
        .hud-bar-cell.shaded { background:rgba(0,255,255,0.45); }
        .hud-bar-cell.shaded-pink { background:rgba(255,0,255,0.45); }
        .hud-label { font-size:14px; color:var(--neon-yellow); text-shadow:0 0 10px var(--neon-yellow); }
        .hud-nl-svg { height:50px; }

        /* PIXEL SHIP */
        #hero { position:fixed; bottom:10%; left:50%; transform:translateX(-50%); width:80px; height:80px; z-index:30; filter:drop-shadow(0 0 15px var(--neon-cyan)); }
        .pixel-ship { width:4px; height:4px; background:transparent; transform:scale(2.5); transform-origin:top left;
            box-shadow: 14px 0 var(--neon-cyan), 12px 4px var(--neon-cyan), 14px 4px #fff, 16px 4px var(--neon-cyan),
                10px 8px var(--neon-cyan), 12px 8px #4488ff, 14px 8px #4488ff, 16px 8px #4488ff, 18px 8px var(--neon-cyan),
                8px 12px var(--neon-cyan), 10px 12px #4488ff, 12px 12px #6699ff, 14px 12px #fff, 16px 12px #6699ff, 18px 12px #4488ff, 20px 12px var(--neon-cyan),
                6px 16px #334488, 8px 16px #4488ff, 10px 16px #4488ff, 12px 16px #6699ff, 14px 16px #4488ff, 16px 16px #6699ff, 18px 16px #4488ff, 20px 16px #4488ff, 22px 16px #334488,
                2px 20px var(--neon-pink), 4px 20px #334488, 6px 20px #4488ff, 8px 20px #4488ff, 10px 20px #4488ff, 12px 20px #334488, 14px 20px #334488, 16px 20px #334488, 18px 20px #4488ff, 20px 20px #4488ff, 22px 20px #4488ff, 24px 20px #334488, 26px 20px var(--neon-pink),
                0px 24px var(--neon-pink), 2px 24px var(--neon-pink), 4px 24px #334488, 6px 24px #334488, 8px 24px #334488, 20px 24px #334488, 22px 24px #334488, 24px 24px #334488, 26px 24px var(--neon-pink), 28px 24px var(--neon-pink),
                8px 28px var(--neon-orange), 10px 28px var(--neon-yellow), 12px 28px var(--neon-orange), 18px 28px var(--neon-orange), 20px 28px var(--neon-yellow), 22px 28px var(--neon-orange); }
        .pixel-ship-firing { width:4px; height:4px; background:transparent; transform:scale(2.5); transform-origin:top left; display:none;
            box-shadow: 14px 0 #fff, 12px 4px #fff, 14px 4px #fff, 16px 4px #fff,
                10px 8px var(--neon-cyan), 12px 8px #88bbff, 14px 8px #88bbff, 16px 8px #88bbff, 18px 8px var(--neon-cyan),
                8px 12px var(--neon-cyan), 10px 12px #88bbff, 12px 12px #aaddff, 14px 12px #fff, 16px 12px #aaddff, 18px 12px #88bbff, 20px 12px var(--neon-cyan),
                6px 16px #5577bb, 8px 16px #88bbff, 10px 16px #88bbff, 12px 16px #aaddff, 14px 16px #88bbff, 16px 16px #aaddff, 18px 16px #88bbff, 20px 16px #88bbff, 22px 16px #5577bb,
                2px 20px #ff44ff, 4px 20px #5577bb, 6px 20px #88bbff, 8px 20px #88bbff, 10px 20px #88bbff, 12px 20px #5577bb, 14px 20px #5577bb, 16px 20px #5577bb, 18px 20px #88bbff, 20px 20px #88bbff, 22px 20px #88bbff, 24px 20px #5577bb, 26px 20px #ff44ff,
                0px 24px #ff44ff, 2px 24px #ff44ff, 4px 24px #5577bb, 6px 24px #5577bb, 8px 24px #5577bb, 20px 24px #5577bb, 22px 24px #5577bb, 24px 24px #5577bb, 26px 24px #ff44ff, 28px 24px #ff44ff,
                8px 28px #fff, 10px 28px #fff, 12px 28px #fff, 18px 28px #fff, 20px 28px #fff, 22px 28px #fff,
                8px 32px var(--neon-cyan), 10px 32px #fff, 12px 32px var(--neon-cyan), 18px 32px var(--neon-cyan), 20px 32px #fff, 22px 32px var(--neon-cyan),
                10px 36px var(--neon-cyan), 20px 36px var(--neon-cyan); }
        #hero .pixel-ship-firing { display:none; }
        #hero.casting .pixel-ship { display:none; }
        #hero.casting .pixel-ship-firing { display:block; }
        #hero.casting { filter:drop-shadow(0 0 30px var(--neon-cyan)) drop-shadow(0 0 60px var(--neon-cyan)) drop-shadow(0 0 90px white); }
        #hero.hurt { animation:heroHurt 0.4s; }
        @keyframes heroHurt { 0%{filter:drop-shadow(0 0 15px var(--neon-cyan));transform:translateX(-50%)}10%{filter:drop-shadow(0 0 40px var(--amber)) brightness(2);transform:translateX(calc(-50% + 8px))}30%{transform:translateX(calc(-50% - 8px))}50%{filter:drop-shadow(0 0 30px var(--amber)) brightness(1.5);transform:translateX(calc(-50% + 4px))}70%{transform:translateX(calc(-50% - 2px))}100%{filter:drop-shadow(0 0 15px var(--neon-cyan));transform:translateX(-50%)} }

        /* PIXEL ALIENS — bigger, answer overlaps body */
        .alien { position:fixed; cursor:crosshair; z-index:50; transition:transform 0.1s;
            filter:drop-shadow(0 0 15px var(--neon-green)); }
        .alien:hover { transform:scale(1.12); z-index:55; filter:drop-shadow(0 0 25px var(--neon-green)) drop-shadow(0 0 40px var(--neon-green)); }
        .alien-sprite { width:90px; height:90px; position:relative; }
        .pixel-alien { width:4px; height:4px; background:transparent; transform:scale(3.5); transform-origin:top left;
            box-shadow: 4px 0 var(--neon-green), 20px 0 var(--neon-green), 4px 4px var(--neon-green), 20px 4px var(--neon-green),
                8px 4px var(--neon-green), 12px 4px var(--neon-green), 16px 4px var(--neon-green),
                4px 8px var(--neon-green), 8px 8px var(--neon-green), 12px 8px var(--neon-green), 16px 8px var(--neon-green), 20px 8px var(--neon-green),
                4px 12px var(--neon-green), 8px 12px var(--neon-yellow), 12px 12px var(--neon-green), 16px 12px var(--neon-yellow), 20px 12px var(--neon-green),
                8px 16px var(--neon-green), 12px 16px #115511, 16px 16px var(--neon-green),
                4px 20px #336633, 8px 20px #336633, 12px 20px #336633, 16px 20px #336633, 20px 20px #336633,
                0px 24px var(--neon-green), 4px 24px #336633, 8px 24px #336633, 12px 24px #336633, 16px 24px #336633, 20px 24px #336633, 24px 24px var(--neon-green),
                0px 28px var(--neon-green), 8px 28px #336633, 12px 28px #336633, 16px 28px #336633, 24px 28px var(--neon-green),
                8px 32px #336633, 16px 32px #336633, 8px 36px var(--neon-green), 16px 36px var(--neon-green); }
        .alien-answer { position:absolute; top:50%; left:50%; transform:translate(-50%,-30%); z-index:10;
            padding:9px 16px; background:rgba(0,0,0,0.88);
            border:3px solid var(--neon-pink); box-shadow:0 0 18px rgba(255,0,255,0.6),inset 0 0 10px rgba(255,0,255,0.15);
            font-family:'Press Start 2P',monospace; font-size:15px; color:var(--neon-pink);
            text-shadow:0 0 12px var(--neon-pink); white-space:nowrap; }
        .alien.dying { animation:alienDie .5s forwards; pointer-events:none; }
        @keyframes alienDie { 0%{transform:scale(1);opacity:1}30%{transform:scale(1.8);filter:brightness(3) drop-shadow(0 0 50px var(--neon-cyan))}100%{transform:scale(0) rotate(180deg);opacity:0} }
        .alien.wrong-marked { pointer-events:none; opacity:.35; filter:grayscale(.8) drop-shadow(0 0 10px var(--amber)); }
        .alien.wrong-marked::after { content:'✕'; position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
            font-size:48px; color:var(--amber); text-shadow:0 0 20px var(--amber),0 0 40px var(--amber); z-index:100; animation:xAppear .3s ease-out; }
        @keyframes xAppear { 0%{transform:translate(-50%,-50%) scale(0) rotate(-45deg);opacity:0}50%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1} }
        .alien.attacking { animation:alienAttack .5s ease-in-out infinite; }
        @keyframes alienAttack { 0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.05) rotate(2deg)} }

        /* Growth mindset + try again */
        .growth-text { position:fixed; font-family:'Press Start 2P',monospace; font-size:11px; color:var(--amber);
            text-shadow:0 0 10px var(--amber),0 0 20px var(--amber); z-index:250; animation:growthFloat 2.5s ease-out forwards; pointer-events:none; white-space:nowrap; }
        @keyframes growthFloat { 0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-100px) scale(.9);opacity:0} }
        .try-again-text { position:fixed; font-family:'Press Start 2P',monospace; font-size:16px; color:var(--amber);
            text-shadow:0 0 10px var(--amber),0 0 20px var(--amber); z-index:250; animation:tryAgainFloat 1s ease-out forwards; pointer-events:none; white-space:nowrap; }
        @keyframes tryAgainFloat { 0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(1.2);opacity:0} }

        /* Laser bolts */
        .laser-bolt { position:fixed; pointer-events:none; z-index:300; }
        .laser-bolt svg { overflow:visible; }
        .laser-bolt path { fill:none; stroke:var(--neon-cyan); stroke-width:5; stroke-linecap:round;
            filter:drop-shadow(0 0 10px var(--neon-cyan)) drop-shadow(0 0 20px var(--neon-cyan)) drop-shadow(0 0 40px white); animation:laserFlash .15s ease-out; }
        .laser-bolt path.core { stroke:white; stroke-width:2; }
        @keyframes laserFlash { 0%,100%{opacity:1}50%{opacity:.5} }
        .amber-bolt { position:fixed; pointer-events:none; z-index:200; }
        .amber-bolt svg { overflow:visible; }
        .amber-bolt path.amber-outer { fill:none; stroke:var(--amber); stroke-width:5; stroke-linecap:round;
            filter:drop-shadow(0 0 10px var(--amber)) drop-shadow(0 0 20px var(--amber)) drop-shadow(0 0 40px #cc6600); animation:amberFlash .2s ease-out; }
        .amber-bolt path.amber-core { fill:none; stroke:#ffe0a0; stroke-width:2; stroke-linecap:round; }
        @keyframes amberFlash { 0%,100%{opacity:1}50%{opacity:.5} }
        .amber-impact { position:fixed; width:60px; height:60px;
            background:radial-gradient(circle,var(--amber) 0%,rgba(232,168,56,0.5) 40%,transparent 70%);
            border-radius:50%; transform:translate(-50%,-50%); z-index:200; animation:impactBurst .3s ease-out forwards; pointer-events:none; }
        @keyframes impactBurst { 0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0} }
        .electric-spark { position:fixed; width:80px; height:80px; pointer-events:none; z-index:250; animation:sparkBurst .5s forwards; }
        @keyframes sparkBurst { 0%{transform:translate(-50%,-50%) scale(.3);opacity:1}50%{transform:translate(-50%,-50%) scale(2);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:0} }
        .spark-line { position:absolute; top:50%; left:50%; width:40px; height:4px;
            background:linear-gradient(90deg,var(--neon-cyan),transparent); transform-origin:left center; box-shadow:0 0 15px var(--neon-cyan); }

        /* Combo / streak */
        .combo-text { position:fixed; top:45%; left:50%; transform:translate(-50%,-50%); font-family:'Press Start 2P',monospace; font-size:36px;
            color:var(--neon-yellow); text-transform:uppercase; text-shadow:0 0 20px var(--neon-yellow),0 0 40px var(--neon-orange),4px 4px 0 var(--neon-pink);
            z-index:250; animation:comboFade 1s forwards; pointer-events:none; }
        @keyframes comboFade { 0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.5);opacity:1}80%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) translateY(-100px) scale(.8);opacity:0} }
        .streak-milestone { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:260; animation:streakAnim 1.5s forwards; pointer-events:none; }
        .streak-msg { font-family:'Press Start 2P',monospace; font-size:32px; color:var(--neon-orange); text-shadow:0 0 20px var(--neon-orange),0 0 40px var(--neon-yellow),0 0 60px var(--neon-pink); margin-bottom:10px; }
        .streak-num { font-family:'Press Start 2P',monospace; font-size:24px; color:var(--neon-yellow); text-shadow:0 0 15px var(--neon-yellow),0 0 30px var(--neon-orange); }
        .streak-challenge { font-family:'Press Start 2P',monospace; font-size:16px; color:var(--neon-cyan); text-shadow:0 0 15px var(--neon-cyan); margin-top:12px; animation:challengePulse .5s ease-in-out infinite alternate; }
        @keyframes challengePulse { 0%{transform:scale(1)}100%{transform:scale(1.05)} }
        @keyframes streakAnim { 0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.3);opacity:1}85%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-50%) scale(.8) translateY(-50px);opacity:0} }
        .streak-milestone.mega-streak { animation:megaStreakAnim 2s forwards; }
        .streak-milestone.mega-streak .streak-msg { font-size:42px; color:#fff; text-shadow:0 0 20px var(--neon-pink),0 0 40px var(--neon-pink),0 0 60px var(--neon-cyan),0 0 80px var(--neon-yellow); animation:rainbowText .5s linear infinite; }
        .streak-milestone.mega-streak .streak-num { font-size:32px; }
        @keyframes megaStreakAnim { 0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:0}10%{transform:translate(-50%,-50%) scale(1.5) rotate(5deg);opacity:1}80%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(.5) translateY(-80px);opacity:0} }
        @keyframes rainbowText { 0%{color:var(--neon-pink)}25%{color:var(--neon-cyan)}50%{color:var(--neon-yellow)}75%{color:var(--neon-green)}100%{color:var(--neon-pink)} }
        .screen-flash { position:fixed;top:0;left:0;right:0;bottom:0;background:white;z-index:1000;animation:screenFlash .5s forwards;pointer-events:none; }
        @keyframes screenFlash { 0%{opacity:.7}100%{opacity:0} }

        /* Missed panel */
        #missed-panel { position:fixed; right:10px; top:60px; width:150px; z-index:50; pointer-events:none; }
        #missed-label { font-size:7px; color:var(--neon-cyan); text-shadow:0 0 5px var(--neon-cyan); margin-bottom:5px; opacity:.8; }
        .missed-equation { font-size:8px; color:var(--amber); text-shadow:0 0 5px rgba(232,168,56,.5); margin-bottom:4px; opacity:.7; }

        /* Overlays */
        .overlay-screen { position:fixed; top:0;left:0;right:0;bottom:0;
            background:radial-gradient(ellipse at center,rgba(10,0,30,0.98) 0%,rgba(5,5,15,0.99) 100%);
            display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:500; text-align:center; padding:20px; }
        .overlay-screen.hidden { display:none; }
        .game-title { font-size:36px; color:var(--neon-pink);
            text-shadow:0 0 20px var(--neon-pink),0 0 40px var(--neon-pink),0 0 60px var(--neon-purple),4px 4px 0 var(--neon-purple);
            margin-bottom:8px; animation:titleGlow 2s ease-in-out infinite alternate; }
        @keyframes titleGlow { 0%{text-shadow:0 0 20px var(--neon-pink),0 0 40px var(--neon-pink),4px 4px 0 var(--neon-purple)}100%{text-shadow:0 0 30px var(--neon-pink),0 0 60px var(--neon-pink),0 0 100px var(--neon-purple),4px 4px 0 var(--neon-purple)} }
        .subtitle { font-size:12px; color:var(--neon-cyan); text-shadow:0 0 10px var(--neon-cyan); margin-bottom:30px; letter-spacing:2px; }
        .demo-box { background:rgba(0,0,0,0.8); border:4px solid var(--neon-green);
            box-shadow:0 0 20px var(--neon-green),inset 0 0 30px rgba(57,255,20,0.1);
            padding:25px 35px; margin-bottom:30px; max-width:520px; }
        .demo-title { font-size:9px; color:var(--neon-yellow); text-shadow:0 0 10px var(--neon-yellow); margin-bottom:12px; }
        .demo-aliens { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
        .demo-alien { display:flex; flex-direction:column; align-items:center; }
        .demo-alien-sprite { font-size:28px; filter:drop-shadow(0 0 8px var(--neon-green)); }
        .demo-alien-answer { margin-top:5px; padding:5px 10px; font-size:10px; border:3px solid; font-family:'Press Start 2P',monospace; }
        .demo-alien-answer.correct { color:var(--neon-green); border-color:var(--neon-green); box-shadow:0 0 12px var(--neon-green); }
        .demo-alien-answer.wrong { color:#555; border-color:#555; }
        .arcade-btn { font-family:'Press Start 2P',monospace; font-size:22px; padding:20px 55px;

    <script>
    // ======================================================================
    // MESSAGES
    // ======================================================================
    const growthMessages = [
        "MISTAKES ARE OK!", "I CAN DO HARD THINGS!", "MATH BUILDS MY BRAIN!",
        "THERE'S ALWAYS ANOTHER WAY!", "I CAN LEARN ANYTHING!", "I BELIEVE IN ME!",
        "TRY A NEW STRATEGY!", "THE PROCESS MATTERS!"
    ];
    const comboMessages = ["ZAP!", "SLAY!", "BOOM!", "NICE!", "EPIC!", "MEGA!", "POW!", "FIRE!"];
    const streakMilestones = ["ON FIRE! 🔥", "UNSTOPPABLE!", "LEGENDARY!", "GODLIKE!", "MYTHICAL!", "TRANSCENDENT!"];

    // ======================================================================
    // FRACTION ENGINE — covers ML 5.02–5.17
    // ======================================================================
    const DENOMS = [2, 3, 4, 6, 8];
    // 6 skill types rotating: identify(5.02-5.05), numberline(5.06-5.07,5.09),
    // equal_one(5.08), equivalent(5.10-5.12), whole_number(5.13-5.14), compare(5.15-5.17)
    const ROUND_TYPES = ['identify', 'numberline', 'equal_one', 'equivalent', 'whole_number', 'compare', 'greater_one'];
    let roundIndex = 0;

    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    function shuffle(a) { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
    function fracStr(n, d) { return n + '/' + d; }

    // ML 5.02-5.05: Identify fractions from shaded shapes
    function genIdentify() { const d = pick(DENOMS), n = randInt(1, d - 1); return { type: 'identify', num: n, den: d, answer: fracStr(n, d), mission: 'What fraction is shaded?', explain: n + '/' + d + ' is shaded' }; }

    // ML 5.06-5.07, 5.09: Locate fractions on number line
    function genNumberLine() { const d = pick(DENOMS), n = randInt(1, d); return { type: 'numberline', num: n, den: d, answer: fracStr(n, d), mission: 'Which fraction is at P?', explain: 'P is at ' + n + '/' + d }; }

    // ML 5.08: Identify fractions equal to 1 (n/n = 1)
    function genEqualOne() {
        const d = pick(DENOMS);
        return { type: 'equal_one', num: d, den: d, answer: fracStr(d, d), mission: 'Which fraction equals 1?', explain: d + '/' + d + ' = 1' };
    }

    // ML 5.10-5.12: Equivalent fractions
    function genEquivalent() {
        const pairs = [{n:1,d:2,eq:[{n:2,d:4},{n:3,d:6},{n:4,d:8}]},{n:1,d:3,eq:[{n:2,d:6}]},{n:1,d:4,eq:[{n:2,d:8}]},{n:2,d:3,eq:[{n:4,d:6}]},{n:2,d:4,eq:[{n:1,d:2},{n:4,d:8}]},{n:3,d:4,eq:[{n:6,d:8}]},{n:2,d:6,eq:[{n:1,d:3}]},{n:3,d:6,eq:[{n:1,d:2},{n:4,d:8}]},{n:4,d:6,eq:[{n:2,d:3}]},{n:2,d:8,eq:[{n:1,d:4}]},{n:4,d:8,eq:[{n:1,d:2},{n:2,d:4},{n:3,d:6}]}];
        const b = pick(pairs), e = pick(b.eq);
        return { type: 'equivalent', num: b.n, den: b.d, equivNum: e.n, equivDen: e.d, answer: fracStr(e.n, e.d), mission: 'Which fraction equals ' + b.n + '/' + b.d + '?', explain: b.n + '/' + b.d + ' = ' + e.n + '/' + e.d };
    }

    // ML 5.13-5.14: Whole numbers as fractions
    function genWholeNumber() { const w = randInt(1, 5), d = pick(DENOMS), n = w * d; return { type: 'whole_number', whole: w, num: n, den: d, answer: fracStr(n, d), mission: 'Which fraction equals ' + w + '?', explain: w + ' = ' + n + '/' + d }; }

    // ML 5.15-5.17: Compare fractions (never =, only < or >)
    // 3 sub-types weighted equally: unit fracs (5.15), same numerator (5.16), same denominator (5.17)
    function genCompare() {
        const r = Math.random(); let n1, d1, n2, d2;
        if (r < 1/3) {
            // ML 5.15: Unit fractions — 1/a vs 1/b
            const ds = shuffle(DENOMS).slice(0, 2); d1 = ds[0]; d2 = ds[1]; n1 = 1; n2 = 1;
        } else if (r < 2/3) {
            // ML 5.16: Same numerator, different denominators
            const ds = shuffle(DENOMS).slice(0, 2); d1 = ds[0]; d2 = ds[1];
            const num = randInt(1, Math.min(d1, d2)); n1 = num; n2 = num;
        } else {
            // ML 5.17: Same denominator, different numerators
            const d = pick(DENOMS); d1 = d; d2 = d;
            n1 = randInt(1, d); n2 = randInt(1, d); while (n1 === n2) n2 = randInt(1, d);
        }
        const v1 = n1/d1, v2 = n2/d2;
        // Guarantee never equal (shouldn't happen with unit/same-den, but safety check)
        if (v1 === v2) { n2 = Math.min(n2 + 1, d2); }
        const sym = (n1/d1 < n2/d2) ? '<' : '>';
        return { type: 'compare', n1, d1, n2, d2, sym, answer: n1+'/'+d1+' '+sym+' '+n2+'/'+d2, mission: n1+'/'+d1+' ☐ '+n2+'/'+d2, explain: n1+'/'+d1+' '+sym+' '+n2+'/'+d2 };
    }

    // ML 5.13: Fractions greater than 1 (improper fractions)
    function genGreaterOne() {
        const d = pick(DENOMS);
        // Numerator is d+1 to d+3 (so fraction is always > 1 but manageable)
        const extra = randInt(1, Math.min(3, d - 1) || 1);
        const n = d + extra;
        return { type: 'greater_one', num: n, den: d, answer: fracStr(n, d), mission: 'Which fraction is greater than 1?', explain: n + '/' + d + ' > 1' };
    }

    function generateMission() {
        const type = ROUND_TYPES[roundIndex % ROUND_TYPES.length]; roundIndex++;
        switch (type) {
            case 'identify': return genIdentify();
            case 'numberline': return genNumberLine();
            case 'equal_one': return genEqualOne();
            case 'equivalent': return genEquivalent();
            case 'whole_number': return genWholeNumber();
            case 'compare': return genCompare();
            case 'greater_one': return genGreaterOne();
        }
    }

    // ======================================================================
    // WRONG ANSWER GENERATORS
    // ======================================================================
    function generateWrongAnswers(m) {
        const correct = m.answer;
        const wrongs = new Set();
        if (m.type === 'compare') {
            // Only 1 wrong answer needed: the opposite symbol
            const wrongSym = m.sym === '<' ? '>' : '<';
            wrongs.add(m.n1+'/'+m.d1+' '+wrongSym+' '+m.n2+'/'+m.d2);
        } else if (m.type === 'equal_one') {
            // ML 5.08: Distractors are fractions NOT equal to 1
            DENOMS.forEach(d => {
                if (d > 1) wrongs.add(fracStr(d - 1, d));  // e.g. 3/4, 5/6
                wrongs.add(fracStr(1, d));                   // e.g. 1/4, 1/6
            });
            // Also add some with numerator > denominator
            DENOMS.forEach(d => { wrongs.add(fracStr(d + 1, d)); });
            wrongs.delete(correct);
            // Remove any fraction that equals 1
            const toDelete = [];
            wrongs.forEach(w => { const pts = w.split('/'); if (parseInt(pts[0]) === parseInt(pts[1])) toDelete.push(w); });
            toDelete.forEach(w => wrongs.delete(w));
        } else if (m.type === 'whole_number') {
            if (m.whole > 1) wrongs.add(fracStr((m.whole - 1) * m.den, m.den));
            wrongs.add(fracStr((m.whole + 1) * m.den, m.den));
            if (m.num !== m.den) wrongs.add(fracStr(m.den, m.num));
            wrongs.add(fracStr(1, m.den));
            DENOMS.forEach(d => { if (d !== m.den) wrongs.add(fracStr(m.whole * d + 1, d)); });
            DENOMS.forEach(d => { if (d !== m.den && m.whole > 1) wrongs.add(fracStr(m.whole * d - 1, d)); });
            const toDelete = [];
            wrongs.forEach(w => { const pts = w.split('/'); if (parseInt(pts[0])/parseInt(pts[1]) === m.whole) toDelete.push(w); });
            toDelete.forEach(w => wrongs.delete(w));
        } else if (m.type === 'equivalent') {
            DENOMS.forEach(d => { for (let n = 1; n <= d; n++) { const f = fracStr(n, d); if (f !== correct && f !== fracStr(m.num, m.den) && n/d !== m.num/m.den) wrongs.add(f); } });
        } else if (m.type === 'greater_one') {
            // Wrongs are fractions ≤ 1 (not greater than 1)
            DENOMS.forEach(d => {
                for (let n = 1; n <= d; n++) wrongs.add(fracStr(n, d));
            });
            wrongs.delete(correct);
            // Remove any fraction > 1 that crept in
            const toDelete = [];
            wrongs.forEach(w => { const pts = w.split('/'); if (parseInt(pts[0]) > parseInt(pts[1])) toDelete.push(w); });
            toDelete.forEach(w => wrongs.delete(w));
        } else {
            // identify, numberline
            if (m.num !== m.den) wrongs.add(fracStr(m.den, m.num));
            if (m.den - m.num > 0) wrongs.add(fracStr(m.den - m.num, m.den));
            if (m.num + 1 <= m.den) wrongs.add(fracStr(m.num + 1, m.den));
            if (m.num - 1 >= 1) wrongs.add(fracStr(m.num - 1, m.den));
            wrongs.add(fracStr(1, m.den));
            // Add wrong-denom versions of the numerator
            DENOMS.forEach(d => { if (d !== m.den) wrongs.add(fracStr(m.num, d)); });
            // Add adjacent fractions from other denoms for variety
            DENOMS.forEach(d => { if (d !== m.den && m.num <= d) wrongs.add(fracStr(Math.min(m.num + 1, d), d)); });
        }
        wrongs.delete(correct);
        // Remove any wrong whose decimal VALUE equals correct's value (equivalent fractions)
        if (m.type !== 'compare') {
            const cPts = correct.split('/'); const cVal = parseInt(cPts[0]) / parseInt(cPts[1]);
            const valDel = [];
            wrongs.forEach(w => { const pts = w.split('/'); if (pts.length === 2 && Math.abs(parseInt(pts[0])/parseInt(pts[1]) - cVal) < 0.0001) valDel.push(w); });
            valDel.forEach(w => wrongs.delete(w));
        }
        const valid = [...wrongs].filter(w => { const pts = w.split('/'); return !pts[1] || (parseInt(pts[0]) > 0 && parseInt(pts[1]) > 0); });
        // Compare gets 1 wrong, all others get 3
        const count = m.type === 'compare' ? 1 : 3;
        return shuffle(valid).slice(0, count);
    }

    // ======================================================================
    // HUD VISUAL BUILDER
    // ======================================================================
    function buildHudVisual(m) {
        const hv = document.getElementById('hud-visual');
        if (m.type === 'identify') {
            let cells = ''; for (let i = 0; i < m.den; i++) cells += '<div class="hud-bar-cell' + (i < m.num ? ' shaded' : '') + '"></div>';
            hv.innerHTML = '<div class="hud-bar">' + cells + '</div>';
        } else if (m.type === 'numberline') {
            const w = 420, mg = 24, ly = 28, sw = (w - mg * 2) / m.den, px = mg + sw * m.num;
            let t = ''; for (let i = 0; i <= m.den; i++) { const x = mg + sw * i; t += '<line x1="'+x+'" y1="'+(ly-12)+'" x2="'+x+'" y2="'+(ly+12)+'" stroke="#00ffff" stroke-width="2.5"/>'; if (i === 0 || i === m.den) t += '<text x="'+x+'" y="'+(ly+28)+'" fill="#ffff00" font-family="Press Start 2P" font-size="12" text-anchor="middle">' + (i === 0 ? '0' : '1') + '</text>'; }
            hv.innerHTML = '<svg class="hud-nl-svg" viewBox="0 0 '+w+' 62" style="width:420px"><line x1="'+mg+'" y1="'+ly+'" x2="'+(w-mg)+'" y2="'+ly+'" stroke="#00ffff" stroke-width="3"/>'+t+'<circle cx="'+px+'" cy="'+ly+'" r="9" fill="#ff00ff" stroke="#fff" stroke-width="2.5"/><text x="'+px+'" y="'+(ly-16)+'" fill="#ff00ff" font-family="Press Start 2P" font-size="12" text-anchor="middle">P</text></svg>';
        } else if (m.type === 'equal_one') {
            // Fully shaded bar (all cells lit) — visual: "this whole bar = 1"
            let cells = ''; for (let i = 0; i < m.den; i++) cells += '<div class="hud-bar-cell shaded"></div>';
            hv.innerHTML = '<div class="hud-bar">' + cells + '</div>';
        } else if (m.type === 'equivalent') {
            let cells = ''; for (let i = 0; i < m.den; i++) cells += '<div class="hud-bar-cell' + (i < m.num ? ' shaded' : '') + '"></div>';
            hv.innerHTML = '<div class="hud-label">' + m.num + '/' + m.den + '</div><div class="hud-bar">' + cells + '</div>';
        } else if (m.type === 'whole_number') {
            const w = 380, mg = 24, ly = 28, mx = m.whole + 1, sw = (w - mg * 2) / mx;
            let t = ''; for (let i = 0; i <= mx; i++) { const x = mg + sw * i; t += '<line x1="'+x+'" y1="'+(ly-12)+'" x2="'+x+'" y2="'+(ly+12)+'" stroke="#00ffff" stroke-width="2.5"/>'; t += '<text x="'+x+'" y="'+(ly+28)+'" fill="#ffff00" font-family="Press Start 2P" font-size="12" text-anchor="middle">'+i+'</text>'; }
            const px = mg + sw * m.whole;
            hv.innerHTML = '<svg class="hud-nl-svg" viewBox="0 0 '+w+' 62" style="width:380px"><line x1="'+mg+'" y1="'+ly+'" x2="'+(w-mg)+'" y2="'+ly+'" stroke="#00ffff" stroke-width="3"/>'+t+'<circle cx="'+px+'" cy="'+ly+'" r="9" fill="#ff00ff" stroke="#fff" stroke-width="2.5"/></svg>';
        } else if (m.type === 'compare') {
            // Both bars = same total width (same whole), cells sized by denominator
            const barW = 200;
            const cw1 = Math.floor(barW / m.d1), cw2 = Math.floor(barW / m.d2);
            let c1 = '', c2 = '';
            for (let i = 0; i < m.d1; i++) c1 += '<div class="hud-bar-cell' + (i < m.n1 ? ' shaded' : '') + '" style="width:'+cw1+'px"></div>';
            for (let i = 0; i < m.d2; i++) c2 += '<div class="hud-bar-cell' + (i < m.n2 ? ' shaded-pink' : '') + '" style="width:'+cw2+'px"></div>';
            hv.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="display:flex;align-items:center;gap:8px"><div class="hud-label" style="font-size:11px">'+m.n1+'/'+m.d1+'</div><div class="hud-bar" style="height:24px;width:'+barW+'px">'+c1+'</div></div><div style="display:flex;align-items:center;gap:8px"><div class="hud-label" style="font-size:11px">'+m.n2+'/'+m.d2+'</div><div class="hud-bar" style="height:24px;width:'+barW+'px">'+c2+'</div></div></div>';
        } else if (m.type === 'greater_one') {
            // Multiple bars: full bars + partial bar
            const fullBars = Math.floor(m.num / m.den);
            const remainder = m.num % m.den;
            let html = '<div style="display:flex;align-items:center;gap:6px">';
            const cw = m.den <= 4 ? '28px' : '20px';
            for (let b = 0; b < fullBars; b++) {
                html += '<div class="hud-bar" style="height:28px">';
                for (let i = 0; i < m.den; i++) html += '<div class="hud-bar-cell shaded" style="width:'+cw+'"></div>';
                html += '</div>';
            }
            if (remainder > 0) {
                html += '<div class="hud-bar" style="height:28px">';
                for (let i = 0; i < m.den; i++) html += '<div class="hud-bar-cell' + (i < remainder ? ' shaded' : '') + '" style="width:'+cw+'"></div>';
                html += '</div>';
            }
            html += '</div>';
            hv.innerHTML = html;
        }
    }

    // ======================================================================
    // GAME STATE
    // ======================================================================
    const container = document.getElementById('game-container');
    let gameState = 'start', gamePaused = false;
    let score = 0, streak = 0, bestStreak = 0, health = 100;
    let questionsAnswered = 0, incorrectAnswers = 0;
    let missedProblems = [];
    let aliens = [], alienSpeed = 0.25;
    let currentMission = null, gameLoop = null;

    // ======================================================================
    // STARS
    // ======================================================================
    (function createStars() {
        const s = document.getElementById('stars');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div'); star.className = 'star';
            star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = (Math.random() * 2) + 's'; star.style.opacity = 0.3 + Math.random() * 0.7;
            s.appendChild(star);
        }
    })();

    // ======================================================================
    // SPAWN ALIENS
    // ======================================================================
    function spawnNewQuestion() {
        aliens.forEach(a => a.el.remove()); aliens = [];
        currentMission = generateMission();
        document.getElementById('mission-text').textContent = currentMission.mission;
        buildHudVisual(currentMission);

        const wrongs = generateWrongAnswers(currentMission);
        const answers = [currentMission.answer];
        wrongs.forEach(w => { if (!answers.includes(w)) answers.push(w); });

        // Compare = 2 aliens, everything else = 4
        const targetCount = currentMission.type === 'compare' ? 2 : 4;
        while (answers.length < targetCount) { answers.push(fracStr(randInt(1, 8), pick(DENOMS))); }
        const shuffled = shuffle(answers.slice(0, targetCount));

        // Wider spacing for 2 aliens, normal for 4
        const alienW = targetCount === 2 ? 200 : 145;
        const totalW = (shuffled.length - 1) * alienW;
        const startX = (window.innerWidth - totalW) / 2;
        const y = 240; // below top bar (50px) + large mission box (~180px) + gap

        shuffled.forEach((answer, i) => {
            const el = document.createElement('div'); el.className = 'alien'; el.dataset.answer = answer;
            const x = startX + i * alienW;
            el.style.left = x + 'px'; el.style.top = y + 'px';
            el.innerHTML = '<div class="alien-sprite"><div class="pixel-alien"></div><div class="alien-answer">' + answer + '</div></div>';
            el.addEventListener('click', () => handleAlienClick(el));
            container.appendChild(el);
            aliens.push({ el, x, y, answer, isCorrect: answer === currentMission.answer, attacking: false });
        });
    }

    // ======================================================================
    // HANDLE ALIEN CLICK
    // ======================================================================
    function handleAlienClick(alienEl) {
        if (gameState !== 'playing' || gamePaused) return;
        if (alienEl.classList.contains('wrong-marked') || alienEl.classList.contains('dying')) return;
        initAudio();
        const answer = alienEl.dataset.answer;
        const isCorrect = answer === currentMission.answer;

        if (isCorrect) {
            const hero = document.getElementById('hero');
            hero.classList.add('casting'); setTimeout(() => hero.classList.remove('casting'), 400);
            const heroRect = hero.getBoundingClientRect();
            const heroX = heroRect.left + heroRect.width / 2, heroY = heroRect.top;
            const alienRect = alienEl.getBoundingClientRect();
            const targetX = alienRect.left + alienRect.width / 2, targetY = alienRect.top + alienRect.height / 2;

            playSound('laser');
            createLaserBolt(heroX, heroY, targetX, targetY);
            createElectricSpark(targetX, targetY);
            alienEl.classList.add('dying');

            aliens.filter(a => a.el !== alienEl).forEach((a, i) => {
                setTimeout(() => {
                    if (a.el && a.el.parentNode) {
                        const r = a.el.getBoundingClientRect();
                        createLaserBolt(targetX, targetY, r.left + r.width/2, r.top + r.height/2);
                        createElectricSpark(r.left + r.width/2, r.top + r.height/2);
                        playSound('chain'); a.el.classList.add('dying');
                    }
                }, (i + 1) * 80);
            });

            score += 15 + streak * 2; streak++;
            if (streak > bestStreak) bestStreak = streak;
            questionsAnswered++;
            if (streak > 0 && streak % 5 === 0) {
                const idx = Math.min(Math.floor(streak / 5) - 1, streakMilestones.length - 1);
                showStreakMilestone(streakMilestones[idx], streak);
            }
            if (questionsAnswered % 5 === 0) alienSpeed = Math.min(0.7, alienSpeed + 0.04);
            updateHUD(); showComboText();
            setTimeout(spawnNewQuestion, 500);
        } else {
            playSound('hit'); alienEl.classList.add('wrong-marked');
            incorrectAnswers++; health -= 10;
            const desc = currentMission.explain;
            if (!missedProblems.includes(desc)) missedProblems.push(desc);
            const alienRect = alienEl.getBoundingClientRect();
            const heroEl = document.getElementById('hero');
            const heroRect = heroEl.getBoundingClientRect();
            createRedBolt(alienRect.left + alienRect.width/2, alienRect.top + alienRect.height/2, heroRect.left + heroRect.width/2, heroRect.top + heroRect.height/2);
            heroEl.classList.add('hurt'); setTimeout(() => heroEl.classList.remove('hurt'), 400);
            const gt = document.createElement('div'); gt.className = 'growth-text';
            gt.textContent = growthMessages[Math.floor(Math.random() * growthMessages.length)];
            gt.style.left = '50%'; gt.style.top = '55%'; gt.style.transform = 'translateX(-50%)';
            container.appendChild(gt); setTimeout(() => gt.remove(), 2500);
            updateHUD();
            if (health <= 0) gameOver();
        }
    }

    // ======================================================================
    // ALIEN MOVEMENT
    // ======================================================================
    function moveAliens() {
        const hero = document.getElementById('hero');
        const heroRect = hero.getBoundingClientRect();
        const heroY = heroRect.top;
        const maxY = heroY - 90; // aliens stop above the ship
        aliens.forEach(a => {
            if (a.el.classList.contains('dying') || a.el.classList.contains('wrong-marked')) return;
            a.y += alienSpeed;
            if (a.y > maxY) a.y = maxY; // clamp — never drift past ship
            a.el.style.top = a.y + 'px';
            if (a.y >= maxY && !a.attacking) {
                a.attacking = true; health -= 5;
                hero.classList.add('hurt'); setTimeout(() => hero.classList.remove('hurt'), 300);
                playSound('hit'); updateHUD();
                if (health <= 0) gameOver();
            }
        });
    }

    // ======================================================================
    // VISUAL EFFECTS
    // ======================================================================
    function generateBoltPath(x1, y1, x2, y2) {
        const pts = [{ x: x1, y: y1 }]; const segs = 6 + Math.floor(Math.random() * 3);
        const dx = (x2 - x1) / segs, dy = (y2 - y1) / segs;
        for (let i = 1; i < segs; i++) pts.push({ x: x1 + dx*i + (Math.random()-.5)*40, y: y1 + dy*i + (Math.random()-.5)*25 });
        pts.push({ x: x2, y: y2 }); return 'M ' + pts.map(p => p.x + ' ' + p.y).join(' L ');
    }
    function createLaserBolt(x1, y1, x2, y2) {
        const bolt = document.createElement('div'); bolt.className = 'laser-bolt';
        const path = generateBoltPath(x1, y1, x2, y2);
        bolt.innerHTML = '<svg width="100%" height="100%" style="position:fixed;top:0;left:0;pointer-events:none"><path d="' + path + '"/><path d="' + path + '" class="core"/></svg>';
        container.appendChild(bolt); setTimeout(() => bolt.remove(), 150);
    }
    function createRedBolt(x1, y1, x2, y2) {
        const bolt = document.createElement('div'); bolt.className = 'red-bolt';
        const path = generateBoltPath(x1, y1, x2, y2);
        bolt.innerHTML = '<svg width="100%" height="100%" style="position:fixed;top:0;left:0;pointer-events:none"><path d="' + path + '" class="red-outer"/><path d="' + path + '" class="red-core"/></svg>';
        container.appendChild(bolt); setTimeout(() => bolt.remove(), 200);
    }
    function createElectricSpark(x, y) {
        const spark = document.createElement('div'); spark.className = 'electric-spark';
        spark.style.left = x + 'px'; spark.style.top = y + 'px';
        for (let i = 0; i < 10; i++) { const line = document.createElement('div'); line.className = 'spark-line'; line.style.transform = 'rotate(' + (i * 36) + 'deg)'; spark.appendChild(line); }
        container.appendChild(spark); setTimeout(() => spark.remove(), 500);
    }
    function showComboText(text) {
        const el = document.createElement('div'); el.className = 'combo-text';
        el.textContent = text || comboMessages[Math.floor(Math.random() * comboMessages.length)];
        container.appendChild(el); setTimeout(() => el.remove(), 1000);
    }
    function showStreakMilestone(msg, num) {
        const isMega = num % 10 === 0;
        const el = document.createElement('div'); el.className = 'streak-milestone' + (isMega ? ' mega-streak' : '');
        el.innerHTML = '<div class="streak-msg">' + msg + '</div><div class="streak-num">' + (isMega ? '🔥 ' : '') + num + ' STREAK!' + (isMega ? ' 🔥' : '') + '</div>';
        container.appendChild(el); setTimeout(() => el.remove(), isMega ? 2000 : 1500);
        if (isMega) { const flash = document.createElement('div'); flash.className = 'screen-flash'; container.appendChild(flash); setTimeout(() => flash.remove(), 500); playSound('megaStreak'); }
    }

    // ======================================================================
    // HUD
    // ======================================================================
    function updateHUD() {
        document.getElementById('score').textContent = score;
        document.getElementById('streak').textContent = streak + '⚡';
        document.getElementById('questions').textContent = questionsAnswered;
        const fill = document.getElementById('health-fill');
        fill.style.width = Math.max(0, health) + '%';
        fill.className = health > 60 ? '' : health > 30 ? 'hurt' : 'danger';
    }

    // ======================================================================
    // GAME OVER
    // ======================================================================
    function gameOver() {
        gameState = 'gameover'; gamePaused = true; playSound('die');
        if (gameLoop) cancelAnimationFrame(gameLoop);
        const goTitle = document.getElementById('go-title');
        goTitle.textContent = questionsAnswered >= 15 ? "YOU'RE A MATHEMATICIAN!" : 'GAME OVER';
        goTitle.className = 'go-title' + (questionsAnswered >= 15 ? ' won' : '');
        document.getElementById('final-score').textContent = score;
        document.getElementById('final-streak').textContent = bestStreak;
        document.getElementById('final-questions').textContent = questionsAnswered;
        const missedSection = document.getElementById('final-missed-section');
        const missedList = document.getElementById('final-missed-list');
        missedList.innerHTML = '';
        if (missedProblems.length > 0) {
            missedSection.style.display = 'block';
            missedProblems.forEach(eq => { const d = document.createElement('div'); d.className = 'missed-eq'; d.textContent = eq; missedList.appendChild(d); });
        } else { missedSection.style.display = 'none'; }
        document.getElementById('game-over').classList.remove('hidden');
    }

    // ======================================================================
    // GAME LOOP
    // ======================================================================
    function update() {
        if (gameState === 'playing' && !gamePaused) moveAliens();
        if (gameState === 'playing') gameLoop = requestAnimationFrame(update);
    }

    // ======================================================================
    // SOUND
    // ======================================================================
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(type) {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        if (type === 'laser') { o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.linearRampToValueAtTime(220, t+.12); g.gain.setValueAtTime(.15, t); g.gain.linearRampToValueAtTime(0, t+.15); o.start(); o.stop(t+.15); }
        else if (type === 'chain') { o.type = 'square'; o.frequency.setValueAtTime(600, t); o.frequency.linearRampToValueAtTime(200, t+.08); g.gain.setValueAtTime(.08, t); g.gain.linearRampToValueAtTime(0, t+.1); o.start(); o.stop(t+.1); }
        else if (type === 'hit') { o.type = 'sawtooth'; o.frequency.setValueAtTime(150, t); o.frequency.linearRampToValueAtTime(80, t+.3); g.gain.setValueAtTime(.12, t); g.gain.linearRampToValueAtTime(0, t+.3); o.start(); o.stop(t+.3); }
        else if (type === 'die') { o.type = 'sawtooth'; o.frequency.setValueAtTime(300, t); o.frequency.linearRampToValueAtTime(50, t+.8); g.gain.setValueAtTime(.15, t); g.gain.linearRampToValueAtTime(0, t+.8); o.start(); o.stop(t+.8); }
        else if (type === 'megaStreak') { o.type = 'square'; o.frequency.setValueAtTime(523, t); o.frequency.setValueAtTime(659, t+.1); o.frequency.setValueAtTime(784, t+.2); o.frequency.setValueAtTime(1047, t+.3); g.gain.setValueAtTime(.12, t); g.gain.linearRampToValueAtTime(0, t+.5); o.start(); o.stop(t+.5); }
    }

    // ======================================================================
    // TEST FRAMEWORK
    // ======================================================================
    function runMathTests(numTests, verbose) {
        let passed = 0, failed = 0; const errors = [], typeCounts = {}; const savedRI = roundIndex;
        for (let i = 0; i < numTests; i++) {
            const m = generateMission(); typeCounts[m.type] = (typeCounts[m.type] || 0) + 1;
            const wrongs = generateWrongAnswers(m); const allAnswers = [m.answer, ...wrongs];
            const issues = [];
            const expectedWrongs = m.type === 'compare' ? 1 : 3;
            if (wrongs.length < Math.min(expectedWrongs, 2)) issues.push('Too few wrongs: ' + wrongs.length);
            if (wrongs.includes(m.answer)) issues.push('Wrong = correct');
            if (new Set(allAnswers).size !== allAnswers.length) issues.push('Duplicates');
            if (m.type === 'compare') {
                const v1 = m.n1/m.d1, v2 = m.n2/m.d2;
                if (v1 === v2) issues.push('Compare produces equal');
                let ex; if (v1 < v2) ex = '<'; else ex = '>'; if (ex !== m.sym) issues.push('Compare math wrong');
                if (m.sym !== '<' && m.sym !== '>') issues.push('Compare has = symbol');
                if (wrongs.length !== 1) issues.push('Compare should have 1 wrong, got ' + wrongs.length);
            }
            if (m.type === 'equal_one') {
                if (m.num !== m.den) issues.push('equal_one: num!=den');
                if (m.num/m.den !== 1) issues.push('equal_one: not 1');
                wrongs.forEach(w => { const pts = w.split('/'); if (parseInt(pts[0]) === parseInt(pts[1])) issues.push('equal_one wrong=1: ' + w); });
            }
            if (m.type === 'equivalent' && m.num/m.den !== m.equivNum/m.equivDen) issues.push('Equiv wrong');
            if (m.type === 'whole_number') { if (m.num/m.den !== m.whole) issues.push('Whole wrong'); wrongs.forEach(w => { const pts = w.split('/'); if (pts.length === 2 && parseInt(pts[0])/parseInt(pts[1]) === m.whole) issues.push('Wrong=whole:' + w); }); }
            if (m.type === 'greater_one') {
                if (m.num <= m.den) issues.push('greater_one: not > 1');
                wrongs.forEach(w => { const pts = w.split('/'); if (parseInt(pts[0]) > parseInt(pts[1])) issues.push('greater_one wrong > 1: ' + w); });
            }
            if (issues.length === 0) passed++; else { failed++; if (errors.length < 10) errors.push('#'+(i+1)+' ['+m.type+']:'+issues.join('; ')); }
        }
        roundIndex = savedRI;
        if (verbose) { console.log('Tests:', passed + '/' + numTests); console.log('Dist:', typeCounts); if (errors.length > 0) console.log('Errors:', errors); }
        return { success: failed === 0, passed, failed, errors, typeCounts };
    }

    // ======================================================================
    // START / RESTART
    // ======================================================================
    function startGame() {
        initAudio(); gameState = 'playing';
        score = 0; streak = 0; bestStreak = 0; health = 100;
        questionsAnswered = 0; incorrectAnswers = 0;
        missedProblems = []; alienSpeed = 0.25; roundIndex = 0; gamePaused = false;
        aliens.forEach(a => a.el.remove()); aliens = [];
        updateHUD();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        if (gameLoop) cancelAnimationFrame(gameLoop);
        spawnNewQuestion();
        gameLoop = requestAnimationFrame(update);
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);
    </script>
</body>
